<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0b">
<meta name="description" content="살아남아야 한다 — 균열이 열리고, 괴물들이 도시를 짓밟았다. 그로부터 두 달. 다크 텍스트 로그라이크.">
<title>살아남아야 한다</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0c0c0b;
  --panel: #141412;
  --panel-2: #1b1a17;
  --line: #2b2925;
  --ink: #d9d3c5;
  --bone: #efe9d8;
  --dim: #8c867a;
  --faint: #5f5b52;
  --rust: #cfc8b6;      /* 강조: 색 없이 밝기로만 */
  --rust-dim: #55514a;
  --good: #cfc8b6;
  --warn: #c2a06a;
  --bad: #c36f5c;
  --mon: #c4483b;       /* 괴물 */
  --item: #d6b25e;      /* 물건 */
  --who: #8db3ab;       /* 사람 이름 */
  --serif: 'Noto Serif KR', 'Noto Serif CJK KR', 'Nanum Myeongjo', 'Apple SD Gothic Neo', serif;
  --sans: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
* { box-sizing: border-box; }
html { color-scheme: dark; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  margin: 0; background: #0c0c0b; background: var(--bg); color: var(--ink); height: 100%;
  font-family: var(--serif); font-size: 17px; line-height: 1.8; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-text-size-adjust: 100%; overscroll-behavior: none;
  position: fixed; inset: 0; overflow: hidden;   /* 화면 전체는 움직이지 않는다. 움직이는 것은 글 칸 · 가방 · 수첩뿐 */
}
html, body, #app { touch-action: pan-y; }   /* 핀치 확대 · 두 번 눌러 확대를 막는다 */
.page, .sheet-body, .dock { overflow-x: hidden; }
button { touch-action: manipulation; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }

/* 화면 하나가 곧 한 장. 바깥은 움직이지 않고, 글이 쌓이는 자리만 위아래로 움직인다. */
#app { height: 100vh; height: 100dvh; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; padding: 0 16px; overflow: hidden; }
.page { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; animation: rise 0.3s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .page, .sheet, .entry.new, .sn.rise, .entry.rise { animation: none !important; } }

/* ---------------------------------------------------------------- 머리 */
.hud { flex: none; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 0 9px; font-family: var(--sans); font-size: 13px; color: var(--dim); }
.top .when { color: var(--bone); }
.top .when b { font-weight: 600; }
.top .when i { font-style: normal; color: var(--faint); }
.top .tools { display: flex; gap: 6px; }
.tool { background: none; border: 1px solid var(--line); border-radius: 3px; padding: 7px 11px; font-family: var(--sans); font-size: 13px; color: var(--ink); line-height: 1.2; }
.tool .n { color: var(--dim); margin-left: 4px; }
.tool.full .n { color: var(--bad); }
.vitals { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 18px; padding: 9px 0 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-family: var(--sans); font-size: 12px; color: var(--dim); }
.vital { display: flex; align-items: center; gap: 8px; }
.vital .k { width: 3.2em; flex: none; }
.pips { display: flex; gap: 2px; flex: 1; }
.pip { height: 6px; flex: 1; background: var(--line); border-radius: 1px; }
.pip.on { background: var(--ink); }
.vital.low .pip.on { background: var(--bad); }
.vital.ero .pip.on { background: #7d6ea8; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 7px 0 0; font-family: var(--sans); font-size: 12px; }
.tag { border: 1px solid var(--line); color: var(--dim); padding: 0 8px; border-radius: 2px; }
.tag.bad { color: var(--bad); border-color: var(--rust-dim); }

/* ---------------------------------------------------------------- 쌓이는 글 */
.log { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; position: relative; padding: 16px 0 28px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.entry { margin: 0 0 12px; }
.entry.old { opacity: 0.62; }
.entry.new { animation: rise 0.35s ease-out; }
.place { font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; color: var(--dim); margin: 4px 0 8px; }
.text { color: var(--bone); font-size: 18px; line-height: 1.95; }
.text.move { color: var(--ink); }
.pick { font-size: 15.5px; color: var(--dim); padding-left: 12px; border-left: 2px solid var(--rust-dim); margin: 16px 0 12px; }
.note { font-size: 15.5px; color: var(--ink); }
.fxl { font-family: var(--sans); font-size: 12.5px; color: var(--dim); margin-top: -4px; }
.fxl .minus { color: var(--bad); } .fxl .plus { color: var(--good); } .fxl .get { color: var(--ink); }
/* 색은 세 가지만: 괴물 · 물건 · 사람 */
.mon { color: var(--mon); }
.who { color: var(--who); }
.item { color: var(--item); font-weight: 500; }
/* 한 줄씩 떠오르기 */
.sn.hid, .entry.hid { opacity: 0; animation: none; }
.sn.rise, .entry.rise { animation: fadein 0.45s ease-out; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.dock.wait { opacity: 0.28; pointer-events: none; }
.foot .pace { margin-left: 12px; font-size: 12.5px; color: var(--dim); border-bottom-color: var(--line); }
.time { display: flex; align-items: center; gap: 10px; font-family: var(--sans); font-size: 11.5px; letter-spacing: 0.16em; color: var(--faint); margin: 22px 0 14px; }
.time::before, .time::after { content: ''; height: 1px; background: var(--line); flex: 1; }

/* ---------------------------------------------------------------- 고를 것 */
.dock { flex: none; max-height: 35vh; max-height: 35dvh; overflow-y: auto; overscroll-behavior: contain; transition: opacity 0.25s; border-top: 1px solid var(--line); padding: 10px 0 14px; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
.group { font-family: var(--sans); font-size: 11px; letter-spacing: 0.2em; color: var(--faint); margin: 10px 0 6px; }
.choices { display: flex; flex-direction: column; gap: 6px; }
.choices.two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.choices + .choices { margin-top: 6px; }
.choice { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; width: 100%; min-height: 44px;
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--faint); border-radius: 2px; padding: 8px 12px; line-height: 1.4; }
.choice:active:not(:disabled) { background: #22201c; }
.choice .l { display: block; color: var(--bone); font-size: 16px; }
.choice .s { display: block; font-family: var(--sans); font-size: 12px; color: var(--dim); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.choice > span:first-child { min-width: 0; }
.choice .o { flex: none; font-family: var(--sans); font-size: 12.5px; white-space: nowrap; }
.choice:disabled { cursor: default; opacity: 0.5; border-left-color: var(--line); }
.choice.go { border-left-color: #4a4841; }
.choice.main { border-left-color: var(--rust); }
.o.o1 { color: var(--ink); } .o.o2 { color: var(--dim); } .o.o3 { color: var(--warn); } .o.o4 { color: #c88a62; } .o.o5 { color: var(--bad); }

/* ---------------------------------------------------------------- 첫 화면 */
.title { justify-content: center; padding: 0 0 8vh; }
.title h1 { font-size: 42px; line-height: 1.22; font-weight: 600; color: var(--bone); margin: 0 0 18px; letter-spacing: -0.01em; }
.title h1 span { color: var(--dim); }
.title p { margin: 0 0 4px; color: var(--dim); font-size: 16.5px; }
.menu { display: flex; flex-direction: column; gap: 8px; margin-top: 30px; }
.menu .choice { min-height: 52px; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; font-family: var(--sans); font-size: 12.5px; color: var(--faint); }
.link { background: none; border: 0; border-bottom: 1px solid var(--faint); padding: 2px 0; font-family: var(--sans); font-size: 14px; color: var(--ink); }
.home { display: inline-block; margin-top: 26px; font-family: var(--sans); font-size: 12.5px; color: var(--faint); text-decoration: none; }

/* ---------------------------------------------------------------- 사람 고르기: 한 화면에 다섯 개까지, 밀어 내리는 일 없이 */
.create { padding: 14px 0 18px; }
.steps { display: flex; gap: 4px; flex: none; }
.steps i { height: 2px; flex: 1; background: var(--line); }
.steps i.on { background: var(--rust); }
.ask { font-size: 22px; font-weight: 600; color: var(--bone); margin: 22px 0 14px; line-height: 1.45; flex: none; }

.opts { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
.opt { display: flex; flex-direction: column; justify-content: center; width: 100%; flex: 1; max-height: 96px; min-height: 0; overflow: hidden; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--faint); border-radius: 2px; padding: 6px 14px; line-height: 1.4; }
.opt.on { border-color: var(--rust); background: #1f1e1a; }
.opt:disabled { opacity: 0.4; cursor: default; }
.opt b { display: block; color: var(--bone); font-weight: 600; font-size: 17.5px; }
.opt span { display: block; color: var(--ink); font-size: 14px; line-height: 1.5; margin-top: 1px; opacity: 0.8; }
.opt em { display: block; font-style: normal; font-family: var(--sans); font-size: 12px; color: var(--dim); margin-top: 2px; }
.opt.mbti b { font-family: var(--sans); letter-spacing: 0.2em; font-size: 17px; }
.nav { display: flex; gap: 8px; margin-top: 14px; flex: none; }
.btn { flex: 1; background: var(--rust); border: 1px solid var(--rust); color: #12110f; font-weight: 600; border-radius: 2px; padding: 12px 14px; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.ghost { background: none; border-color: var(--line); color: var(--dim); font-weight: 400; flex: 0 0 auto; font-family: var(--sans); font-size: 14px; }

/* ---------------------------------------------------------------- 결말 */
.end { justify-content: center; padding: 20px 0 6vh; }
.end .kind { font-family: var(--sans); font-size: 12px; letter-spacing: 0.24em; color: var(--bad); }
.end .kind.alive { color: var(--bone); }
.end h2 { font-size: 32px; font-weight: 600; color: var(--bone); margin: 8px 0 16px; line-height: 1.35; }
.end .text { margin: 0; }
.end .epitaph { font-family: var(--sans); font-size: 13px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 12px; margin-top: 20px; }
.end .new { color: var(--warn); margin-top: 4px; }

/* ---------------------------------------------------------------- 가방 · 수첩 */
.veil { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 10; }
.sheet { position: fixed; z-index: 11; left: 0; right: 0; bottom: 0; top: 6vh; margin: 0 auto; max-width: 620px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 6px 6px 0 0; display: flex; flex-direction: column; animation: up 0.2s ease-out; }
@keyframes up { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); font-family: var(--sans); }
.sheet-head h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--bone); }
.sheet-head .cap { font-size: 12.5px; color: var(--dim); margin-left: 8px; font-weight: 400; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 16px 28px; flex: 1; }
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 8px 12px 0; border-bottom: 1px solid var(--line); font-family: var(--sans); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; font-size: 13.5px; color: var(--dim); }
.tab.on { color: var(--bone); border-bottom-color: var(--rust); }
.row { padding: 13px 0; border-bottom: 1px solid var(--line); }
.row h4 { margin: 0; font-size: 16.5px; font-weight: 600; color: var(--bone); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.row h4 small { font-family: var(--sans); font-weight: 400; font-size: 12px; color: var(--dim); }
.row p { margin: 3px 0 0; font-size: 15px; color: var(--ink); line-height: 1.7; }
.row .meta { font-family: var(--sans); font-size: 12px; color: var(--dim); margin-top: 5px; }
.row.unknown h4 { color: var(--faint); }
.row.unknown p { color: var(--faint); }
.row .acts { display: flex; gap: 6px; margin-top: 9px; }
.mini { background: none; border: 1px solid var(--line); border-radius: 2px; padding: 6px 12px; font-family: var(--sans); font-size: 13px; color: var(--ink); line-height: 1.3; }
.mini.use { border-color: var(--rust-dim); color: var(--bone); }
.notes { list-style: none; margin: 8px 0 0; padding: 0; font-size: 15px; line-height: 1.65; }
.notes li { padding-left: 4.6em; position: relative; margin-top: 2px; }
.notes li::before { position: absolute; left: 0; top: 2px; font-family: var(--sans); font-size: 11.5px; width: 4.2em; }
.notes .like::before { content: '좋아한다'; color: var(--good); }
.notes .dislike::before { content: '싫어한다'; color: var(--bad); }
.notes .note::before { content: '알게 된 것'; color: var(--dim); }
.empty { color: var(--faint); padding: 26px 0; font-size: 15px; }
.toast { margin: 10px 0 0; padding: 9px 12px; background: var(--panel-2); border-left: 2px solid var(--rust); font-family: var(--sans); font-size: 13px; color: var(--ink); }
.sub-head { font-family: var(--sans); font-size: 11px; letter-spacing: 0.2em; color: var(--faint); margin: 18px 0 0; }
.wipe { margin: 26px 0 0; font-family: var(--sans); font-size: 12.5px; color: var(--faint); }
.wipe button { background: none; border: 0; border-bottom: 1px solid var(--line); padding: 0; color: var(--dim); font-size: 12.5px; }
.wipe button.sure { color: var(--bad); border-color: var(--rust-dim); }

@media (max-width: 380px), (max-height: 700px) {
  body { font-size: 16px; }
  .text { font-size: 17px; line-height: 1.85; }
  .title h1 { font-size: 36px; }
  .ask { font-size: 20px; margin: 14px 0 10px; }
  .opt b { font-size: 16.5px; } .opt span { font-size: 13px; }
  .opts { gap: 6px; }
  .vitals { gap: 5px 12px; }
}

/* 마우스가 있는 기기에서만 hover 강조 — 손가락으로 누른 자리가 다음 화면에서 눌린 채 보이지 않게 */
@media (hover: hover) and (pointer: fine) {
  .tool:hover { border-color: var(--faint); }
  .choice:hover:not(:disabled) { border-left-color: var(--rust); background: var(--panel-2); }
  .link:hover { color: var(--bone); border-color: var(--rust); }
  .home:hover { color: var(--dim); }
  .opt:hover:not(:disabled) { background: var(--panel-2); border-left-color: var(--rust); }
  .btn:hover { background: #efe9d8; }
  .btn.ghost:hover { border-color: var(--faint); background: none; }
  .mini:hover { border-color: var(--faint); }
}
.page.end { overflow-y: auto; }   /* 결말 글이 길면 그 글만 움직인다 */

/* ---------------------------------------------------------------- 그림 */
.pic { margin: 2px 0 12px; height: 30vh; height: 30dvh; max-height: 300px; overflow: hidden; }
.pic img { display: block; width: 100%; height: 100%; object-fit: cover;
  -webkit-mask-image: radial-gradient(ellipse 80% 76% at 50% 50%, #000 70%, transparent 100%); mask-image: radial-gradient(ellipse 80% 76% at 50% 50%, #000 70%, transparent 100%); }
.pic.night img { filter: brightness(0.78); }
.pic.tall { height: 46vh; height: 46dvh; max-height: 440px; }
.pic.tall img { object-fit: contain; }
.entry.old.pic { opacity: 0.8; }
.endpic { display: block; width: 100%; margin: 0 0 14px; max-height: 34vh; object-fit: cover; flex: none;
  -webkit-mask-image: radial-gradient(ellipse 80% 78% at 50% 50%, #000 68%, transparent 100%); mask-image: radial-gradient(ellipse 80% 78% at 50% 50%, #000 68%, transparent 100%); }
.page.end:has(.endpic) { justify-content: flex-start; padding-top: 8px; }
.rowpic { display: block; width: 100%; max-height: 300px; object-fit: cover; margin: 4px 0 10px; border-radius: 2px; }
.rowpic.tall { max-height: 380px; object-fit: contain; background: #000; }
/* 첫 화면: 그림 위로 제목, 아래로 고를 것 */
.title.has-bg { position: relative; justify-content: space-between; padding: 1.5vh 16px 3vh; margin: 0 -16px; }
.title-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 70%; opacity: 0.95; z-index: 0; pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 96%); mask-image: linear-gradient(to bottom, #000 55%, transparent 96%); }
.title .head, .title .bottom { position: relative; z-index: 1; }
.title .bottom { background: linear-gradient(to bottom, transparent, var(--bg) 26%); padding-top: 26px; }
.title.has-bg .menu { margin-top: 0; }
.title h1.logo { margin: 0 0 6px; }
.title h1.logo img { display: block; width: 100%; max-width: 560px; height: auto; margin-left: -2%; }
/* 첫 화면 문장: 그림의 검은 하늘 가운데에 두고, 건물과 겹쳐도 읽히게 그림자를 깐다 */
.title.has-bg .head p { text-align: center; color: var(--bone); font-size: 15.5px; margin: 0 0 2px;
  text-shadow: 0 0 6px #000, 0 0 12px #000, 0 0 18px #000, 0 1px 2px #000; }
.title.has-bg .title-bg { top: 10vh; height: calc(100% - 10vh); left: 0; width: 100%;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 58%, transparent 97%); mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 58%, transparent 97%); }
</style>
</head>

  d_water:    { kind: 'dead', title: '고인 물', hint: '고인 물을 가리지 않고 마시면.', text: '고여 있던 그 물은 눈으로 보기에는 맑았다. 마신 지 이틀이 지나자 설사와 구토가 멎지 않아서, 먹고 마신 것은 무엇 하나 몸 안에 남아나지 않았다. 목이 타서 다시 물을 마시면 마신 만큼 곧바로 쏟아 냈다. 나중에는 물병을 입까지 들어 올릴 힘이 없어서, 물을 옆에 둔 채로 누워 있었다.' },
  d_gitae:    { kind: 'dead', title: '방망이의 이름', hint: '믿고 곁에 둔 사람에게.', text: '기태는 여전히 웃는 얼굴로 방망이를 머리 위로 들어 올렸다. 손잡이에 감긴 테이프가 눈앞에 왔을 때, 나는 거기 적힌 이름이 기태의 이름이 아니라는 것을 처음으로 알아봤다. 방망이가 내려오는 것을 보면서, 그 이름의 주인이 어떻게 되었는지도 알았다.' },
  d_apt:      { kind: 'dead', title: '외부인', hint: '아파트 정문에서 외부인으로 몰리면.', text: '"우리 주민이 아닙니다." 허 사장은 골프채 끝으로 정문 밖을 가리키며 그렇게 말했다. 밤이 되자 노란 끈을 묶은 남자들이 나를 정문 밖으로 끌어내 길바닥에 내려놓았고, 문은 곧 안쪽에서 잠겼다. 나는 일어나지 못하고 누운 채로 단지를 올려다봤다. 창문은 하나같이 어두웠는데, 그 어두운 창마다 누군가 서서 나를 내려다보고 있었다.' },
  d_cold:     { kind: 'dead', title: '새벽 네 시', hint: '지친 몸으로 찬 바닥에서 밤을 보내면.', text: '새벽 네 시쯤 되자 몸의 떨림이 멎었고, 더는 춥다는 느낌도 들지 않았다. 추운 데서 추위를 느끼지 못하게 되는 것이 가장 나쁜 신호라는 글을 예전에 어디선가 읽은 적이 있었다. 그런데 그 글을 읽었다는 기억만 떠올랐을 뿐, 그러니 지금 일어나야 한다는 생각은 끝내 들지 않았다. 나는 찬 바닥에 뺨을 댄 채 그대로 누워 있었다.' },
  // ---- 정신
  m_door:     { kind: 'dead', title: '문을 열지 않았다', hint: '정신이 바닥까지 닳으면.', text: '그날 방에 들어가 문을 잠근 뒤로는 다시 문을 열지 않았다. 며칠 뒤 누군가 문 앞에 무언가를 내려놓고 가는 소리가 났지만, 무엇인지 내다보지도 않았다. 나는 벽을 보고 모로 누운 채 먹지도 마시지도 않았다. 그 뒤로 문 안쪽에서는 아무 소리도 나지 않았다.' },
  m_loss:     { kind: 'dead', title: '그 이름', hint: '가족을 잃은 사람이 정신까지 바닥나면.', text: '첫 주에 잃은 그 사람의 이름을 그날 처음으로 소리 내어 불렀다. 그러자 어두운 쪽에서 대답하는 목소리가 들렸고, 나는 가방도 챙기지 않은 채 그 소리가 난 쪽으로 걷기 시작했다. 걷는 동안에는 오랜만에 어깨도 다리도 무겁지 않았다. 목소리는 내가 다가간 만큼 멀어졌고, 나는 돌아갈 길을 봐 두지 않은 채 계속 따라 걸었다.' },
  m_count:    { kind: 'dead', title: '사십이 일째', hint: '끊었던 술에 다시 손을 댄 채로.', text: '술을 끊은 지 사십이 일째가 되는 날은 끝내 오지 않았다. 처음에 딴 것은 한 병뿐이었는데, 다음 날 눈을 떠 보니 머리맡에 빈 병이 여러 개 굴러다니고 있었다. 날짜를 다시 세려면 일 일째부터 시작해야 했다. 나는 세지 않기로 하고, 아직 따지 않은 병으로 손을 뻗었다.' },
  m_night:    { kind: 'dead', title: '밖에서 부르는 소리', hint: '밤에, 혼자서, 정신이 바닥난 채로.', text: '밤이 되면 문밖에서 누군가 내 이름을 불렀는데, 내가 아는 사람의 목소리였다. 그동안은 숨을 죽이고 버텼지만, 그날 밤에는 대답을 하고 내 손으로 문을 열었다. 문 앞에는 아무도 서 있지 않았다. 텅 빈 어둠 속, 사람의 입이 있을 만한 높이에서 그 목소리가 다시 한 번 내 이름을 불렀다.' },
  // ---- 침식
  e_mirror:   { kind: 'dead', title: '거울', hint: '돌을 너무 많이 삼키면.', relic: 'nail', text: '거울을 들여다보니 그 안의 눈은 아무리 기다려도 깜빡이지 않았다. 배는 더 고프지 않았고, 열 손가락의 손톱은 하나도 남김없이 검게 변해 있었다. 밤이 되자 나는 가방을 그 자리에 둔 채 건물을 나섰다. 어디로 가야 하는지는 누가 알려 주지 않아도 알 수 있었고, 길에서 마주친 그것들은 나를 보고도 길을 막지 않았다.' },
  e_rift:     { kind: 'dead', title: '균열', hint: '돌을 삼켜 달라진 몸으로 사거리의 균열 앞에 서면.', text: '가까이 다가가서 보니 균열 안쪽에는 색이 있었다. 사람의 눈으로는 볼 수 없던 색이었는데, 이제 내 눈에는 그 색이 또렷하게 보였다. 균열 안쪽에서도 무언가 이쪽을 보고 있었고, 그것은 나를 알아봤다. 나는 숨을 쉬듯 오르내리는 아스팔트를 밟고 걸어가, 한 번도 멈춰 서지 않고 그 안으로 들어갔다.' },
  // ---- 살아남음
  a_alone:    { kind: 'life', title: '혼자 남은 사람', hint: '어느 무리에도 들지 않고 혼자서 스무 날을 넘기면.', text: '침낭에서 나온 지 스무 날이 지났다. 그동안 균열은 닫히지 않았고, 도시 바깥에서는 아무도 오지 않았다. 나는 살아 있었지만, 내가 살아 있다는 것을 아는 사람은 나 말고 아무도 없었다. 스물한 번째 날 아침에도 나는 빈 물통을 들고 문을 나섰다. 끝은 아직 오지 않았다.' },
  a_church:   { kind: 'life', title: '한 사람 한 그릇', hint: '성당 사람들이 솥 뒤에 자리를 내주면.', relic: 'rosary', text: '아녜스 수녀는 국자를 내 손에 쥐여 주고는 아무 말도 하지 않았다. 그날부터 나는 지하 식당의 솥 뒤에 서서 한 사람에 한 그릇씩 국을 펐다. 그릇을 들고 선 줄은 내가 처음 왔을 때의 절반으로 줄어 있었고, 수녀는 그날도 줄을 선 누구에게도 이름을 묻지 않았다. 잠은 제대 아래 담요 위에서 잤다. 새벽 다섯 시에 불을 때는 것은 이제 내 일이었다.' },
  a_market:   { kind: 'life', title: '장부의 이름', hint: '시장 사람들이 벽 안쪽에 자리를 내주면.', text: '곽 씨는 장부를 펴고 맨 아래 줄에 내 이름을 적었다. 이름 옆의 금액 칸은 비워 두었는데, 금액이 없는 이름은 손님이 아니라 벽 안쪽 사람이라는 뜻이었고, 시장 사람이라면 누구나 아는 일이었다. 그날부터 나는 좌판을 쌓아 올린 벽 안쪽에서 잠을 잤다. 낮에는 그 벽에 서서 바깥에서 다가오는 사람들을 지켜봤다.' },
  a_apt:      { kind: 'life', title: '우리 주민', hint: '아파트 정문 안쪽에 주민으로 서게 되면.', text: '허 사장이 내 손목에 노란 끈을 묶어 주었다. 이 단지에서는 그 끈이 주민이라는 표시였다. 그날 저녁 나는 정문에 서서, 들여보내 달라고 찾아온 가족 하나를 돌려보내는 일을 맡았다. 큰길 쪽으로 걸어가던 아이가 한 번 뒤를 돌아봤다. 나는 노란 끈을 묶은 쪽 손으로 정문을 잠갔다.' },
  a_carehome: { kind: 'life', title: '여섯 번의 벨', hint: '요양원에 남은 여섯 명을 맡게 되면.', relic: 'bell', text: '근무표의 빈칸마다 내 이름을 적어 넣고 나니, 4층의 여섯 침대는 전부 내 몫이 되었다. 벨이 울리면 가서 먹이고 닦이고 돌려 눕히는 일로 이제 내 하루가 다 갔다. 그만하면 됐다고 말해 줄 수 있는 사람은 침대에 누운 그 여섯 명뿐이었다. 그들은 내가 갈 때마다 내 이름을 다시 물었고, 나는 그때마다 다시 대답했다.' },
  a_hospital: { kind: 'life', title: '3층 근무', hint: '병원에 남은 간호사의 근무표에 이름을 올리면.', text: '윤 간호사는 간호사실에 붙일 근무표를 새로 썼고, 거기에는 윤 간호사와 나, 두 사람의 이름만 적혀 있었다. 약장의 약은 날이 갈수록 줄어서, 머지않아 마지막 한 알까지 바닥날 터였다. 그 뒤로 우리가 3층의 환자들에게 해 줄 수 있는 처치는 침대 곁에 앉아 손을 잡아 주는 것뿐이라고 윤 간호사는 말했다. 그 또한 일이라고 했다. 그날 밤부터 우리는 번갈아 병실을 돌았다.' },
  a_ramp:     { kind: 'leave', title: '142킬로미터', hint: '나들목의 차들을 넘어 고속도로로 나가면.', text: '세 겹으로 엉킨 차들과 뒤집힌 차들 사이를 빠져나가는 데 꼬박 반나절이 걸렸다. 그 너머의 고속도로는 차 한 대 없이 비어 있었고, 표지판에는 서울까지 142킬로미터라고 적혀 있었다. 나는 딱 한 번 뒤를 돌아봤다. 도시 위의 하늘은 균열이 있는 쪽 한 군데만 색이 달랐다. 나는 다시 앞을 보고, 빈 도로 한가운데를 따라 걷기 시작했다.' },
  a_ramp_chan:{ kind: 'leave', title: '실내화', hint: '아이의 손을 잡고 나들목을 넘어가면.', text: '차들 사이를 다 빠져나오자 찬은 표지판에 적힌 142라는 숫자를 소리 내어 읽었다. 그러고는 길가에 앉아 운동화를 벗고 실내화로 갈아 신었는데, 운동화보다 그게 편하다고 했다. 앞으로 멘 책가방은 그때도 끝내 열지 않았다. 우리는 텅 빈 고속도로를 따라 걷기 시작했고, 아이는 도시 쪽을 한 번도 돌아보지 않았다.' },
  a_river:    { kind: 'leave', title: '깜빡이는 쪽', hint: '불빛이 깜빡이는 강 건너편에 닿으면.', relic: 'matches', text: '배가 건너편 기슭에 닿았을 때, 강물에 젖은 내 몸에서는 김이 피어올랐다. 강을 건너기 전부터 보이던 그 불빛은 사람이 켜 둔 것이었다. 손전등을 든 여자가 기슭으로 내려와 내 얼굴을 한참 동안 비춰 보았다. 그러고는 손전등을 내리지 않은 채 말했다. "당신이 처음이에요, 건너온 사람은."' },
  a_radio:    { kind: 'leave', title: '잡음', hint: '떠돌이와 같은 길을 걸으며 스무 날을 넘기면.', text: '내가 라디오라고 부르는 그 남자는 걷는 내내 한 손으로 라디오의 다이얼을 돌렸다. 스무 날째 밤, 줄곧 이어지던 잡음 사이로 사람의 목소리가 딱 한 번 흘러나왔다. 숫자를 하나씩 또박또박 읽는 목소리였다. 남자는 소리가 온 쪽이 남쪽이라고 했다. 우리는 카트를 밀고 남쪽으로 걸었다.' },
  a_changed:  { kind: 'life', title: '아직 사람', hint: '몸이 반쯤 변한 채로 스무 날을 넘기면.', text: '침낭에서 나온 지 스무 날이 지났다. 손톱 세 개가 검게 변해 있었고, 불빛 하나 없는 곳에서도 벽에 적힌 글자가 읽혔다. 길에서 마주친 사람들은 내 손과 눈을 보고는 말없이 길 가장자리로 비켜섰다. 그래도 나는 여전히 끼니때가 되면 배가 고팠고 밤이 되면 추웠다. 나는 그 두 가지를 들어, 아직은 사람이라고 치기로 했다.' },

  function dayTwenty(S) {                  // 스무 날을 넘긴 아침: 떠나는 사람은 떠나고, 남은 사람은 제 자리를 돌아본다

  /* ------------------------------------------------------------------------------------------ 시간 */
  function pass(S, steps, out) {
    const run = S.run;

  function hunger(S, out) {

  }
  function newDay(S, out, slept) {
    const run = S.run;
    run.day += 1; run.phase = 0; run.daily = {};
    if (!slept) { change(S, 'mind', -1, out); out.push('한숨도 자지 못하고 밤을 새웠다.'); }
    if (run.flags.infected) { run.lastHarm = 'wound'; change(S, 'hp', -1, out); out.push('곪은 상처에서 열이 올랐다.'); }
    if (has(run, 'photo', true) && run.mind < 5) { change(S, 'mind', 1, out); out.push('사진 속의 모르는 얼굴들을 한참 들여다봤다.'); }

  function arriveMark(S) { const run = S.run; run.visited[run.place] = (run.visited[run.place] || 0) + 1; S.meta.places[run.place] = true; }

  /* ------------------------------------------------------------------------------------------ 장면 */
  function fire(S, ev) {
    const run = S.run;
    run.seen[ev.id] = (run.seen[ev.id] || 0) + 1;
    if (ev.npc) meet(S, ev.npc);
    if (ev.thing) S.meta.things[ev.thing] = (S.meta.things[ev.thing] || 0) + 1;

  }
  function draw(S, on, base, spot) {       // 그 자리에서 일이 벌어지는가. weight 3 이상은 "꼭 겪어야 할 일"이라 거의 반드시.
    const found = candidates(S, on, spot);
    if (!found.length) return null;
    const gated = e => { const r = e.req || {}; return !!(r.flag || r.relMin || r.repMin || r.repMax); };   // 내가 쌓은 것이 불러온 일은 놓치지 않게

  function toHub(S, line) { S.run.scene = { t: 'hub', line: line || '' }; }

  const FOUND_ROOM = ['서랍과 선반을 하나씩 열어 보다가, 구석에서 {items}을(를) 찾아냈다.', '남들이 지나친 자리를 다시 뒤진 끝에 {items}을(를) 찾았다.',

  function move(S, to) {

    const names = got.map(id => ITEMS[id].name).join(', ');

  /* ------------------------------------------------------------------------------------------ 고르기 */

  function useItem(S, id) {

    if (u.stone) { change(S, 'ero', has(run, 'nail', true) ? 1 : (u.ero || 0), out); run.flags.ate_stone = 1; }
    if (u.cure && run.flags.infected) { delete run.flags.infected; out.push('상처의 열이 내렸다.'); }

  function leave(S, id) { return drop(S.run, id); }
  function recheck(S) {                    // 가방에서 먹거나 버려서 자리가 났으면, 무엇을 두고 갈지 묻던 장면을 넘긴다
    const sc = S.run.scene;

  /* ------------------------------------------------------------------------------------------ 아지트

  const count = (run, id) => run.inv.filter(i => i === id).length + (run.base ? run.base.store.filter(i => i === id).length : 0);

  /* 아지트는 그냥 생기지 않는다: 빈 방을 찾고 → 들어가 치우고 → 문과 창을 막고(고철 2 · 박스 테이프 1) → 첫 밤을 넘긴다. */
  const CLAIM_NEEDS = { scrap: 2, tape: 1 };

  function claimBase(S) {

    if (b.trap && !today.trap) out.push({ key: 'b:trap', label: '덫을 살핀다', sub: run.day > (b.trapDay || 0) ? `덫 ${b.trap}개` : '놓은 지 하루는 지나야 한다', locked: run.day <= (b.trapDay || 0), reason: '놓은 지 하루는 지나야 한다', kind: 'act' });

    if (b.stove && count(run, 'meat') && count(run, 'lighter')) out.push({ key: 'b:cook', label: '고기를 굽는다', sub: '고기 하나가 든다', kind: 'act' });

  function baseAct(S, k) {
    const run = S.run, b = run.base, out = [];

    a_ramp: 'end_ramp', a_ramp_chan: 'end_ramp', a_radio: 'end_ramp', a_river: 'end_river', a_awaken: 'end_awaken' };
  const EV_PIC = { hs_armband: 'haesu' };   // 사건 글 위에 한 번 보이는 그림

  // S는 통째로 저장된다: 남는 것(meta) · 이번 사람(run) · 쌓인 글(log) · 고르던 중인 사람(draft)
  let S = fresh();
  function fresh() { return { meta: Game.newMeta(), run: null, log: [], mark: 0, hub: '', stamp: 0, draft: null, opt: { pace: 1 } }; }
  const ui = { screen: 'title', overlay: '', tab: 'people', toast: [], wipe: 0, jump: false };

  /* ------------------------------------------------------------------------------------------ 저장 */
  function loadSave() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (!d || !d.meta) return;
      S = Object.assign(fresh(), d);
      if (!S.opt) S.opt = { pace: 1 };
      S.meta = Game.fixMeta(S.meta);
      if (S.run) Game.view(S);                       // 옛 저장이 지금 판과 안 맞으면 여기서 걸린다
    } catch (e) { S.run = null; S.log = []; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 저장이 막힌 곳에서는 이번 창에서만 이어진다 */ } }

  /* ------------------------------------------------------------------------------------------ 쌓이는 글 */
  const push = e => { S.log.push(e); if (S.log.length > 90) { S.log.splice(0, S.log.length - 90); S.mark = Math.max(0, S.mark - 1); } };
  const clearLog = () => { S.log = []; S.mark = 0; S.hub = ''; };
  const ARRIVE = ['걷는 사이에 날이 밝았다.', '닿았을 때는 한낮이었다.', '닿았을 때는 해가 기울고 있었다.', '닿았을 때는 이미 어두웠다.'];
  function dayMark() {
    const run = S.run;
    if (S.stamp && run.day !== S.stamp) push({ k: 'time', t: `${run.day}일째` });
    S.stamp = run.day;
  }
  function placeHead(v) {                             // 새로 닿은 곳: (이번 사람이 처음 온 곳이면) 그림 → 장소 이름
    if (S.log.some(e => e.k === 'place')) return;
    const run = S.run, id = 'place_' + run.place;
    run.pics = run.pics || {};
    if (PIC(id) && !run.pics[run.place]) { run.pics[run.place] = 1; push({ k: 'img', src: id, night: run.phase === 3 ? 1 : 0 }); }
    push({ k: 'place', t: v.title });
  }
  function absorb() {                                  // 지금 장면이 하는 말을 글 끝에 붙인다. 결과는 읽고 나면 곧바로 다음으로 넘어간다.
    for (let guard = 0; guard < 8; guard++) {
      const run = S.run, v = Game.view(S);
      if (v.t === 'prologue') { push({ k: 'p', t: v.text }); return; }
      if (v.t === 'hub') {
        dayMark();
        if (run.steps <= 6 && !S.log.some(e => e.move)) { const o = ORIGINS.find(x => x.id === run.origin); if (o && o.exit) push({ k: 'p', move: 1, t: o.exit }); }   // 문을 나서는 첫 걸음
        if (v.pre.length) push({ k: 'fx', out: v.pre });
        placeHead(v);
        if (S.hub !== v.text) { push({ k: 'p', t: v.text }); S.hub = v.text; }
        return;
      }
      if (v.t === 'event') {
        dayMark();
        if (v.pre.length) push({ k: 'fx', out: v.pre });
        placeHead(v);
        const ep = EV_PIC[run.scene.id];
        if (ep && PIC(ep)) { push({ k: 'img', src: ep, tall: 1 }); S.meta.pics = S.meta.pics || {}; S.meta.pics[ep] = 1; }   // 수첩에도 그때부터 보인다
        push({ k: 'p', t: v.text });
        return;
      }
      if (v.t === 'result') {
        if (v.text) push({ k: 'p', t: v.text });
        if (v.out.length) push({ k: 'fx', out: v.out });
        if (run.ending) return;                        // 마지막 글은 읽고 나서 넘긴다
        Game.choose(S, 'next');
        continue;
      }
      if (v.t === 'look' || v.t === 'spot' || v.t === 'leave' || v.t === 'claim') { if (v.pre && v.pre.length) push({ k: 'fx', out: v.pre }); if (v.text) push({ k: 'p', t: v.text }); return; }
      if (v.t === 'chapter') { push({ k: 'time', t: v.end.title }); push({ k: 'p', t: v.end.text }); return; }
      if (v.t === 'build' || v.t === 'box') { const last = S.log[S.log.length - 1]; if (!last || last.t !== v.text) push({ k: 'p', t: v.text }); return; }
      if (v.t === 'overflow') {
        const last = S.log[S.log.length - 1];
        if (!last || last.t !== v.text) push({ k: 'p', t: v.text });
        return;
      }
      return;
    }
  }
  function act(key) {
    const run = S.run, v = Game.view(S), c = v.choices.find(x => x.key === key);
    if (!c || c.locked) return;
    const from = run.place, going = key.startsWith('go:');
    S.mark = S.log.length;
    const quiet = going || key === 'back' || key === 'leave' || key.startsWith('spot:') || key.startsWith('take:') || key.startsWith('put:') || key === 'b:box' || key === 'b:build' || v.t === 'prologue' || v.t === 'result' || v.t === 'chapter';   // 글이 대신 말해 주는 것은 되받아 적지 않는다
    if (!quiet) push({ k: 'pick', t: c.label });
    Game.choose(S, key);
    if (going) {                                       // 다른 곳으로: 앞의 글은 거기 두고 간다
      clearLog();
      push({ k: 'p', move: 1, t: `${PLACES[from].name}을(를) 나와 ${c.label} 걸음을 옮겼다. ${ARRIVE[run.phase]}` });
    } else if (run.place !== from) clearLog();         // 일에 휩쓸려 다른 곳에 와 있다
    absorb();
    ui.jump = true;
    save();
  }

  function vitalText(o) { return `${Game.VITAL[o.vital]} ${o.d > 0 ? '+' : '−'}${Math.abs(o.d)}`; }
  function fxParts(out) {
    const say = [], chips = [];
    for (const o of out || []) {
      if (typeof o === 'string') say.push(o);
      else if (o.vital) {
        const good = o.vital === 'ero' ? o.d < 0 : o.d > 0;
        chips.push(`<span class="${good ? 'plus' : 'minus'}">${vitalText(o)}</span>`);
      } else if (o.got) chips.push(`<b class="item">${esc(ITEMS[o.got].name)}</b>을(를) 얻었다`);
      else if (o.lost) chips.push(`<b class="item">${esc(ITEMS[o.lost].name)}</b>이(가) 없어졌다`);
      else if (o.learned) chips.push(`<span class="get">수첩에 적었다: ${esc(o.learned)}</span>`);
      else if (o.relic) chips.push(`중요한 물품 <b class="item">${esc(RELICS[o.relic].name)}</b>을(를) 얻었다`);
      else if (o.infamy) chips.push(`<span class="minus">${o.infamy >= 3 ? '쫓기는 몸이 되었다' : '소문이 날 일을 했다'}</span>`);
    }
    return { say, chips: chips.map(c => josa(c.replace(/([가-힣])<\/b>(이\(가\)|을\(를\))/g, (m, ch, j) => ch + '</b>' + josa(ch + j).slice(1)))) };
  }
  function prose(s, i) {                              // 새 글은 문장마다 한 칸씩: 차례로 떠오르게 한다
    const seen = new Set();
    if (i < S.mark) return paint(T(s), seen);
    return sentences(String(s || '')).map(x => `<span class="sn">${paint(T(x), seen)}</span>`).join(' ');
  }
  function entryHtml(e, i) {
    const cls = 'entry ' + (i < S.mark ? 'old' : 'new');
    if (e.k === 'img') return PIC(e.src) ? `<figure class="${cls} pic${e.night ? ' night' : ''}${e.tall ? ' tall' : ''}"><img src="${PIC(e.src)}" alt=""></figure>` : '';
    if (e.k === 'place') return `<p class="${cls} place">${esc(e.t)}</p>`;
    if (e.k === 'time') return `<p class="${cls} time">${esc(e.t)}</p>`;
    if (e.k === 'pick') return `<p class="${cls} pick">${T(e.t)}</p>`;
    if (e.k === 'fx') {
      const { say, chips } = fxParts(e.out);
      return (say.length ? `<p class="${cls} note">${prose(say.join(' '), i)}</p>` : '') + (chips.length ? `<p class="${cls} fxl">${chips.join(' · ')}</p>` : '');
    }
    return `<p class="${cls} text${e.move ? ' move' : ''}">${prose(e.t, i)}</p>`;
  }

  /* ------------------------------------------------------------------------------------------ 조각 */
  const ODDS = { '자신 있다': 'o1', '해볼 만할 것 같다': 'o2', '긴장된다': 'o3', '불안하다': 'o4', '무모하다': 'o5' };
  function choiceBtn(c, cls, sub) {
    if (sub == null) sub = c.locked ? (c.sub || c.reason) : [c.sub, c.uses ? c.uses + '을(를) 쓴다' : ''].filter(Boolean).join(' · ');
    return `<button class="choice ${cls || ''}" data-act="choose" data-key="${esc(c.key)}" ${c.locked ? 'disabled' : ''}>
      <span><span class="l">${P(c.label)}</span>${sub ? `<span class="s">${T(sub)}</span>` : ''}</span>
      ${c.odds ? `<span class="o ${ODDS[c.odds] || ''}">${esc(c.odds)}</span>` : ''}</button>`;
  }
  function pips(k, v, max, cls) {
    let h = '';
    for (let i = 0; i < max; i++) h += `<i class="pip${i < v ? ' on' : ''}"></i>`;
    return `<div class="vital ${cls || ''}"><span class="k">${k}</span><span class="pips" role="img" aria-label="${k} ${v}/${max}">${h}</span></div>`;
  }
  const STATUS = [['infected', '상처가 곪았다', 1], ['with_chan', '찬이 따라온다'], ['dog_follows', '개가 따라온다'], ['with_haesu', '해수가 다섯 걸음 앞에서 걷는다'], ['with_radio', '스무 날째에 남쪽으로'],
                  ['raider_member', '길 위의 무리'], ['church_member', '성당 사람'], ['church_cook', '솥 앞에 선다'], ['market_member', '시장 벽 안쪽 사람'], ['market_wall', '벽의 열쇠를 맡았다'], ['apt_member', '한빛아파트 주민'], ['apt_captain', '동 대표'],
                  ['carehome_keeper', '요양원 4층을 맡았다'], ['carehome_head', '요양원의 열쇠를 맡았다'], ['hospital_staff', '3층 근무'], ['hospital_night', '밤 근무는 전부 내 몫'], ['boat_patched', '배를 때워 두었다']];
  function hud() {
    const run = S.run, cap = Game.capacity(run), load = Game.load(run);
    let tags = STATUS.filter(([f]) => run.flags[f]).map(([, t, bad]) => `<span class="tag${bad ? ' bad' : ''}">${t}</span>`).join('');
    const w = run.inv.filter(i => ITEMS[i].weapon).sort((a, b) => ITEMS[b].weapon - ITEMS[a].weapon)[0];
    if (w) tags += `<span class="tag">손에: ${esc(ITEMS[w].name)}</span>`;
    if (run.base) tags += `<span class="tag">내 아지트: ${esc(PLACES[run.base.place].name)}${run.base.people.length ? ' · ' + run.base.people.length + '명' : ''}</span>`;
    if (run.infamy >= 3) tags += '<span class="tag bad">쫓기는 몸</span>'; else if (run.infamy >= 1) tags += '<span class="tag">소문이 돈다</span>';
    return `<div class="hud"><div class="top">
        <span class="when"><b>${run.day}일째</b> · ${PHASES[run.phase]}</span>
        <span class="tools">
          <button class="tool${load >= cap ? ' full' : ''}" data-act="open" data-what="bag">가방<span class="n">${load}/${cap}</span></button>
          <button class="tool" data-act="open" data-what="book">수첩</button>
        </span>
      </div>
      <div class="vitals">
        ${pips('체력', run.hp, 10, run.hp <= 3 ? 'low' : '')}${pips('포만감', run.full, 10, run.full <= 2 ? 'low' : '')}
        ${pips('정신', run.mind, run.mindMax, run.mind <= 3 ? 'low' : '')}${run.ero > 0 ? pips('침식', run.ero, 10, 'ero') : '<div></div>'}
      </div>${tags ? `<div class="tags">${tags}</div>` : ''}</div>`;
  }

  /* ------------------------------------------------------------------------------------------ 첫 화면 */
  function titleScreen() {
    const seen = Object.keys(S.meta.endings).length, total = Object.keys(ENDINGS).length;
    const live = S.run && S.run.scene && S.run.scene.t !== 'ending';
    const bg = PIC('title'), logo = PIC('logo');
    return `<div class="page title${bg ? ' has-bg' : ''}">${bg ? `<img class="title-bg" src="${bg}" alt="">` : ''}
      <div class="head">
      ${logo ? `<h1 class="logo"><img src="${logo}" alt="살아남아야 한다"></h1>` : '<h1>살아남아야<br><span>한다</span></h1>'}
      <p>균열이 열리고, 괴물들이 도시를 짓밟았다.</p>
      <p>그로부터 두 달.</p>
      </div>
      <div class="bottom">
      <div class="menu">
        ${live ? `<button class="choice main" data-act="continue"><span><span class="l">이어서 걷는다</span><span class="s">${S.run.day}일째 ${PHASES[S.run.phase]} · ${esc(PLACES[S.run.place].name)}</span></span></button>` : ''}
        <button class="choice ${live ? '' : 'main'}" data-act="new"><span><span class="l">${live ? '다른 사람으로 침낭에서 나온다' : '침낭에서 나온다'}</span></span></button>
      </div>
      <div class="foot"><span><button class="link" data-act="open" data-what="book">수첩</button><button class="link pace" data-act="pace">${S.opt.pace ? '글: 한 줄씩' : '글: 한꺼번에'}</button></span><span>결말 ${seen}/${total} · 중요한 물품 ${S.meta.relics.length}/${Object.keys(RELICS).length}</span></div>
      <a class="home" href="../index.html">← GLONOMY Games</a>
      </div>
    </div>`;
  }

  /* ------------------------------------------------------------------------------------------ 사람 고르기
     보이는 것은 다섯 개까지. 무엇이 나올지는 침낭에서 나올 때 한 번 정해지고, 되돌아가도 바뀌지 않는다. */
  const STEPS = ['age', 'job', 'origin', 'mbti', 'flaw', 'relics'];
  function createScreen() {
    const d = S.draft, sel = d.sel, st = STEPS[d.step];
    const opt = (k, id, name, desc, extra, cls) => `<button class="opt ${cls || ''}${sel[k] === id ? ' on' : ''}" data-act="pick" data-k="${k}" data-id="${id}"><b>${esc(name)}</b>${desc ? `<span>${esc(desc)}</span>` : ''}${extra ? `<em>${esc(extra)}</em>` : ''}</button>`;
    let ask = '', opts = '', nav = '';
    if (st === 'age') { ask = '나는'; opts = AGES.map(a => opt('age', a.id, a.name, a.desc)).join(''); }
    else if (st === 'job') {
      ask = '두 달 전 나는';
      opts = d.roll.jobs[sel.age].map(id => { const j = byId(JOBS, id); return opt('job', id, j.was, '', '주머니: ' + j.items.map(i => ITEMS[i].name).join(', ')); }).join('');
    } else if (st === 'origin') {
      ask = '고된 하루를 마치면 나는 지친 몸을 이끌고 집으로 돌아갔다.<br>나의 집은';
      opts = ORIGINS.map(o => opt('origin', o.id, o.name, o.desc)).join('');
    } else if (st === 'mbti') { ask = '나의 성격은'; opts = d.roll.mbti.map(id => opt('mbti', id, id, MBTI_DESC[id], '', 'mbti')).join(''); }
    else if (st === 'flaw') { ask = '균열이 열린 지 두 달째.<br>그동안 나는'; opts = d.roll.flaws.map(id => { const f = byId(FLAWS, id); return opt('flaw', id, f.name, f.desc); }).join(''); }
    else {
      ask = '침낭에서 나온 나는<br>오늘도 어김없이';
      opts = d.roll.relics.map(id => {
        const r = RELICS[id];
        return `<button class="opt${sel.relics[0] === id ? ' on' : ''}" data-act="relic" data-id="${id}"><b>${esc(r.wear)}</b><span>${esc(r.fx)}</span></button>`;
      }).join('');
      nav = `<button class="btn" data-act="begin" ${sel.relics.length ? '' : 'disabled'}>주변을 둘러본다</button>`;
    }
    return `<div class="page create">
      <div class="steps">${STEPS.map((x, i) => `<i class="${i <= d.step ? 'on' : ''}"></i>`).join('')}</div>
      <h2 class="ask">${ask}</h2>
      <div class="opts">${opts}</div>
      <div class="nav"><button class="btn ghost" data-act="back">뒤로</button>${nav}</div>
    </div>`;
  }

  /* ------------------------------------------------------------------------------------------ 걷는 화면 */
  function dock(v) {
    const run = S.run, rows = list => `<div class="choices">${list.map(c => choiceBtn(c, c.kind === 'act' ? 'main' : '')).join('')}</div>`;
    if (v.t === 'hub') {
      const acts = v.choices.filter(c => c.kind === 'act'), spots = v.choices.filter(c => c.kind === 'spot'), dos = v.choices.filter(c => c.kind === 'do');
      return (acts.length ? rows(acts) : '') + (spots.length ? `<p class="group">어디를 살펴볼까</p><div class="choices two">${spots.map(c => choiceBtn(c)).join('')}</div>` : '') + `<div class="choices two">${dos.map(c => choiceBtn(c)).join('')}</div>`;
    }
    if (v.t === 'leave') {
      const gos = v.choices.filter(c => c.kind === 'go'), rest = v.choices.filter(c => c.kind !== 'go');
      const sub = c => S.meta.places[c.to] ? PLACES[c.to].name : c.hint.split('.')[0] + '.';
      return `<p class="group">어디로 갈 것인가</p><div class="choices two">${gos.map(c => choiceBtn(c, 'go', sub(c))).join('')}</div>` + rows(rest);
    }
    return rows(v.choices);
  }
  function chapterScreen(v) {
    const pic = PIC(CH_PIC[S.run.scene.id]);
    return `<div class="page end">${pic ? `<img class="endpic" src="${pic}" alt="">` : ''}
      <div class="kind alive">이정표</div>
      <h2>${esc(v.end.title)}</h2>
      <p class="text">${T(v.end.text)}</p>
      <div class="epitaph">${v.first ? '<div class="new">처음 닿은 이정표. 수첩에 적혔다.</div>' : '수첩에 이미 적힌 이정표였다.'}
        ${v.relic ? `<div class="new">중요한 물품을 얻었다 · ${esc(RELICS[v.relic].name)}</div>` : ''}
      </div>
      <div class="menu"><button class="choice main" data-act="choose" data-key="next"><span class="l">계속 걷는다</span></button></div>
    </div>`;
  }
  function gameScreen() {
    const v = Game.view(S);
    if (v.t === 'ending') return endScreen(v);
    if (v.t === 'chapter') return chapterScreen(v);
    return hud() + `<div class="log" id="log">${S.log.map(entryHtml).join('')}</div><div class="dock">${dock(v)}</div>`;
  }
  function endScreen(v) {
    const alive = v.end.kind !== 'dead', pic = PIC(END_PIC[S.run.ending]);
    return `<div class="page end">${pic ? `<img class="endpic" src="${pic}" alt="">` : ''}
      <div class="kind${alive ? ' alive' : ''}">${alive ? '도시를 떠났다' : '살아남지 못했다'}</div>
      <h2>${esc(v.end.title)}</h2>
      <p class="text">${T(v.end.text)}</p>
      <div class="epitaph">${esc(v.epitaph)}
        ${v.first ? '<div class="new">처음 본 결말. 수첩에 적혔다.</div>' : ''}
        ${v.relic ? `<div class="new">중요한 물품을 남겼다 · ${esc(RELICS[v.relic].name)}</div>` : ''}
      </div>
      <div class="menu"><button class="choice main" data-act="new"><span class="l">다른 사람으로 침낭에서 나온다</span></button></div>
      <div class="foot"><button class="link" data-act="open" data-what="book">수첩</button><button class="link" data-act="title">처음 화면</button></div>
    </div>`;
  }

  /* ------------------------------------------------------------------------------------------ 가방 */
  function useHint(id) {
    const u = ITEMS[id].use;
    if (!u) return '';
    const parts = [];
    if (u.full) parts.push('포만감 +' + u.full);
    if (u.hp) parts.push('체력 ' + (u.hp > 0 ? '+' : '−') + Math.abs(u.hp));
    if (u.mind) parts.push('정신 +' + u.mind);
    if (u.ero) parts.push('침식 +' + u.ero);
    if (u.cure) parts.push('곪은 상처를 잡는다');
    return parts.join(' · ');
  }
  const useVerb = id => ITEMS[id].kind === '먹을 것' ? '먹었다' : ITEMS[id].kind === '돌' ? '삼켰다' : '썼다';
  function bagSheet() {
    const run = S.run, counts = {};
    for (const i of run.inv) counts[i] = (counts[i] || 0) + 1;
    const live = run.scene.t !== 'ending';
    const items = Object.keys(counts).map(id => {
      const it = ITEMS[id], hint = useHint(id);
      return `<div class="row"><h4>${esc(it.name)}${counts[id] > 1 ? ` <small>× ${counts[id]}</small>` : ''}<small>${esc(it.kind)} · ${it.cap ? '칸 +' + it.cap : it.vol + '칸'}${it.weapon ? ' · 손에 쥘 만하다' : ''}${it.light ? ' · 밤길을 밝힌다' : ''}</small></h4>
        <p>${esc(it.text)}</p>${hint ? `<div class="meta">${hint}</div>` : ''}
        ${live ? `<div class="acts">${it.use ? `<button class="mini use" data-act="use" data-id="${id}">쓴다</button>` : ''}<button class="mini" data-act="drop" data-id="${id}">버린다</button></div>` : ''}</div>`;
    }).join('');
    const relics = run.relics.map(id => `<div class="row"><h4>${esc(RELICS[id].name)}<small>중요한 물품</small></h4><p>${esc(RELICS[id].text)}</p><div class="meta">${esc(RELICS[id].fx)}</div></div>`).join('');
    return sheet(`가방<span class="cap">${Game.load(run)} / ${Game.capacity(run)}칸</span>`, '',
      (ui.toast.length ? `<div class="toast">${ui.toast.map(esc).join('<br>')}</div>` : '') +
      (items || '<p class="empty">주머니에는 아무것도 없었다.</p>') + (relics ? '<p class="sub-head">중요한 물품</p>' + relics : ''));
  }

  /* ------------------------------------------------------------------------------------------ 수첩 */
  const TABS = [['people', '사람'], ['facs', '세력'], ['things', '그것들'], ['items', '물건'], ['relics', '중요한 물품'], ['endings', '결말'], ['graves', '지나간 사람']];
  function bookSheet() {
    const m = S.meta, run = S.run;
    let body = '';
    if (ui.tab === 'people') {
      body = Object.keys(PEOPLE).map(id => {
        const p = PEOPLE[id], rec = m.people[id];
        if (!rec || !rec.first) return '<div class="row unknown"><h4>아직 만나지 못한 사람</h4></div>';
        const lines = rec.likes.map(l => `<li class="like">${esc(l)}</li>`).concat(rec.dislikes.map(l => `<li class="dislike">${esc(l)}</li>`), rec.notes.map(l => `<li class="note">${esc(l)}</li>`)).join('');
        const now = run && run.met[id] && run.scene.t !== 'ending' ? ` · 이번에는 ${run.met[id]}일째에 만났다` : '';
        return `<div class="row">${PIC(id) && (m.pics || {})[id] ? `<img class="rowpic tall" src="${PIC(id)}" alt="">` : ''}<h4>${esc(p.name)}<small>${esc(p.role)}</small></h4><p>${esc(p.text)}</p>
          <div class="meta">처음 만난 날: ${rec.first.run}번째 사람의 ${rec.first.day}일째 · 만난 사람 ${rec.n}명${now}</div>
          ${lines ? `<ul class="notes">${lines}</ul>` : '<div class="meta">아직 아는 것이 없다. 내가 한 일에 어떻게 구는지 봐야 한다.</div>'}</div>`;
      }).join('');
    } else if (ui.tab === 'facs') {
      body = Object.keys(FACTIONS).map(id => {
        const f = FACTIONS[id], rec = m.facs[id];
        if (!rec) return '<div class="row unknown"><h4>아직 엮이지 않은 사람들</h4></div>';
        return `<div class="row"><h4>${esc(f.name)}</h4><p>${esc(f.text)}</p>${rec.notes.length ? `<ul class="notes">${rec.notes.map(l => `<li class="note">${esc(l)}</li>`).join('')}</ul>` : ''}</div>`;
      }).join('');
    } else if (ui.tab === 'things') {
      body = Object.keys(THINGS).map(id => m.things[id]
        ? `<div class="row">${PIC('thing_' + id) ? `<img class="rowpic" src="${PIC('thing_' + id)}" alt="">` : ''}<h4>${esc(THINGS[id].name)}<small>${m.things[id]}번 마주쳤다</small></h4><p>${esc(THINGS[id].text)}</p></div>`
        : '<div class="row unknown"><h4>아직 보지 못한 것</h4></div>').join('');
    } else if (ui.tab === 'items') {
      const ids = Object.keys(ITEMS), got = ids.filter(id => m.items[id]);
      body = `<div class="meta" style="padding-top:12px">${got.length}/${ids.length}</div>` + ids.map(id => m.items[id]
        ? `<div class="row"><h4>${esc(ITEMS[id].name)}<small>${esc(ITEMS[id].kind)}</small></h4><p>${esc(ITEMS[id].text)}</p>${useHint(id) ? `<div class="meta">${useHint(id)}</div>` : ''}</div>`
        : '<div class="row unknown"><h4>아직 줍지 못한 것</h4></div>').join('');
    } else if (ui.tab === 'relics') {
      const ids = Object.keys(RELICS);
      body = `<div class="meta" style="padding-top:12px">${m.relics.length}/${ids.length} · 한 번 얻으면 다음 사람부터 지닐 수 있다.</div>` + ids.map(id => m.relics.includes(id)
        ? `<div class="row"><h4>${esc(RELICS[id].name)}</h4><p>${esc(RELICS[id].text)}</p><div class="meta">${esc(RELICS[id].fx)}</div></div>`
        : `<div class="row unknown"><h4>아직 얻지 못한 것</h4><p>${esc(RELICS[id].hint || '')}</p></div>`).join('');
    } else if (ui.tab === 'endings') {
      const ids = Object.keys(ENDINGS), seen = ids.filter(id => m.endings[id]);
      const block = kind => ids.filter(id => ENDINGS[id].kind === kind).map(id => m.endings[id]
        ? `<div class="row"><h4>${esc(ENDINGS[id].title)}<small>${m.endings[id].n}번 · 처음은 ${m.endings[id].first}번째 사람</small></h4><p>${esc(ENDINGS[id].text)}</p></div>`
        : `<div class="row unknown"><h4>아직 보지 못한 결말</h4><p>${esc(ENDINGS[id].hint)}</p></div>`).join('');
      body = `<div class="meta" style="padding-top:12px">${seen.length}/${ids.length}</div><p class="sub-head">도시를 떠난 끝</p>${block('leave')}<p class="sub-head">이정표 · 삶은 이어진다</p>${block('life')}<p class="sub-head">살아남지 못한 끝</p>${block('dead')}`;
    } else {
      body = m.graves.length ? m.graves.map(g => `<div class="row"><h4>${g.no ? g.no + '번째 사람' : '사람'}<small>${esc(g.age || '')} · ${esc(g.job)} · ${g.day}일째</small></h4>
        <p>${g.alive ? '도시를 떠났다' : '살아남지 못했다'} — ${esc((ENDINGS[g.end] || {}).title || '')}</p></div>`).join('') : '<p class="empty">아직 아무도 지나가지 않았다.</p>';
      body += `<p class="wipe">${ui.wipe ? '수첩과 중요한 물품과 결말이 전부 사라진다. <button class="sure" data-act="wipe2">정말 지운다</button> · <button data-act="wipe0">그만둔다</button>'
        : '<button data-act="wipe1">기록을 전부 지운다</button>'}</p>`;
    }
    const tabs = `<div class="tabs" role="tablist">${TABS.map(([k, n]) => `<button class="tab${ui.tab === k ? ' on' : ''}" role="tab" aria-selected="${ui.tab === k}" data-act="tab" data-k="${k}">${n}</button>`).join('')}</div>`;
    return sheet('수첩', tabs, body);
  }
  function sheet(title, extra, body) {
    return `<div class="veil" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head"><h3>${title}</h3><button class="tool" data-act="close">닫는다</button></div>${extra}<div class="sheet-body">${body}</div></div>`;
  }

  /* ------------------------------------------------------------------------------------------ 그리기 */
  /* 새 글은 한 줄씩 떠오른다. 화면 어디든 누르면 남은 줄이 한꺼번에 보인다. 다 나오기 전에는 고를 것이 잠겨 있다. */
  const reveal = { units: [], k: 0, timer: 0, on: false };
  function revealStop() {
    clearTimeout(reveal.timer);
    for (const u of reveal.units) u.classList.remove('hid');
    reveal.units = []; reveal.on = false;
    const d = app.querySelector('.dock'); if (d) d.classList.remove('wait');
  }
  function revealStep() {
    const log = document.getElementById('log'), u = reveal.units[reveal.k++];
    if (!u || !log) { revealStop(); return; }
    u.classList.remove('hid'); u.classList.add('rise');
    const box = log.getBoundingClientRect(), r = u.getBoundingClientRect();
    if (r.bottom > box.bottom - 12) log.scrollTo({ top: log.scrollTop + (r.bottom - box.bottom) + 28, behavior: 'smooth' });
    if (reveal.k >= reveal.units.length) { reveal.timer = setTimeout(revealStop, 250); return; }
    const len = (u.textContent || '').length;
    reveal.timer = setTimeout(revealStep, u.classList.contains('pic') ? 1100 : Math.min(1500, Math.max(550, 300 + len * 20)));
  }
  function revealStart() {
    const log = document.getElementById('log');
    if (!log) return;
    const units = [...log.querySelectorAll('.entry.new.pic, .entry.new.place, .entry.new.time, .entry.new .sn, .entry.new.fxl')];
    if (units.length < 2) return;
    for (const u of units) u.classList.add('hid');
    reveal.units = units; reveal.k = 0; reveal.on = true;
    app.querySelector('.dock').classList.add('wait');
    revealStep();
  }
  function render() {
    const newBatch = ui.jump && ui.screen === 'game' && !ui.overlay && S.opt && S.opt.pace;
    if (reveal.on) revealStop();
    const oldLog = document.getElementById('log'), logY = oldLog ? oldLog.scrollTop : null;
    const oldSheet = document.querySelector('.sheet-body'), sheetY = oldSheet ? oldSheet.scrollTop : 0;
    let h = ui.screen === 'title' ? titleScreen() : ui.screen === 'create' ? createScreen() : gameScreen();
    if (ui.overlay === 'bag' && S.run) h += bagSheet();
    if (ui.overlay === 'book') h += bookSheet();
    app.innerHTML = h;
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    const log = document.getElementById('log');
    if (log) {
      const first = log.querySelector('.entry.new');
      if (ui.jump || logY == null) {                   // 새 글의 첫 줄이 보이게: 짧으면 맨 아래, 길면 그 줄을 맨 위에
        const bottom = log.scrollHeight - log.clientHeight;
        log.scrollTop = first ? Math.min(Math.max(0, first.offsetTop - 10), bottom) : bottom;
      } else log.scrollTop = logY;
    }
    if (ui.overlay && sheetY && ui.keep) { const b = document.querySelector('.sheet-body'); if (b) b.scrollTop = sheetY; }
    if (newBatch && log) revealStart();
    ui.jump = false; ui.keep = false;
  }

  /* ------------------------------------------------------------------------------------------ 누른 것 */
  const ACT = {
    new() {
      if (!S.draft) S.draft = { roll: Game.roll(S.meta), sel: { age: '', job: '', origin: '', mbti: '', flaw: '', relics: [] }, step: 0 };
      ui.screen = 'create'; ui.overlay = ''; save();
    },
    continue() { ui.screen = 'game'; ui.jump = true; },
    title() { ui.screen = 'title'; },
    pace() { S.opt.pace = S.opt.pace ? 0 : 1; save(); },
    open(d) { ui.overlay = d.what; ui.toast = []; ui.wipe = 0; },
    close() { ui.overlay = ''; },
    tab(d) { ui.tab = d.k; ui.wipe = 0; },
    pick(d) {
      const dr = S.draft;
      if (d.k === 'age' && dr.sel.age !== d.id) dr.sel.job = '';
      dr.sel[d.k] = d.id;
      dr.step = Math.min(dr.step + 1, STEPS.length - 1);
      save();
    },
    relic(d) { S.draft.sel.relics = [d.id]; save(); },
    back() { if (S.draft.step === 0) ui.screen = 'title'; else S.draft.step -= 1; save(); },
    begin() {
      const sel = S.draft.sel;
      if (!sel.age || !sel.job || !sel.origin || !sel.mbti || !sel.flaw) { S.draft.step = STEPS.findIndex(k => !sel[k]); return; }
      if (!sel.relics.length) return;
      S.run = Game.newRun(sel, S.meta);
      S.draft = null; clearLog(); S.stamp = 0;
      absorb(); ui.screen = 'game'; ui.jump = true; save();
    },
    choose(d) { act(d.key); },
    use(d) {
      const was = S.run.scene.t, name = ITEMS[d.id].name, verb = useVerb(d.id), out = Game.useItem(S, d.id);
      if (!out) return;
      const line = josa(`${name}을(를) ${verb}.`);
      ui.toast = [line].concat(out.map(o => typeof o === 'string' ? o : o.vital ? vitalText(o) : '').filter(Boolean));
      S.mark = S.log.length;
      push({ k: 'pick', t: line }); if (out.length) push({ k: 'fx', out });
      Game.recheck(S);
      if (was === 'overflow' && S.run.scene.t !== 'overflow') absorb();
      if (S.run.scene.t === 'ending') ui.overlay = '';
      ui.jump = true; ui.keep = true; save();
    },
    drop(d) {
      const was = S.run.scene.t;
      if (!Game.leave(S, d.id)) return;
      ui.toast = [josa(ITEMS[d.id].name + '을(를) 두고 왔다.')];
      Game.recheck(S);
      if (was === 'overflow' && S.run.scene.t !== 'overflow') absorb();
      ui.keep = true; save();
    },
    wipe1() { ui.wipe = 1; ui.keep = true; }, wipe0() { ui.wipe = 0; ui.keep = true; },
    wipe2() { S = fresh(); save(); ui.wipe = 0; ui.overlay = ''; ui.screen = 'title'; },
  };
  app.addEventListener('click', e => {             // 글이 떠오르는 중에 누르면: 남은 글을 한꺼번에 보여 주기만 한다
    if (!reveal.on || e.target.closest('.tool, .sheet, .veil')) return;
    e.stopPropagation(); e.preventDefault(); revealStop();
  }, true);
  app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (!fn) return;
    fn(el.dataset);
    render();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ui.overlay) { ui.overlay = ''; render(); return; }
    if (ui.overlay || e.metaKey || e.ctrlKey || e.altKey) return;
    if (reveal.on) { revealStop(); return; }
    if (/^[1-9]$/.test(e.key)) {
      const b = app.querySelectorAll('.dock .choice:not([disabled]), .opts .opt:not([disabled])')[+e.key - 1];
      if (b) b.click();
    }
  });

  // 핀치 확대를 막는다(iOS 사파리는 viewport 설정을 무시하므로 손가락 두 개 움직임을 직접 막는다)
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  let lastTap = 0;
  document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTap < 320 && !e.target.closest('button')) e.preventDefault(); lastTap = now; }, { passive: false });
  loadSave();
  if (S.run && !S.log.length && S.run.scene.t !== 'ending') absorb();
  render();
})();

</script>
</body>
</html>
