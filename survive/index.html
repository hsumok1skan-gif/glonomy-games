<!DOCTYPE html>
<!-- 살아남아야 한다 · 제작 @hong_sumok (https://www.instagram.com/hong_sumok/) · 무단 복제·배포 금지. 이 파일의 코드 · 문장 · 그림의 무단 복제와 배포를 금합니다. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0b">
<meta name="description" content="살아남아야 한다 — 균열이 열리고, 괴물들이 도시를 짓밟았다. 그로부터 두 달. 다크 텍스트 로그라이크.">
<meta name="author" content="@hong_sumok">
<meta name="copyright" content="@hong_sumok · 무단 복제·배포 금지">
<title>살아남아야 한다</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0c0c0b;
  --panel: #141412;
  --panel-2: #1b1a17;
  --line: #2b2925;
  --ink: #d9d3c5;
  --bone: #efe9d8;
  --dim: #8c867a;
  --faint: #5f5b52;
  --rust: #cfc8b6;      /* 강조: 색 없이 밝기로만 */
  --rust-dim: #55514a;
  --good: #cfc8b6;
  --warn: #c2a06a;
  --bad: #c36f5c;
  --mon: #c4483b;       /* 괴물 */
  --item: #d6b25e;      /* 물건 */
  --who: #8db3ab;       /* 사람 이름 */
  --serif: 'Noto Serif KR', 'Noto Serif CJK KR', 'Nanum Myeongjo', 'Apple SD Gothic Neo', serif;
  --sans: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
* { box-sizing: border-box; }
html { color-scheme: dark; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  margin: 0; background: #0c0c0b; background: var(--bg); color: var(--ink); height: 100%;
  font-family: var(--serif); font-size: 17px; line-height: 1.8; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-text-size-adjust: 100%; overscroll-behavior: none;
  position: fixed; inset: 0; overflow: hidden;   /* 화면 전체는 움직이지 않는다. 움직이는 것은 글 칸 · 가방 · 수첩뿐 */
}
html, body, #app { touch-action: pan-y; }   /* 핀치 확대 · 두 번 눌러 확대를 막는다 */
.page, .sheet-body, .dock { overflow-x: hidden; }
button { touch-action: manipulation; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }

/* 화면 하나가 곧 한 장. 바깥은 움직이지 않고, 글이 쌓이는 자리만 위아래로 움직인다. */
#app { height: 100vh; height: 100dvh; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; padding: 0 16px; overflow: hidden; }
.page { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; animation: rise 0.3s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .page, .sheet, .entry.new, .sn.rise, .entry.rise { animation: none !important; } }

/* ---------------------------------------------------------------- 머리 */
.hud { flex: none; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0 8px; font-family: var(--sans); font-size: 13px; color: var(--dim); }
.top .when { color: var(--bone); }
.top .when b { font-weight: 600; }
.top .when i { font-style: normal; color: var(--faint); }
.top .tools { display: flex; gap: 6px; }
.tool { background: none; border: 1px solid var(--line); border-radius: 3px; padding: 7px 11px; font-family: var(--sans); font-size: 13px; color: var(--ink); line-height: 1.2; }
.tool .n { color: var(--dim); margin-left: 4px; }
.tool.full .n { color: var(--bad); }
.vitals { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 18px; padding: 9px 0 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-family: var(--sans); font-size: 12px; color: var(--dim); }
.vital { display: flex; align-items: center; gap: 8px; }
.vital .k { width: 3.2em; flex: none; }
.pips { display: flex; gap: 2px; flex: 1; }
.pip { height: 6px; flex: 1; background: var(--line); border-radius: 1px; }
.pip.on { background: var(--ink); }
.vital.low .pip.on { background: var(--bad); }
.vital.ero .pip.on { background: #7d6ea8; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 7px 0 0; font-family: var(--sans); font-size: 12px; }
.tag { border: 1px solid var(--line); color: var(--dim); padding: 0 8px; border-radius: 2px; }
.tag.bad { color: var(--bad); border-color: var(--rust-dim); }

/* ---------------------------------------------------------------- 쌓이는 글 */
.log { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; position: relative; padding: 16px 0 28px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.entry { margin: 0 0 12px; }
.entry.old { opacity: 0.62; }
.entry.new { animation: rise 0.35s ease-out; }
.place { font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; color: var(--dim); margin: 4px 0 8px; }
.text { color: var(--bone); font-size: 18px; line-height: 1.95; }
.text.move { color: var(--ink); }
.pick { font-size: 15.5px; color: var(--dim); padding-left: 12px; border-left: 2px solid var(--rust-dim); margin: 16px 0 12px; }
.note { font-size: 15.5px; color: var(--ink); }
.fxl { font-family: var(--sans); font-size: 12.5px; color: var(--dim); margin-top: -4px; }
.fxl .minus { color: var(--bad); } .fxl .plus { color: var(--good); } .fxl .get { color: var(--ink); }
/* 색은 세 가지만: 괴물 · 물건 · 사람 */
.mon { color: var(--mon); }
.who { color: var(--who); }
.item { color: var(--item); font-weight: 500; }
/* 한 줄씩 떠오르기 */
.sn.hid, .entry.hid { opacity: 0; animation: none; }
.sn.rise, .entry.rise { animation: fadein 0.45s ease-out; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.dock.wait { opacity: 0.28; pointer-events: none; }
.foot .pace { margin-left: 12px; font-size: 12.5px; color: var(--dim); border-bottom-color: var(--line); }
.time { display: flex; align-items: center; gap: 10px; font-family: var(--sans); font-size: 11.5px; letter-spacing: 0.16em; color: var(--faint); margin: 22px 0 14px; }
.time::before, .time::after { content: ''; height: 1px; background: var(--line); flex: 1; }

/* ---------------------------------------------------------------- 고를 것 */
.dock { flex: none; max-height: 35vh; max-height: 35dvh; overflow-y: auto; overscroll-behavior: contain; transition: opacity 0.25s; border-top: 1px solid var(--line); padding: 10px 0 14px; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
.group { font-family: var(--sans); font-size: 11px; letter-spacing: 0.2em; color: var(--faint); margin: 10px 0 6px; }
.choices { display: flex; flex-direction: column; gap: 6px; }
.choices.two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.choices + .choices { margin-top: 6px; }
.choice { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; width: 100%; min-height: 44px;
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--faint); border-radius: 2px; padding: 8px 12px; line-height: 1.4; }
.choice:active:not(:disabled) { background: #22201c; }
.choice .l { display: block; color: var(--bone); font-size: 16px; }
.choice .s { display: block; font-family: var(--sans); font-size: 12px; color: var(--dim); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.choice > span:first-child { min-width: 0; }
.choice .o { flex: none; font-family: var(--sans); font-size: 12.5px; white-space: nowrap; }
.choice:disabled { cursor: default; opacity: 0.5; border-left-color: var(--line); }
.choice.go { border-left-color: #4a4841; }
.choice.main { border-left-color: var(--rust); }
.o.o1 { color: var(--ink); } .o.o2 { color: var(--dim); } .o.o3 { color: var(--warn); } .o.o4 { color: #c88a62; } .o.o5 { color: var(--bad); }

/* ---------------------------------------------------------------- 첫 화면 */
.title { justify-content: center; padding: 0 0 8vh; }
.title h1 { font-size: 42px; line-height: 1.22; font-weight: 600; color: var(--bone); margin: 0 0 18px; letter-spacing: -0.01em; }
.title h1 span { color: var(--dim); }
.title p { margin: 0 0 4px; color: var(--dim); font-size: 16.5px; }
.menu { display: flex; flex-direction: column; gap: 8px; margin-top: 30px; }
.menu .choice { min-height: 52px; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; font-family: var(--sans); font-size: 12.5px; color: var(--faint); }
.link { background: none; border: 0; border-bottom: 1px solid var(--faint); padding: 2px 0; font-family: var(--sans); font-size: 14px; color: var(--ink); }
.home { display: inline-block; margin-top: 26px; font-family: var(--sans); font-size: 12.5px; color: var(--faint); text-decoration: none; }

/* ---------------------------------------------------------------- 사람 고르기: 한 화면에 다섯 개까지, 밀어 내리는 일 없이 */
.create { padding: 14px 0 18px; }
.steps { display: flex; gap: 4px; flex: none; }
.steps i { height: 2px; flex: 1; background: var(--line); }
.steps i.on { background: var(--rust); }
.ask { font-size: 22px; font-weight: 600; color: var(--bone); margin: 22px 0 14px; line-height: 1.45; flex: none; }

.opts { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
.opt { display: flex; flex-direction: column; justify-content: center; width: 100%; flex: 1; max-height: 96px; min-height: 0; overflow: hidden; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--faint); border-radius: 2px; padding: 6px 14px; line-height: 1.4; }
.opt.on { border-color: var(--rust); background: #1f1e1a; }
.opt:disabled { opacity: 0.4; cursor: default; }
.opt b { display: block; color: var(--bone); font-weight: 600; font-size: 17.5px; }
.opt span { display: block; color: var(--ink); font-size: 14px; line-height: 1.5; margin-top: 1px; opacity: 0.8; }
.opt em { display: block; font-style: normal; font-family: var(--sans); font-size: 12px; color: var(--dim); margin-top: 2px; }
.opt.mbti b { font-family: var(--sans); letter-spacing: 0.2em; font-size: 17px; }
.nav { display: flex; gap: 8px; margin-top: 14px; flex: none; }
.btn { flex: 1; background: var(--rust); border: 1px solid var(--rust); color: #12110f; font-weight: 600; border-radius: 2px; padding: 12px 14px; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.ghost { background: none; border-color: var(--line); color: var(--dim); font-weight: 400; flex: 0 0 auto; font-family: var(--sans); font-size: 14px; }

/* ---------------------------------------------------------------- 결말 */
.end { justify-content: center; padding: 20px 0 6vh; }
.end .kind { font-family: var(--sans); font-size: 12px; letter-spacing: 0.24em; color: var(--bad); }
.end .kind.alive { color: var(--bone); }
.end h2 { font-size: 32px; font-weight: 600; color: var(--bone); margin: 8px 0 16px; line-height: 1.35; }
.end .text { margin: 0; }
.end .epitaph { font-family: var(--sans); font-size: 13px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 12px; margin-top: 20px; }
.end .new { color: var(--warn); margin-top: 4px; }

/* ---------------------------------------------------------------- 가방 · 수첩 */
.veil { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 10; }
.sheet { position: fixed; z-index: 11; left: 0; right: 0; bottom: 0; top: 6vh; margin: 0 auto; max-width: 620px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 6px 6px 0 0; display: flex; flex-direction: column; animation: up 0.2s ease-out; }
@keyframes up { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); font-family: var(--sans); }
.sheet-head h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--bone); }
.sheet-head .cap { font-size: 12.5px; color: var(--dim); margin-left: 8px; font-weight: 400; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 16px 28px; flex: 1; }
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 8px 12px 0; border-bottom: 1px solid var(--line); font-family: var(--sans); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; font-size: 13.5px; color: var(--dim); }
.tab.on { color: var(--bone); border-bottom-color: var(--rust); }
.row { padding: 13px 0; border-bottom: 1px solid var(--line); }
.row h4 { margin: 0; font-size: 16.5px; font-weight: 600; color: var(--bone); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.row h4 small { font-family: var(--sans); font-weight: 400; font-size: 12px; color: var(--dim); }
.row p { margin: 3px 0 0; font-size: 15px; color: var(--ink); line-height: 1.7; }
.row .meta { font-family: var(--sans); font-size: 12px; color: var(--dim); margin-top: 5px; }
.row.unknown h4 { color: var(--faint); }
.row.unknown p { color: var(--faint); }
.row .acts { display: flex; gap: 6px; margin-top: 9px; }
.mini { background: none; border: 1px solid var(--line); border-radius: 2px; padding: 6px 12px; font-family: var(--sans); font-size: 13px; color: var(--ink); line-height: 1.3; }
.mini.use { border-color: var(--rust-dim); color: var(--bone); }
.notes { list-style: none; margin: 8px 0 0; padding: 0; font-size: 15px; line-height: 1.65; }
.notes li { padding-left: 4.6em; position: relative; margin-top: 2px; }
.notes li::before { position: absolute; left: 0; top: 2px; font-family: var(--sans); font-size: 11.5px; width: 4.2em; }
.notes .like::before { content: '좋아한다'; color: var(--good); }
.notes .dislike::before { content: '싫어한다'; color: var(--bad); }
.notes .note::before { content: '알게 된 것'; color: var(--dim); }
.empty { color: var(--faint); padding: 26px 0; font-size: 15px; }
.toast { margin: 10px 0 0; padding: 9px 12px; background: var(--panel-2); border-left: 2px solid var(--rust); font-family: var(--sans); font-size: 13px; color: var(--ink); }
.sub-head { font-family: var(--sans); font-size: 11px; letter-spacing: 0.2em; color: var(--faint); margin: 18px 0 0; }
.wipe { margin: 26px 0 0; font-family: var(--sans); font-size: 12.5px; color: var(--faint); }
.wipe button { background: none; border: 0; border-bottom: 1px solid var(--line); padding: 0; color: var(--dim); font-size: 12.5px; }
.wipe button.sure { color: var(--bad); border-color: var(--rust-dim); }

@media (max-width: 380px), (max-height: 700px) {
  body { font-size: 16px; }
  .text { font-size: 17px; line-height: 1.85; }
  .title h1 { font-size: 36px; }
  .ask { font-size: 20px; margin: 14px 0 10px; }
  .opt b { font-size: 16.5px; } .opt span { font-size: 13px; }
  .opts { gap: 6px; }
  .vitals { gap: 5px 12px; }
}

/* 마우스가 있는 기기에서만 hover 강조 — 손가락으로 누른 자리가 다음 화면에서 눌린 채 보이지 않게 */
@media (hover: hover) and (pointer: fine) {
  .tool:hover { border-color: var(--faint); }
  .choice:hover:not(:disabled) { border-left-color: var(--rust); background: var(--panel-2); }
  .link:hover { color: var(--bone); border-color: var(--rust); }
  .home:hover { color: var(--dim); }
  .opt:hover:not(:disabled) { background: var(--panel-2); border-left-color: var(--rust); }
  .btn:hover { background: #efe9d8; }
  .btn.ghost:hover { border-color: var(--faint); background: none; }
  .mini:hover { border-color: var(--faint); }
}


/* ---------------------------------------------------------------- 그림 */
.pic { margin: 2px 0 12px; height: 30vh; height: 30dvh; max-height: 300px; overflow: hidden; }
.pic img { display: block; width: 100%; height: 100%; object-fit: cover;
  -webkit-mask-image: radial-gradient(ellipse 80% 76% at 50% 50%, #000 70%, transparent 100%); mask-image: radial-gradient(ellipse 80% 76% at 50% 50%, #000 70%, transparent 100%); }
.pic.night img { filter: brightness(0.78); }
.pic.tall { height: 46vh; height: 46dvh; max-height: 440px; }
.pic.tall img { object-fit: contain; }
.entry.old.pic { opacity: 0.8; }
.rowpic { display: block; width: 100%; max-height: 300px; object-fit: cover; margin: 4px 0 10px; border-radius: 2px; }
.rowpic.tall { max-height: 380px; object-fit: contain; background: #000; }
/* 첫 화면: 그림 위로 제목, 아래로 고를 것 */
.title.has-bg { position: relative; justify-content: flex-start; padding: 1.5vh 16px 3vh; margin: 0 -16px; }
.title .head, .title .bottom { position: relative; z-index: 1; }
.title .bottom { padding-top: 26px; }
.title.has-bg .bottom { padding-top: 10px; }   /* 화면 끝에서 끝까지 고르게 어두워진다 */
.title.has-bg .menu { margin-top: 0; }
.title h1.logo { margin: 0 0 6px; }
.title h1.logo img { display: block; width: 100%; max-width: 560px; height: auto; margin-left: -2%; }
/* 첫 화면 문장: 그림의 검은 하늘 가운데에 두고, 건물과 겹쳐도 읽히게 그림자를 깐다 */
.title.has-bg .head p { text-align: center; color: var(--bone); font-size: 15.5px; margin: 0 0 2px;
  text-shadow: 0 0 6px #000, 0 0 12px #000, 0 0 18px #000, 0 1px 2px #000; }

/* 제작자 표시 */
.credit { margin: 14px 0 0; font-family: var(--sans); font-size: 11.5px; color: var(--faint); letter-spacing: 0.02em; }
.credit a { color: var(--dim); text-decoration: none; border-bottom: 1px solid var(--line); }
.title .credit, .end .credit { margin-top: 10px; font-size: 11.5px; color: var(--faint); }
/* 첫 화면 그림: 제목과 버튼 사이의 남는 자리를 채우고, 아래 끝(걷는 사람)이 버튼 바로 위에 온다 */
.title .bgwrap { flex: 1; min-height: 120px; position: relative; margin: 0 -16px; }
.title .bgwrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 74%; pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 94%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 94%, transparent 100%); }

/* ---------------------------------------------------------------- 머리: 하늘 띠 · 자리 */
.sky { width: 64px; height: 30px; flex: none; }
.sky-bg { fill: #1a1915; } .sky.ph3 .sky-bg { fill: #0a0a0d; } .sky.ph2 .sky-bg { fill: #1f1612; }
.sky-arc { fill: none; stroke: var(--line); stroke-width: 0.8; stroke-dasharray: 1.5 2; }
.sky-ground { stroke: var(--faint); stroke-width: 0.8; }
.sky .orb { transition: transform 1.1s cubic-bezier(.4, 0, .2, 1); }
.sun { fill: var(--bone); } .sun.dusk { fill: #d08a5a; }
.moon { fill: #d9d3c5; } .moon-cut { fill: #0a0a0d; }
.star { fill: var(--dim); }
.top .where { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.top .where b { color: var(--bone); font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .where i { font-style: normal; color: var(--dim); font-size: 12px; margin-top: 1px; }
/* 심전도 */
.ecg { display: block; flex: 1; min-width: 0; height: 22px; }
/* 기척이 오를 때 깔리는 줄 · 추격 글 */
.note.threat { color: var(--mon); }
.text.chase { border-left: 2px solid var(--mon); padding-left: 10px; }
/* 위협: 글 칸 가장자리의 붉은 맥박, 잡힐 때의 흔들림 */
#app { position: relative; }
#app::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 5; box-shadow: inset 0 0 0 0 rgba(196, 72, 59, 0); transition: box-shadow 0.6s; }
#app.th2::after { animation: edge2 2.4s ease-in-out infinite; }
#app.th3::after { animation: edge3 0.9s ease-in-out infinite; }
#app.pulse::after { animation: edgeOnce 0.9s ease-out 1; }
#app.th3 .log { animation: jitter 0.28s steps(2) infinite; }
#app.calm.th3 .log { animation: none; }
#app.shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) 1; }
@keyframes edge2 { 0%, 100% { box-shadow: inset 0 0 18px 0 rgba(196, 72, 59, 0.10); } 50% { box-shadow: inset 0 0 34px 2px rgba(196, 72, 59, 0.28); } }
