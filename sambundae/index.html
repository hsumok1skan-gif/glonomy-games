 식당 밥도 별거 없더라.","보고서보다 쥐가 낫다.","총은 아직도 내가 제일 잘 쏜다."],["내가 이 계급까지 올 줄은 몰랐다.","곧 끝난다던 전쟁이다. 이제 안 믿는다.","쥐 대왕 잡으면 그때 쉰다."]],tori:t=>[["……","헛간 쪽이 조용하다. 이상한데?","큰 소리는 내지 마."],["……정찰 다녀왔다.","발자국이 늘었다.","조용히 가자."],["보고는 짧게 한다. 쥐 많다.","……","앞은 내가 본다."],["계급이 올라도 할 말은 적다.","……출발.","쥐는 그대로다. 우리가 늘었을 뿐."]],kongi:t=>[["다친 데 있으면 바로 말해요.","붕대는 넉넉해요. 그러니까 다치지 마세요.","오늘은 아무도 안 다쳤으면 좋겠어요."],["신병들한테 붕대 감는 법부터 가르치는 중이에요.","다치면 참지 말고 말해요. 명령이에요.","구급낭 새로 쌌어요."],["의무대가 커졌어요. 그래도 붕대는 제가 감아요.","이번 작전도 전원 복귀가 목표예요.","다들 밥은 먹었죠?"],["제가 이렇게 높아질 줄은 몰랐어요.","계급이 높아도 상처는 똑같이 아파요.","다 같이 돌아오는 게 제일 큰 공이에요."]],dubu:t=>[["멸치 남는 거 있어?","상자 뒤질 땐 나 불러. 냄새로 알아.","배고프면 못 싸워. 진짜야."],["보급은 내가 챙긴다. 간식도.","오늘은 상자 운이 좋을 것 같아.","후임들 밥은 내가 먼저 챙긴다."],["보급 장부가 두꺼워졌어. 간식 칸이 제일 길어.","배부른 군대가 이긴다.","상자는 아직도 내가 제일 잘 찾아."],["보급 걱정은 하지 마. 내가 있잖아.","계급이 높아도 냄새는 내가 먼저 맡아.","다들 배부르게 먹고 나가자."]],danchu:t=>[["무전 감도 양호합니다!","보급 요청 넣었습니다!","보리 오기 전엔 제가 막내였습니다."],["무전기 새 걸로 바꿨습니다. 잘 들립니다!","통신 이상 없습니다.","후임한테 무전 잡는 법 가르치는 중입니다."],["통신망은 제가 책임집니다.","사령부 연결됐습니다. 오늘은 말이 짧습니다.","무전 너머로 다 듣고 있습니다."],["이제 무전이 저한테로 옵니다.","지시 내려보냈습니다. 다들 들었겠죠?","통신 끊기면 제가 직접 뛰어갑니다."]],hodu:t=>[["쏘기 전에 귀 막아라. 두 번 말 안 한다.","포탄은 하나면 된다. 잘 떨어지면.","우리에 갇혀 있을 때도 탄도 계산은 했다."],["포 정비 끝났다.","좌표만 불러라. 나머지는 내가 한다.","귀 막아."],["포대 하나 맡았다. 귀는 여전히 막아라.","계산은 끝났다. 쏘기만 하면 된다.","오늘 바람이 좋다. 잘 떨어지겠다."],["포 소리가 그리워서 아직 직접 쏜다.","지휘도 포격도 한 방이면 된다.","계급이 올라도 그 말은 안 바뀐다. 귀 막아."]],mango:t=>[["……움직이지 마. 지금 좋은 자리야.","풀은 매일 갈아 꽂는다. 시든 풀은 티가 나.","구해 줘서 고마워. 빚은 한 발로 갚을게."],["자리 잡았어.","한 발이면 충분해.","바람 읽는 중이야."],["저격조 하나 맡았어. 다들 숨는 건 잘해.","쏠 때는 숨 참아.","좋은 자리는 내가 먼저 찾아."],["높은 데 오니 멀리까지 보이네.","한 발로 갚을 빚은 다 갚았어.","움직이지 마. 지금도 좋은 자리야."]],gamja:t=>[["내 뒤에 있어. 다 막아 줄게.","냄비 뚜껑은 할머니 거야. 나중에 돌려드릴 거야.","천천히 가도 돼. 다 같이 가니까."],["앞은 내가 설게.","뚜껑은 아직 멀쩡해.","다들 내 뒤로."],["방패조 하나 맡았어. 다 내 뒤로 와.","맞는 건 내가 할게.","천천히 가자. 다 같이."],["계급이 높아도 앞은 내가 선다.","할머니한테 뚜껑 돌려드릴 날이 오겠지.","아무도 안 다치면 그걸로 됐어."]]},ra={};for(const t in ia)ra[t]=()=>ia[t](M(t))[sa(t)];const la=t=>100*x(t)+(g[t].sen||0);let ca=0;const da={s
