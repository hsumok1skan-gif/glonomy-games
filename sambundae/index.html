<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17180f">
<meta name="description" content="3분대 — 고양군 제3분대 이병 보리. 쥐 떼를 막아 내고, 주워 온 것으로 군장을 꾸리고, 살아서 철수한다.">
<meta name="author" content="@hong_sumok">
<meta name="copyright" content="@hong_sumok · 무단 복제·배포 금지">
<title>3분대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 단일 화면 앱: 마을(군장 수첩 느낌의 탭 화면) ↔ 침투(캔버스 전장) */
:root{
  --bg:#17180f; --panel:#22241a; --panel2:#2b2e21; --line:#3d4130;
  --fg:#ece5cf; --dim:#a9a58d; --brass:#c9a24a; --danger:#c8553f; --ok:#8fae6a;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{position:relative;height:100%;width:100%;overflow:hidden}

/* ---------- 마을 ---------- */

.hubin{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-size:2.4rem;line-height:1;letter-spacing:.02em}
.logo small{display:block;font-family:var(--body);font-size:.72rem;color:var(--dim);letter-spacing:.12em;margin-top:6px;font-weight:600}
.purse{text-align:right;font-variant-numeric:tabular-nums}
.purse b{font-family:var(--display);font-weight:400;font-size:1.25rem;color:var(--brass)}
.purse div{font-size:.78rem;color:var(--dim)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);padding:4px;border-radius:10px}
.tabs button{background:none;border:0;padding:9px 0;border-radius:7px;font-weight:600;font-size:.9rem;color:var(--dim)}
.tabs button.on{background:var(--panel2);color:var(--fg)}
.sec{display:flex;flex-direction:column;gap:10px}
.h{font-family:var(--display);font-size:1.05rem;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:baseline}
.h span{font-family:var(--body);font-size:.75rem;color:var(--dim)}
.note{font-size:.82rem;color:var(--dim);line-height:1.55}
.photo{width:100%;aspect-ratio:1.45;border-radius:10px;border:1px solid #4a2a22;box-shadow:0 8px 24px rgba(0,0,0,.6);background:#2b231e;cursor:pointer;display:block;box-sizing:border-box}
.pnames{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pnames .chip{font-size:.8rem;padding:6px 12px;border-radius:14px}
.chip.s{color:var(--brass);border-color:var(--brass)}
.chip.lock{opacity:.45}
.syn{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:var(--panel)}
.syn.on{border-color:var(--brass);background:linear-gradient(135deg,rgba(201,162,74,.16),var(--panel))}
.syn b{font-size:1rem}.syn small{color:var(--dim);font-size:.8rem;line-height:1.5}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cat{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;position:relative}
.cat canvas{width:56px;height:52px}
.cat b{font-size:.92rem}
.cat i{font-style:normal;color:var(--dim);font-size:.7rem}
.cat.s{border-color:var(--brass)}
.cat.a{border-color:var(--ok)}
.cat .role{position:absolute;top:5px;left:6px;font-size:.66rem;font-weight:700;letter-spacing:.06em}
.cat.s .role{color:var(--brass)} .cat.a .role{color:var(--ok)}
.cat.lock{opacity:.45}
.squad{display:flex;gap:8px}
.squad button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.82rem}
.squad button.on{border-color:var(--brass);color:var(--brass)}
.roleinfo{font-size:.8rem;line-height:1.55;background:var(--panel);border-radius:8px;padding:9px 11px;color:var(--dim)}
.roleinfo b{color:var(--fg)}
.packs{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.packs > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:.72rem;color:var(--dim);font-weight:700;letter-spacing:.08em}
.grid{align-self:flex-start;width:max-content;position:relative;background:#1c1e15;border:1.5px solid var(--line);border-radius:8px;display:grid;grid-template-columns:repeat(var(--cols),var(--cs));grid-template-rows:repeat(var(--rows),var(--cs));padding:3px;box-sizing:content-box}
.grid.pocket{background:#2a2416;border-color:#5a4b2a}
.cell{border:1px dashed #33362a;border-radius:4px;background:none;padding:0;margin:1px}
.cell.ok{border-color:var(--ok);background:rgba(143,174,106,.12)}
.cell.hov{border:1.5px solid var(--ok);background:rgba(143,174,106,.35)}
.cell.bad{border:1.5px solid var(--danger);background:rgba(200,85,63,.3)}
.it,.grid .cell{touch-action:none;user-select:none;-webkit-user-select:none}
.tok{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.it.dragging,.tok.dragging{opacity:.3}
.it.pend{outline:3px dashed var(--brass)!important}.it.pend::after{content:'↻';position:absolute;right:3px;top:1px;color:#ffe08a;font-weight:700;font-size:.9rem;text-shadow:0 1px 2px #000}
.pendmsg{font-size:.76rem;color:#ffe08a;margin-top:4px}
.tok img,.it img,.ghost img,.pimg img{pointer-events:none;-webkit-user-drag:none;user-select:none}
.tokens.hov{outline:2px dashed var(--ok);outline-offset:4px;border-radius:8px}
.ghost{position:fixed;z-index:999;pointer-events:none;border-radius:6px;border:2px solid var(--brass);background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--ic) 45%,#2a2c20),#1e2016 80%);box-shadow:0 10px 24px rgba(0,0,0,.6);transform:scale(1.06);opacity:.92}
.ghost img{width:100%;height:100%;display:block}
.it{position:absolute;border-radius:6px;border:2px solid #0e0f0a;padding:0;box-sizing:border-box;overflow:hidden;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--ic) 38%,#2a2c20),#1e2016 80%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ic) 50%,transparent)}
.it img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.it.k-weapon{border-color:#5a4a22}.it.k-mod{border-color:#3d5a3a}
.kitw{display:flex;flex-direction:column;gap:12px}
.tech{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}.tech .lbl{width:100%}
.tc{flex:1 1 130px;background:#1c1d14;border:1px solid var(--line);border-radius:8px;padding:6px 9px;display:grid;grid-template-columns:1fr auto;gap:0 8px;opacity:.6}
.tc.on{opacity:1;border-color:var(--brass);background:linear-gradient(135deg,rgba(201,162,74,.14),#1c1d14)}
.tc b{font-size:.84rem}.tc .tn{font-size:.74rem;color:var(--brass);font-weight:700}.tc small{grid-column:1/-1;font-size:.68rem;color:var(--dim);line-height:1.4}
.kit{display:flex;gap:10px;align-items:flex-start;justify-content:center}
.kcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.kcol.out .grid{opacity:.4;filter:grayscale(1)}
.khead{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.2}
.khead canvas{width:56px;height:49px}
.khead b{display:block;font-size:.88rem}.khead small{color:var(--dim);font-size:.66rem}
.kmid{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:58px}
.ksafe{font-size:.62rem;color:#d8c48a;text-align:center;line-height:1.35;max-width:84px}
.kout{font-size:.66rem;color:#f0b3a6}
.it.sel{outline:3px solid var(--fg);outline-offset:1px;z-index:2}
.it .q{position:absolute;right:3px;bottom:1px;font-size:.66rem;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.it .k{font-size:.55rem;opacity:.7;font-weight:600}
.tokens{display:flex;flex-wrap:wrap;gap:6px}
.tok{position:relative;width:68px;border:2px solid #0e0f0a;border-radius:8px;padding:6px 3px 4px;display:flex;flex-direction:column;gap:3px;align-items:center;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--ic) 40%,#2a2c20),#1e2016 78%);color:var(--fg)}
.tok .ti{height:48px;display:flex;align-items:center;justify-content:center}
.tok small{font-size:.6rem;font-weight:600;color:var(--dim);line-height:1.15;word-break:keep-all;text-align:center}
.tok .q{position:absolute;right:4px;top:3px;font-size:.66rem;font-weight:700;color:var(--fg)}
.tok.k-weapon{border-color:#5a4a22}.tok.k-mod{border-color:#3d5a3a}
.tok.sel{outline:3px solid var(--fg);outline-offset:1px}
.info{background:var(--panel);border-radius:8px;padding:10px 12px;font-size:.82rem;line-height:1.55;min-height:46px}
.info b{font-size:.9rem}
.info .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:.84rem}
.btn:disabled{opacity:.35;cursor:default}
.btn.main{background:var(--brass);border-color:var(--brass);color:#1a1709;font-family:var(--display);font-size:1.25rem;font-weight:400;padding:14px;letter-spacing:.06em;width:100%}
.btn.warn{border-color:var(--danger);color:#f0b3a6}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:8px;padding:9px 11px;font-size:.85rem}
.li > div{flex:1;min-width:0}
.li small{display:block;color:var(--dim);font-size:.75rem;line-height:1.45;margin-top:2px}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.pips i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--brass)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brass)}
.ranks{display:flex;justify-content:space-between;font-size:.72rem;color:var(--dim)}
.ranks b{color:var(--brass)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--dim);background:var(--panel);border-radius:8px;padding:9px 11px}
.sw input{width:20px;height:20px;accent-color:var(--brass)}
.li.zone{border:1.5px solid var(--line);text-align:left;width:100%}
.li.zone.on{border-color:var(--brass)}
.li.zone:disabled{opacity:.45;cursor:default}
.medal{width:22px;height:28px;flex:none;border-radius:3px 3px 11px 11px;background:var(--line)}
.medal.on{background:linear-gradient(180deg,#8a2f26 0 38%,var(--brass) 38%)}

/* ---------- 주둔지 로비 ---------- */
#hub{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
#lcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ltop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.ltop > *{pointer-events:auto}
.lid{display:flex;gap:10px;align-items:center}
.ins{width:42px;height:42px;border-radius:50%;background:rgba(10,11,7,.62);border:1.5px solid var(--brass);display:grid;place-items:center;flex:none}
.ins svg{width:22px;height:22px;stroke:var(--brass);fill:none;stroke-linecap:round;stroke-linejoin:round}
.lidt b{font-family:var(--display);font-weight:400;font-size:1.4rem;letter-spacing:.04em;margin-right:6px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.lidt small{font-size:.75rem;color:#e8d9b0;font-weight:700}
.lexp{width:120px;height:4px;background:rgba(0,0,0,.5);border-radius:2px;margin:4px 0 2px;overflow:hidden}
.lexp i{display:block;height:100%;background:var(--brass)}
#lmerit{font-size:.66rem;color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums}
.lres{display:flex;align-items:center;gap:8px}
.res{display:flex;align-items:center;gap:6px;background:rgba(10,11,7,.62);border:1px solid rgba(201,162,74,.35);border-radius:999px;padding:5px 12px 5px 8px;font-variant-numeric:tabular-nums}
.res svg{width:20px;height:20px;color:#a9c0cf}
.res b{font-size:.92rem}
.ib{width:36px;height:36px;border-radius:50%;background:rgba(10,11,7,.62);border:1px solid var(--line);display:grid;place-items:center}
.ib svg,.side svg,.nb svg,.ngo svg,.larrow svg,.zarr svg,.sx svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib svg{width:20px;height:20px}
.lside{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:74px;display:flex;flex-direction:column;gap:10px}
.side{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;font-weight:700;text-shadow:0 1px 3px #000;padding:0}
.side svg{width:42px;height:42px;padding:9px;background:rgba(10,11,7,.55);border:1px solid var(--line);border-radius:12px;box-sizing:border-box}
.lgoal{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:64px;width:min(200px,46vw);text-align:left;background:linear-gradient(90deg,rgba(236,229,207,.94),rgba(236,229,207,.84));color:#1b1c12;border:0;border-left:4px solid var(--brass);border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.gk{font-size:.62rem;font-weight:700;letter-spacing:.08em;color:#7a5f22}
.lgoal b{font-size:.9rem}
.lgoal small{font-size:.7rem;color:#4a4a3a;line-height:1.4}
.gbar{height:3px;background:rgba(0,0,0,.15);margin-top:5px}
.gbar i{display:block;height:100%;background:#9a7424}
.lbubble{position:absolute;left:50%;top:calc(50% - min(19vw,15vh,130px)*2.15);transform:translateX(-12%);max-width:min(240px,60vw);background:rgba(244,240,228,.96);color:#1b1c12;border-radius:4px;padding:8px 12px 9px;font-size:.84rem;line-height:1.5;box-shadow:0 4px 18px rgba(0,0,0,.35);border-left:3px solid var(--brass);pointer-events:none}
.lbubble::after{content:"";position:absolute;left:16px;bottom:-8px;border:8px solid transparent;border-top-color:rgba(244,240,228,.96);border-bottom:0}
.lbubble b{display:block;font-size:.7rem;color:#7a5f22;letter-spacing:.06em}
.ltap{position:absolute;left:50%;top:50%;width:min(44vw,27vh,270px);height:min(40vw,24vh,240px);transform:translate(-50%,-50%);background:none;border:0;border-radius:50%}
.larrow{position:absolute;top:60%;width:40px;height:48px;background:rgba(10,11,7,.45);border:0;border-radius:8px;display:grid;place-items:center;color:var(--fg)}
.larrow svg{width:22px;height:22px}
.larrow.l{left:max(6px,env(safe-area-inset-left,0px))}
.larrow.r{right:max(6px,env(safe-area-inset-right,0px))}
.lplate{position:absolute;left:50%;transform:translateX(-50%);top:calc(50% + min(19vw,15vh,130px)*1.3);text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;width:min(300px,80vw)}
.pn{display:flex;align-items:center;gap:8px}
.pn b{font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:.06em;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.chip{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:4px;background:rgba(0,0,0,.5);border:1px solid var(--line);color:var(--dim)}
.chip.s{color:var(--brass);border-color:var(--brass)}
.chip.a{color:var(--ok);border-color:var(--ok)}
.lplate small{font-size:.78rem;color:#e0d7bd;text-shadow:0 1px 4px #000}
.pdots{display:flex;gap:6px;margin-top:4px}
.pdots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.32)}
.pdots i.on{background:var(--brass);width:16px}
.pdots i.lk{background:rgba(255,255,255,.12)}
.pdots i.on.lk{background:#7a6a40}
.pbtn{margin-top:6px;background:rgba(10,11,7,.72);border:1px solid var(--brass);color:var(--brass);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.8rem}
.lzone{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:226px;max-width:150px;display:flex;align-items:center;gap:2px;background:rgba(10,11,7,.7);border:1px solid var(--line);border-radius:6px;padding:6px 2px}
.lzone div{display:flex;flex-direction:column;min-width:0}
.lzone b{font-size:.92rem}
.lzone small{font-size:.64rem;color:var(--dim);word-break:keep-all;line-height:1.35}
.lzone .gk{color:var(--brass)}
.zarr{background:none;border:0;width:28px;height:38px;display:grid;place-items:center;color:var(--fg);padding:0}
.zarr svg{width:16px;height:16px}
.lnav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:0 max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));background:linear-gradient(0deg,rgba(10,11,7,.96) 58%,rgba(10,11,7,0));height:calc(88px + env(safe-area-inset-bottom,0px))}
.nb{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:700;color:#d9d0b4;position:relative;padding:4px 0}
.nb svg{width:26px;height:26px}
.nb .dot{position:absolute;top:2px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:#e2603f}
.ngo{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;transform:translateY(-8px);padding:0}
.ngo .ring{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d27c,var(--brass) 60%,#8a6a22);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(10,11,7,.9),0 0 0 4.5px var(--brass),0 6px 18px rgba(0,0,0,.5)}
.ngo svg{width:30px;height:30px;stroke:#1a1709;stroke-width:2}
.ngo b{font-family:var(--display);font-weight:400;font-size:.95rem;color:var(--fg);letter-spacing:.1em}
#sheet{position:absolute;inset:0;z-index:5}
.sbg{position:absolute;inset:0;background:rgba(5,6,3,.55)}
.sbox{position:absolute;left:0;right:0;bottom:0;height:86%;max-width:620px;margin:0 auto;background:var(--panel);border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
#sheet.in .sbox{animation:sup .22s ease-out}
@keyframes sup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.shead{display:flex;align-items:center;justify-content:space-between;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.shead b{font-family:var(--display);font-weight:400;font-size:1.3rem;letter-spacing:.04em}
.sx{background:none;border:0;width:36px;height:36px;display:grid;place-items:center;color:var(--fg)}
.sx svg{width:22px;height:22px}
.sbody{overflow-y:auto;flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(24px + env(safe-area-inset-bottom,0px))}
.sin{display:flex;flex-direction:column;gap:12px}
.lead{margin:0;font-size:.82rem;color:var(--dim);line-height:1.6}
.lead.warn{color:#f0b3a6}
.sbody .list{gap:0}
.sbody .li{background:none;border-radius:0;border-bottom:1px solid var(--line);padding:11px 2px;text-align:left;width:100%}
.sw8{width:14px;height:14px;border:2px solid #0e0f0a;border-radius:3px;flex:none}
.ab{border-top:1px solid var(--line);padding-top:10px}
.abh{display:flex;align-items:baseline;gap:8px}
.abh b{font-size:.95rem}
.abh span{font-size:.75rem;color:var(--dim)}
.ab dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.8rem;line-height:1.5}
.ab dt{color:var(--brass);font-weight:700;font-size:.72rem;padding-top:2px}
.ab dd{margin:0;color:var(--fg)}
.ab dl dd:only-child{grid-column:1/-1;color:var(--dim)}
@media (min-width:760px){.lnav{grid-template-columns:repeat(7,minmax(0,100px));justify-content:center}}
@media (max-height:620px){.lside{display:none}}
@media (prefers-reduced-motion:reduce){#sheet.in .sbox{animation:none}}

/* ---------- 침투 ---------- */
#game{position:absolute;inset:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:8px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:center;gap:8px}
.clock{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums;letter-spacing:.04em;text-shadow:0 1px 0 #000}
.lv{font-size:.72rem;font-weight:700;color:var(--brass);background:rgba(0,0,0,.45);padding:2px 7px;border-radius:5px}
.lv.kc{color:#e9e1c8;margin-left:4px}
.xp{height:5px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden}
.xp i{display:block;height:100%;background:#d9c47a}
.hp{display:flex;flex-direction:column;gap:3px;width:150px}
.hpl{display:flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;text-shadow:0 1px 0 #000}
.hpl span{width:42px;white-space:nowrap}
.hpl .bar{flex:1;height:9px;background:rgba(0,0,0,.6);position:relative;border:1px solid rgba(0,0,0,.6)}
.hpl .bar i{position:absolute;left:0;top:0;bottom:0;width:100%}
.hpl .bar .tr{background:#e8c24a}
.hpl .bar .cu{background:#d4472f}
.hpl .bar::after{content:"";position:absolute;inset:0;background:#fff;opacity:0}
.hpl.out{opacity:.4}
.hpl b{position:relative}
.hpl.front b::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-3px;border:3px solid transparent;border-left:5px solid var(--brass)}
.hpl:not(.front){opacity:.75}
.hpl.out{opacity:.4}
@keyframes shk{0%,100%{transform:none}30%{transform:translateX(-2px)}65%{transform:translateX(2px)}}
@keyframes shkb{0%,100%{transform:none}15%{transform:translate(-5px,-1px)}35%{transform:translate(5px,1px)}55%{transform:translate(-3px,0)}75%{transform:translate(2px,0)}}
@keyframes flashb{0%{opacity:.95}100%{opacity:0}}
.hpl.shk .bar{animation:shk .16s}
.hpl.crit .bar{animation:shkb .34s}
.hpl.crit .bar::after{animation:flashb .3s ease-out}
@media (prefers-reduced-motion:reduce){.hpl.shk .bar,.hpl.crit .bar{animation:none}}
.exitst{font-size:.75rem;font-weight:600;background:rgba(0,0,0,.5);border-radius:6px;padding:4px 8px;align-self:flex-start}
.exitst.open{color:#f1d27a}
#banner{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--display);font-size:1.5rem;text-align:center;text-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.8);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .25s}
#banner small{display:block;font-family:var(--body);font-size:.8rem;font-weight:600;color:var(--dim);margin-top:4px}
.gbtns{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.gbtns.l{left:max(14px,env(safe-area-inset-left,0px))}
.gbtns.r{right:max(14px,env(safe-area-inset-right,0px))}
.gb{width:64px;height:64px;border-radius:50%;background:rgba(20,21,14,.78);border:2px solid var(--line);font-weight:700;font-size:.82rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;overflow:hidden}
.gb small{font-size:.6rem;color:var(--dim);font-weight:600}
.gb .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6)}
.gb.sm{width:44px;height:44px}
.gb.pulse{animation:gbp 1.6s ease-out}
@keyframes gbp{0%,30%,60%{border-color:#ffe08a;box-shadow:0 0 0 0 rgba(255,224,138,.7)}15%,45%{box-shadow:0 0 0 10px rgba(255,224,138,0)}100%{border-color:var(--line)}}
.gb.sk{width:56px;height:56px;align-self:flex-end;font-size:.7rem;border-color:#5a4b2a}
.gb.sk small{font-size:.56rem}
#log{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#log div{font-size:.78rem;font-weight:700;background:rgba(12,13,8,.78);border:1px solid var(--line);border-radius:6px;padding:4px 10px;white-space:nowrap;transition:opacity .4s}
#log div.no{color:#f0b3a6}
#log i{display:inline-block;width:9px;height:9px;border:1.5px solid #0e0f0a;margin-right:6px;vertical-align:-1px}
#pausebtn{position:absolute;top:8px;right:max(12px,env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:8px;background:rgba(0,0,0,.5);border:1px solid var(--line);font-weight:700}

/* ---------- 오버레이 ---------- */
#ov{position:absolute;inset:0;background:rgba(10,11,7,.86);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 28px;z-index:10}
.card{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;letter-spacing:.03em}
.card p{margin:0;font-size:.88rem;line-height:1.65;color:var(--dim)}
.picks{display:flex;flex-direction:column;gap:10px}
.pick{position:relative;overflow:hidden;display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--pc,#8a8a7a) 22%,var(--panel)),var(--panel) 60%);border:2px solid color-mix(in srgb,var(--pc,#8a8a7a) 60%,var(--line));border-radius:12px;padding:12px 14px;text-align:left;font-size:.84rem;line-height:1.5;color:var(--fg)}
.pick b{display:block;font-size:1.02rem;color:var(--brass)}
.pimg{flex:0 0 60px;height:60px;border-radius:10px;background:radial-gradient(circle,color-mix(in srgb,var(--pc,#888) 45%,#2a2c20),#1a1b13 75%);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08)}
.pimg img{max-width:52px;max-height:52px}.pimg i{width:26px;height:26px;border-radius:50%;background:var(--pc)}
.ptx{min-width:0}.pk em{font-style:normal;margin-left:auto;opacity:.5;border:1px solid currentColor;border-radius:4px;padding:0 5px}
.pick.k-up .pk{color:var(--brass)}.pick.k-pass .pk{color:#9fd07a}
.lvov{background:radial-gradient(circle at 50% 30%,rgba(90,60,20,.75),rgba(10,11,7,.92) 70%)!important}
.lvc{position:relative}
.lvburst{position:absolute;left:50%;top:40px;width:640px;height:640px;margin:-320px 0 0 -320px;pointer-events:none;background:repeating-conic-gradient(rgba(255,214,120,.16) 0 7deg,transparent 7deg 18deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 0,transparent 65%);mask:radial-gradient(circle,#000 0,transparent 65%);animation:spin 14s linear infinite,burstIn .5s ease-out both}
.lvt{position:relative;text-align:center;padding-top:6px}
.lvt small{display:block;color:var(--dim);font-size:.78rem;animation:fadeUp .4s .05s both}
.lvt h2{margin:0;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:3.2rem;line-height:1.05;color:#ffe08a;text-shadow:0 0 18px rgba(255,190,80,.7),0 3px 0 #6a3a10;animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
.lvnote{text-align:center;font-size:.74rem;color:var(--dim);margin:2px 0 0;animation:fadeUp .4s .5s both}
.pick{animation:cardIn .42s cubic-bezier(.2,1.4,.4,1) var(--d) both}
.pick::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);transform:translateX(-120%);animation:shine 1s calc(var(--d) + .35s) ease-out both;pointer-events:none}
.pick:hover,.pick:focus-visible{border-color:var(--brass);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.pick.chosen{animation:chosen .26s ease-out both;border-color:#ffe08a;box-shadow:0 0 0 3px rgba(255,224,138,.4),0 0 30px rgba(255,200,90,.5)}
.pick.gone{opacity:0;transform:scale(.94);transition:.2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes burstIn{from{opacity:0;scale:.3}to{opacity:1;scale:1}}
@keyframes slam{0%{opacity:0;transform:scale(2.6)}60%{opacity:1;transform:scale(.92)}100%{transform:scale(1)}}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) rotateX(50deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes chosen{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1.02)}}
@media (prefers-reduced-motion:reduce){.lvburst,.pick,.lvt h2,.pick::after{animation:none!important}}
.pk{display:flex;align-items:center;gap:6px;font-size:.66rem;font-weight:700;letter-spacing:.06em;color:var(--dim);margin-bottom:3px}
.pk i{width:10px;height:10px;border:1.5px solid #0e0f0a;border-radius:2px}
.pick:hover{border-color:var(--brass)}
.report{background:var(--panel);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.86rem;font-variant-numeric:tabular-nums}
.report span:nth-child(even){text-align:right;font-weight:700}
.prose{font-size:.92rem;line-height:1.75;color:var(--fg)}
@media (prefers-reduced-motion:reduce){#banner{transition:none}}
</style>
</head>
