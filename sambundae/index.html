:root{
  --bg:#17180f; --panel:#22241a; --panel2:#2b2e21; --line:#3d4130;
  --fg:#ece5cf; --dim:#a9a58d; --brass:#c9a24a; --danger:#c8553f; --ok:#8fae6a;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{position:relative;height:100%;width:100%;overflow:hidden}

/* ---------- 마을 ---------- */

.purse{text-align:right;font-variant-numeric:tabular-nums}

.slot i{font-style:normal;font-size:.66rem;font-weight:700;color:var(--dim)}.slot.rs i{color:var(--brass)}.slot.ra i{color:var(--ok)}

.slot.on{border-color:#ffd25a;box-shadow:0 0 0 3px rgba(255,210,90,.35),0 0 18px rgba(255,200,80,.35);background:linear-gradient(135deg,rgba(255,210,90,.16),var(--panel))}
.slots.nudge{animation:nudge .4s}@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.cat.lock{opacity:.45}
.squad{display:flex;gap:8px}

.grid{align-self:flex-start;width:max-content;position:relative;background:#1c1e15;border:1.5px solid var(--line);border-radius:8px;display:grid;grid-template-columns:repeat(var(--cols),var(--cs));grid-template-rows:repeat(var(--rows),var(--cs));padding:3px;box-sizing:content-box}
.grid.pocket{background:#2a2416;border-color:#5a4b2a}
.cell{border:1px dashed #33362a;border-radius:4px;background:none;padding:0;margin:1px}
.cell.ok{border-color:var(--ok);background:none}.cell.ok::after{content:'';position:absolute;left:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--ok);opacity:.8}
.cell{position:relative}

.it,.grid .cell{touch-action:none;user-select:none;-webkit-user-select:none}
.tok{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

.it.pend{outline:3px dashed var(--brass)!important}.it.pend::after{content:'↻';position:absolute;right:3px;top:1px;color:#ffe08a;font-weight:700;font-size:.9rem;text-shadow:0 1px 2px #000}
.pendmsg{font-size:.76rem;color:#ffe08a;margin-top:4px}
.tok img,.it img,.ghost img,.pimg img{pointer-events:none;-webkit-user-drag:none;user-select:none}
.tokens.hov{outline:2px dashed var(--ok);outline-offset:4px;border-radius:8px}
.ghost{position:fixed;z-index:999;pointer-events:none;border-radius:6px;border:2px solid var(--brass);background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--ic) 45%,#2a2c20),#1e2016 80%);box-shadow:0 10px 24px rgba(0,0,0,.6);transform:scale(1.06);opacity:.92}
.ghost img{width:100%;height:100%;display:block}
.it{position:absolute;border-radius:6px;border:2px solid #0e0f0a;padding:0;box-sizing:border-box;overflow:hidden;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--ic) 38%,#2a2c20),#1e2016 80%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ic) 50%,transparent)}

.it.k-weapon{border-color:#5a4a22}.it.k-mod{border-color:#3d5a3a}
.kitw{display:flex;flex-direction:column;gap:12px}
.tech{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}.tech .lbl{width:100%}
.tc{flex:1 1 130px;background:#1c1d14;border:1px solid var(--line);border-radius:8px;padding:6px 9px;display:grid;grid-template-columns:1fr auto;gap:0 8px;opacity:.6}
.tc.on{opacity:1;border-color:var(--brass);background:linear-gradient(135deg,rgba(201,162,74,.14),#1c1d14)}
.tc.cb{flex-basis:100%}.tc b{font-size:.84rem}.tc .tn{font-size:.74rem;color:var(--brass);font-weight:700}.tc small{grid-column:1/-1;font-size:.68rem;color:var(--dim);line-height:1.4}
.kit{display:flex;gap:10px;align-items:stretch;justify-content:center}
.kcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.kcol.out .grid{opacity:.4;filter:grayscale(1)}
.khead{display:flex;align-self:stretch;justify-content:flex-start;align-items:flex-end;gap:4px;line-height:1.15;margin-bottom:-4px;position:relative;z-index:1}.khead .kport{margin-left:-18px}.khead.rev{flex-direction:row-reverse;text-align:right}.khead.rev .kport{margin-left:0;margin-right:-18px}
.kport{width:72px;height:58px}.kname{padding-bottom:6px}.kname small{display:block;font-size:.62rem;color:var(--dim)}.kname b{font-size:1.02rem}
.kcol .khl{display:block;margin:auto 0 3px;padding-top:10px}.khead.rev~.khl{text-align:right}
.grid.hand{border-color:rgba(232,196,90,.6)}.grid.hand .it{background:radial-gradient(circle,rgba(232,196,90,.18),transparent 70%)}
.kpk{display:flex;align-items:stretch;gap:10px;margin-top:8px}.kpb{flex:none;display:flex;flex-direction:column;justify-content:center;gap:3px}.kpb .lbl{font-size:.62rem;margin:0}.kpr{display:flex;gap:4px}
.kph{margin:0;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 14px;font-size:.78rem;line-height:1.55;color:var(--dim)}.card.prologue{max-height:88vh;display:flex;flex-direction:column}.card.prologue h2 small{display:block;font-size:.72rem;letter-spacing:.2em;color:#c9a85c;margin-bottom:4px}.plb{overflow-y:auto;flex:1;margin:6px 0 12px;padding-right:4px}.plb .pl{margin:0 0 .7em;line-height:1.75;font-size:.92rem;color:#e7dfc8}.plb .pl.q{color:#f3e9c9;padding-left:.6em;border-left:2px solid rgba(201,168,92,.45)}
.pro{position:fixed;inset:0;z-index:400;background:#07080a;color:#efe6cc;overflow:hidden;user-select:none;-webkit-user-select:none;animation:pfade .5s ease}.pro.out{opacity:0;transition:opacity .4s}@keyframes pfade{from{opacity:0}}
.pskip{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:5;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);color:#cfc6ad;border-radius:999px;padding:6px 14px;font-size:.78rem}
.pgo{position:absolute;left:28px;right:28px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:auto!important;max-width:720px;margin:0 auto;z-index:6;animation:pfade .6s ease}
.ppic{position:absolute;left:0;right:0;top:0;bottom:30%;display:grid;place-items:center}.ppic img{max-width:62%;max-height:62%;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(0,0,0,.7));animation:pfade .6s ease}.ppic img.full{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;filter:brightness(.55) saturate(.8)}
.ppic.kb img{animation:pfade .8s ease,kb 9s ease-out forwards}@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.ppor{position:absolute;left:0;right:0;bottom:24%;height:52%;pointer-events:none}.ppor img{position:absolute;bottom:0;height:100%;max-width:48%;object-fit:contain;object-position:bottom;filter:brightness(.4) saturate(.6);transition:filter .25s,transform .25s}.ppor .ph{left:2%}.ppor .pb{right:2%;transform:scaleX(-1)}.ppor img.on{filter:none}.ppor .ph.on{transform:translateY(-6px) scale(1.04)}.ppor .pb.on{transform:scaleX(-1) translateY(-6px) scale(1.04)}
.pro.vn{background:radial-gradient(ellipse at 50% 85%,rgba(255,140,60,.25),transparent 60%),#0b0a08}
.pbox{position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));min-height:23%;max-width:760px;margin:0 auto;background:rgba(14,13,10,.92);border:1.5px solid rgba(201,168,92,.6);border-radius:14px;padding:14px 18px 22px;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.pbox .pn{display:inline-block;color:#1b1c12;background:#e8c24a;border-radius:6px;padding:2px 10px;font-size:.82rem;margin-bottom:8px}.pbox .pn:empty{display:none}.pbox .pt{word-break:keep-all;overflow-wrap:anywhere;margin:0;font-size:1.02rem;line-height:1.75;white-space:pre-wrap}.pbox.nar .pt{color:#cfc6ad}
