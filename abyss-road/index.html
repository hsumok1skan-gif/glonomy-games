<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a12">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>어비스로드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 가로 화면. 던전 전체를 위에서 내려다보는 지도가 화면을 채운다(드래그로 이동, 핀치·버튼으로 확대).
   방을 누르면 그 방으로 다가가고, 방 안에서는 몬스터와 침입자가 마주 선다. 위에는 반투명 패널, 아래는 조작 바.
   몬스터 쪽은 차가운 마나빛, 인간 쪽은 횃불빛. */
:root{
  color-scheme:dark;
  --abyss:#0f0d16; --rock:#191622; --stone:#252131; --stone-2:#343046; --line:#4d4763; --heat:#3a2826;
  --bone:#ebe6f2; --dim:#9992ad;
  --mana:#a890ff; --mana-deep:#4f3da6;
  --torch:#f2a84c; --torch-deep:#8d5a1c;
  --blood:#e5595e; --life:#84d8a8;
  --gold:#e8c15a; --ruby:#e5466a; --dia:#7fe3ff; --soul:#c9b8ff;
  --b-plain:#1d2d1c; --b-swamp:#152a2b; --b-snow:#232d3d; --b-volcano:#331c18; --b-forest:#14261a; --b-desert:#33291a; --b-deep:#101f33; --b-dark:#140f1f;
  --f-display:'Hahmlet','Nanum Myeongjo','Batang',serif;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
html,body{height:100%}
body{background:var(--abyss);color:var(--bone);font:14px/1.45 var(--f-ui);position:relative;overflow:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
b{font-weight:600}
#hud,.info{font-variant-numeric:tabular-nums}
.glass{background:color-mix(in srgb,var(--abyss) 60%,transparent);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
@keyframes pulse{50%{opacity:.3}}
@keyframes rise{to{transform:translate(-50%,-34px);opacity:0}}

#rot{position:absolute;top:0;left:0;transform-origin:0 0;overflow:hidden;--il:16px;--ir:16px;--it:16px;--ib:16px;--tok:72px;--bz:84px}

/* ── 던전 지도 (쿼터뷰: 바닥은 마름모, 유닛은 서 있다) */
#view{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background:radial-gradient(120% 90% at 50% 40%,var(--rock),var(--abyss))}
#view.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;--z:1}
#wsvg{position:absolute;left:0;top:0;overflow:visible}
.ibg{fill:url(#pgrid);stroke:color-mix(in srgb,var(--line) 55%,transparent);stroke-width:2;stroke-dasharray:10 8;vector-effect:non-scaling-stroke}
.pgl{fill:none;stroke:color-mix(in srgb,var(--line) 28%,transparent);stroke-width:1.5}
.ptl{fill:none;stroke:color-mix(in srgb,var(--abyss) 38%,transparent);stroke-width:1}
.icor{fill:var(--stone-2)} .icor.out{fill:url(#pout)}
.pout1{fill:var(--torch-deep)}
.iroom{fill:var(--stone);cursor:pointer;transition:fill .2s}.iroom.th-poison{fill:#1f2e22}.iroom.th-fire{fill:#33221c}.iroom.th-frost{fill:#1d2733}.iroom.th-dark{fill:#261f36}.iroom.th-earth{fill:#2e2a20}
.iroom.fight{fill:var(--heat)}
.itile{fill:url(#ptile);pointer-events:none}
.ilit{fill:url(#glit);pointer-events:none}
.iedge{fill:none;stroke:color-mix(in srgb,var(--abyss) 60%,transparent);stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none}
.iedge.sel{stroke:var(--gold);stroke-width:2.5}
.iedge.fight{stroke:var(--torch);stroke-width:2.5}
.iedge.poss{stroke:var(--mana);stroke-width:3}
.iterr{pointer-events:none}
.iterr.spike{fill:url(#pspike)} .iterr.mire{fill:color-mix(in srgb,var(--life) 22%,transparent)} .iterr.dark{fill:color-mix(in srgb,var(--abyss) 72%,transparent)} .iterr.rock{fill:url(#prock)}
.pspk{fill:color-mix(in srgb,var(--dim) 40%,transparent)} .prk{fill:var(--line)}
.isig{fill:none;stroke:var(--mana);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none;animation:pulse 1.8s ease-in-out infinite}
.ighost{fill:color-mix(in srgb,var(--stone) 25%,transparent);stroke:var(--line);stroke-width:2;stroke-dasharray:8 6;vector-effect:non-scaling-stroke;cursor:pointer}
.ighost:hover{stroke:var(--mana)}
.igate{fill:color-mix(in srgb,var(--torch-deep) 22%,transparent);stroke:var(--torch-deep);stroke-width:2;stroke-dasharray:8 6;vector-effect:non-scaling-stroke;cursor:pointer}
.iww{fill:#2e2a3d} .iwn{fill:#211d2c} .iwc{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round}
.ilip{fill:#120f19}
#talk{position:absolute;inset:0;z-index:18;pointer-events:none}
#talk .tb{position:absolute;left:var(--il);right:var(--ir);bottom:var(--ib);min-height:108px;padding:14px 18px 14px;border-radius:14px;pointer-events:auto;cursor:pointer;
  background:color-mix(in srgb,var(--abyss) 88%,transparent);border:1px solid color-mix(in srgb,var(--line) 85%,transparent);box-shadow:0 -10px 30px color-mix(in srgb,var(--abyss) 70%,transparent)}
#talk .tn{position:absolute;left:16px;top:-14px;padding:3px 12px;border-radius:8px;background:var(--rock);border:1px solid var(--line);font:600 13px var(--f-ui)}
#talk .tb p{margin:6px 0 0;font:500 16px/1.6 var(--f-display);color:var(--bone);padding-right:min(32%,230px)}
#talk .tnx{position:absolute;right:16px;bottom:10px;color:var(--dim);font-size:11px;animation:pulse 1.2s ease-in-out infinite}
#talk .tsk{position:absolute;right:12px;top:8px;font:500 11px var(--f-ui);color:var(--dim);padding:4px 8px;border-radius:6px;background:none;border:0}
#talk .tch{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-right:min(32%,230px)}
#talk .tp{position:absolute;right:calc(var(--ir) + 10px);bottom:calc(var(--ib) + 62px);width:min(calc(var(--ahp,400px)*.34),260px);height:min(calc(var(--ahp,400px)*.52),380px);display:flex;align-items:flex-end;justify-content:center;pointer-events:none;
  filter:drop-shadow(0 0 18px color-mix(in srgb,var(--pc) 40%,transparent));animation:tpin .18s ease-out}
#talk .tp svg{width:100%;height:100%;fill:var(--pc);color:var(--pc);opacity:1} #talk .tp img{max-width:100%;max-height:100%;object-fit:contain}
#talk .tp.me svg{opacity:.8}
@keyframes tpin{from{opacity:0}}
.wt .gl img.art{position:absolute;left:0;bottom:2px;width:32px;height:38px;object-fit:contain}
.wt.big .gl img.art{width:40px;height:46px}
.row img.art{width:36px;height:36px;object-fit:contain}
.u .g img.art{width:100%;height:100%;object-fit:contain}
img.icore.art{position:absolute;width:34px;height:46px;margin:-44px 0 0 -17px;object-fit:contain}
.ichest-img{position:absolute;width:30px;height:28px;margin:-26px 0 0 -15px;object-fit:contain}
.ibar{position:absolute;width:30px;height:24px;margin:-24px 0 0 -15px;background:repeating-linear-gradient(90deg,#8a84a3 0 3px,transparent 3px 8px);border-top:3px solid #8a84a3;border-bottom:3px solid #6a6482;pointer-events:none}
.ibar.broken{opacity:.35;transform:skewX(-18deg)} .ibar i{position:absolute;left:0;top:-8px;height:3px;background:var(--torch)}
.wt.boss::after{content:"♛";position:absolute;left:50%;top:-26px;transform:translateX(-50%);font-size:12px;color:var(--gold)} .wt.boss .sh{background:color-mix(in srgb,var(--gold) 45%,transparent)}
.wt.sneak{opacity:.32} .wt.sneak svg{filter:blur(.6px)}
.rows:has(>.mc){grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#drawer .rows:has(>.mc),#drawer .slots{grid-template-columns:repeat(3,minmax(0,1fr))}
.row.mc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 5px 6px;text-align:center;position:relative;min-height:0;border-top:3px solid var(--gc)}
.mc .mci{width:52px;height:52px;display:grid;place-items:center}
.mc .mci svg{width:46px;height:46px;fill:var(--mana)} .mc .mci img.art{width:52px;height:52px;object-fit:contain}
.mc.evoA .mci svg{fill:#c79bff;filter:drop-shadow(0 0 4px #ff8a6a)} .mc.evoB .mci svg{fill:#9bb8ff;filter:drop-shadow(0 0 4px #7ad0ff)} .mc.shiny .mci svg{fill:#f0cf6a}
.mc .mcg{position:absolute;left:4px;top:4px;padding:0 4px;border-radius:4px;font:800 9.5px/14px var(--f-ui);color:var(--abyss);background:var(--gc)}
.mc .mcs{position:absolute;right:5px;top:3px;font-size:9px;letter-spacing:-1px;color:var(--gold)}
.mcsh{font:700 9px/14px var(--f-ui);color:var(--abyss);background:#f0cf6a;border-radius:4px;padding:0 4px;font-style:normal}.mc .mcsh{position:absolute;left:4px;top:20px}.pc .mcsh{margin-left:6px;vertical-align:middle}
.mc .mcn{font:600 12px/1.25 var(--f-ui);color:var(--bone);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .mcl{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mc .mch{width:80%;height:3px;border-radius:2px;background:var(--abyss);overflow:hidden;margin-top:2px} .mc .mch i{display:block;height:100%;background:var(--life)}
.mc .mce{font-size:10px;color:var(--mana);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%} .mc .mce b{color:var(--gold);font-weight:600}
.row.mc.on{background:var(--mana-deep);border-color:var(--mana);border-top-color:var(--gc)}
.dpk{margin:0;font-size:12px;line-height:1.5;color:var(--dim);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--stone)} .dpk b{color:var(--bone)} .dpk .d{font-size:11px}
.gr{display:inline-block;min-width:22px;margin-right:5px;padding:0 4px;border-radius:4px;font:800 10px/15px var(--f-ui);text-align:center;color:var(--abyss);background:var(--gc);vertical-align:1px}
.wt .sr.rk{font:800 8px var(--f-ui);letter-spacing:0;color:var(--rkc,var(--bone))}
.down-b{border-color:var(--blood)!important;color:var(--bone)!important}
.iedge.build{stroke:var(--gold);stroke-dasharray:6 5;stroke-width:2}
.ibuild{position:absolute;transform:translate(-50%,-50%);padding:3px 8px 6px;border-radius:8px;background:color-mix(in srgb,var(--abyss) 75%,transparent);font:600 11px var(--f-ui);color:var(--gold);white-space:nowrap;pointer-events:none}
.ibuild i{position:absolute;left:6px;bottom:3px;height:2px;background:var(--gold);max-width:calc(100% - 12px)}
.ient{position:absolute;width:40px;height:44px;margin:-40px 0 0 -20px;cursor:pointer;pointer-events:auto}
.ient i{position:absolute;left:4px;right:4px;bottom:4px;height:18px;border-radius:50%;background:radial-gradient(closest-side,#fff3c8,var(--torch) 45%,color-mix(in srgb,var(--torch-deep) 60%,transparent) 80%,transparent);box-shadow:0 0 18px 6px color-mix(in srgb,var(--torch) 35%,transparent)}
.ient b{position:absolute;left:50%;top:0;transform:translateX(-50%);font:600 11px var(--f-ui);color:var(--torch);white-space:nowrap;text-shadow:0 1px 2px var(--abyss)}
.ideco{fill:#2a2636;opacity:.9}.ideco.b{fill:#3a3548}.ideco.g{fill:#273226}.ideco.w{fill:#4a4360}
.ihall{fill:var(--stone-2)}
.iwork{position:absolute;width:24px;height:28px;margin:-26px 0 0 -12px;pointer-events:none;color:#c9a86a;transform-origin:50% 100%;animation:dig .6s ease-in-out infinite alternate}
.iwork.b{animation-delay:.3s}
.iwork svg{width:24px;height:24px;fill:currentColor} .iwork b{position:absolute;left:50%;top:-12px;transform:translateX(-50%);font:600 9px var(--f-ui);color:var(--gold);white-space:nowrap}
@keyframes dig{from{transform:rotate(-10deg)}to{transform:rotate(8deg) translateY(-2px)}}
body.guiding button:not(.ghi):not(.gsk):not([data-a^=talk]){opacity:.32;filter:grayscale(.6)}body.guiding:not(.gfree) .iroom:not(.ghi),body.guiding .ighost:not(.ghi){opacity:.45}
#guide.fold{padding:4px 6px;left:auto;transform:none}#guide.fold .gsk{margin:0}#guide.fold{padding:0;background:transparent;border:0;box-shadow:none;top:3px;right:calc(var(--ir) + 200px);left:auto;transform:none}.gsk.gmin{width:30px;height:30px;border-radius:50%;padding:0;font:700 14px var(--f-ui);display:grid;place-items:center}
#guide{position:absolute;left:50%;top:3px;transform:translateX(-50%);z-index:22;display:flex;align-items:center;gap:8px;padding:3px 8px 3px 10px;border-radius:8px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:color-mix(in srgb,var(--abyss) 88%,transparent);border:1px solid var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 15%,transparent);pointer-events:none;font:500 13px var(--f-ui);color:var(--bone)}
#guide .gq{font:700 11px var(--f-ui);color:var(--gold);white-space:nowrap} #guide b{font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}
body.gtop #top,body.gtop #cam{top:calc(var(--it) + 20px)}body.gtop.rot #top,body.gtop.rot #cam{top:var(--it)}
#guide .gsk{pointer-events:auto;font:500 11px var(--f-ui);color:var(--dim);background:none;border:0;padding:4px 6px;white-space:nowrap}
#guide.nudge{animation:nudge .35s} @keyframes nudge{20%,60%{transform:translateX(calc(-50% - 6px))}40%,80%{transform:translateX(calc(-50% + 6px))}}
.ghi{outline:3px solid var(--gold)!important;outline-offset:2px;box-shadow:0 0 18px 4px color-mix(in srgb,var(--gold) 45%,transparent)!important;animation:ghi 1s ease-in-out infinite;position:relative;z-index:5}
rect.ghi,.ighost.ghi{stroke:var(--gold)!important;stroke-width:4!important;stroke-dasharray:none!important;outline:0}
@keyframes ghi{50%{outline-color:color-mix(in srgb,var(--gold) 40%,transparent)}}
.ilnk.out{border-color:var(--torch);color:var(--torch)}
.ichest{position:absolute;width:26px;height:18px;margin:-18px 0 0 -13px;border-radius:3px;background:linear-gradient(#7a5427,#4f3416);border:2px solid #2a1c0c;box-shadow:0 0 12px 2px color-mix(in srgb,var(--gold) 45%,transparent)}
.ichest::before{content:"";position:absolute;left:-3px;right:-3px;top:-8px;height:9px;border-radius:6px 6px 2px 2px;background:linear-gradient(#94683a,#6a4720);border:2px solid #2a1c0c}
.ichest::after{content:"";position:absolute;left:9px;top:1px;width:5px;height:6px;border-radius:1px;background:var(--gold)}
.ichest.open{box-shadow:none;filter:saturate(.4) brightness(.8)} .ichest.open::before{transform:translate(4px,-7px) rotate(-28deg)} .ichest.open::after{display:none}
.ijail{position:absolute;width:84px;height:40px;margin:-40px 0 0 -42px;border-top:3px solid #6a6482;border-bottom:3px solid #4b465e;background:repeating-linear-gradient(90deg,#6a6482 0 2.5px,transparent 2.5px 10px);opacity:.9;pointer-events:none}
.icap{position:absolute;width:24px;height:28px;margin:-27px 0 0 -12px;color:#8a8499;pointer-events:none}

.idrop{position:absolute;pointer-events:none}
.idrop.gold{width:12px;height:7px;margin:-6px 0 0 -6px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe9a0,var(--gold) 55%,#8a6a1c);box-shadow:4px -3px 0 -1px var(--gold),-3px -2px 0 -1px #c9a23c}
.idrop.soul{width:9px;height:9px;margin:-15px 0 0 -4px;border-radius:50%;background:var(--mana);box-shadow:0 0 9px 3px color-mix(in srgb,var(--mana) 65%,transparent);animation:bob 1.6s ease-in-out infinite}

.idrop.ruby{width:8px;height:8px;margin:-6px 0 0 -4px;background:var(--blood);transform:rotate(45deg)}

  background:color-mix(in srgb,var(--rock) 96%,transparent);border-right:1px solid var(--line);box-shadow:8px 0 24px color-mix(in srgb,var(--abyss) 60%,transparent);animation:slidein .22s ease-out}
