name: FX Lab 539 individual quality audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'fx-tips/**'
      - 'tests/quality-audit-539.mjs'
      - '.github/workflows/fx-lab-quality-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/fxlab-audit-server.log 2>&1 &
      - run: node tests/quality-audit-539.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fx-lab-individual-quality-539
          path: browser-artifacts/individual-quality/
          if-no-files-found: ignore
          retention-days: 7
