<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0b">
<meta name="description" content="나는 여기까지 — 무령시, 틈이 열린 날부터 스무 날. 다크 텍스트 로그라이크.">
<title>나는 여기까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0c0c0b;
  --panel: #141412;
  --panel-2: #1b1a17;
  --line: #2b2925;
  --ink: #d9d3c5;
  --bone: #efe9d8;
  --dim: #8c867a;
  --faint: #5f5b52;
  --rust: #b8573f;
  --rust-dim: #6e3527;
  --good: #8fa487;
  --warn: #c2a06a;
  --bad: #c36f5c;
  --serif: 'Noto Serif KR', 'Noto Serif CJK KR', 'Nanum Myeongjo', 'Apple SD Gothic Neo', serif;
  --sans: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0; background: #0c0c0b; background: var(--bg); color: var(--ink);
  font-family: var(--serif); font-size: 17px; line-height: 1.85; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-text-size-adjust: 100%; min-height: 100vh; min-height: 100dvh;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }

#app { max-width: 620px; margin: 0 auto; padding: 0 16px 56px; }

/* ---------------------------------------------------------------- 머리 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 0 10px; font-family: var(--sans); font-size: 13px; color: var(--dim); }
.top .when { color: var(--bone); letter-spacing: 0.02em; }
.top .when b { font-weight: 600; }
.top .tools { display: flex; gap: 6px; }
.tool { background: none; border: 1px solid var(--line); border-radius: 3px; padding: 7px 11px; font-family: var(--sans); font-size: 13px; color: var(--ink); line-height: 1.2; }
.tool:hover { border-color: var(--faint); }
.tool .n { color: var(--dim); margin-left: 4px; }
.tool.full .n { color: var(--bad); }

.vitals { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; padding: 10px 0 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-family: var(--sans); font-size: 12px; color: var(--dim); }
.vital { display: flex; align-items: center; gap: 8px; }
.vital .k { width: 2.4em; flex: none; }
.pips { display: flex; gap: 2px; flex: 1; }
.pip { height: 7px; flex: 1; background: var(--line); border-radius: 1px; }
.pip.on { background: var(--ink); }
.vital.low .pip.on { background: var(--bad); }
.vital.ero .pip.on { background: #7d6ea8; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 0; font-family: var(--sans); font-size: 12px; }
.tag { border: 1px solid var(--line); color: var(--dim); padding: 1px 8px; border-radius: 2px; }
.tag.bad { color: var(--bad); border-color: var(--rust-dim); }

/* ---------------------------------------------------------------- 글 */
.scene { padding: 22px 0 6px; animation: rise 0.35s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .scene, .sheet { animation: none !important; } }
.place { font-family: var(--sans); font-size: 12px; letter-spacing: 0.18em; color: var(--rust); margin: 0 0 10px; }
.who { font-family: var(--sans); font-size: 12px; color: var(--dim); margin: -4px 0 12px; }
.text { margin: 0 0 14px; color: var(--bone); font-size: 18px; line-height: 1.95; }
.text.small { font-size: 16px; color: var(--ink); }
.fx { list-style: none; margin: 0 0 16px; padding: 0; font-family: var(--sans); font-size: 13px; color: var(--dim); display: flex; flex-direction: column; gap: 3px; }
.fx li { padding-left: 12px; border-left: 2px solid var(--line); }
.fx .minus { color: var(--bad); border-color: var(--rust-dim); }
.fx .plus { color: var(--good); }
.fx .get { color: var(--ink); }
.fx .say { font-family: var(--serif); font-size: 14px; }

.group { font-family: var(--sans); font-size: 11px; letter-spacing: 0.2em; color: var(--faint); margin: 20px 0 8px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; text-align: left; width: 100%;
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--faint); border-radius: 2px; padding: 12px 14px; line-height: 1.5; }
.choice:hover:not(:disabled) { border-left-color: var(--rust); background: var(--panel-2); }
.choice:active:not(:disabled) { background: #22201c; }
.choice .l { display: block; color: var(--bone); }
.choice .s { display: block; font-family: var(--sans); font-size: 12.5px; color: var(--dim); margin-top: 2px; }
.choice .o { flex: none; font-family: var(--sans); font-size: 12.5px; white-space: nowrap; }
.choice:disabled { cursor: default; opacity: 0.55; border-left-color: var(--line); }
.choice.go { border-left-color: #4a4841; }
.o.o1 { color: var(--good); } .o.o2 { color: #a9aa88; } .o.o3 { color: var(--warn); } .o.o4 { color: #c88a62; } .o.o5 { color: var(--bad); }
.kbd { font-family: var(--sans); font-size: 11px; color: var(--faint); margin-right: 8px; }

/* ---------------------------------------------------------------- 첫 화면 · 사람 고르기 */
.title { padding: 16vh 0 24px; text-align: left; }
.title h1 { font-size: 40px; line-height: 1.25; font-weight: 600; color: var(--bone); margin: 0 0 14px; letter-spacing: -0.01em; }
.title h1 span { color: var(--rust); }
.title p { margin: 0 0 6px; color: var(--dim); font-size: 16px; }
.title .count { font-family: var(--sans); font-size: 12.5px; color: var(--faint); margin-top: 26px; }
.menu { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; }
.home { display: inline-block; margin-top: 34px; font-family: var(--sans); font-size: 12.5px; color: var(--faint); text-decoration: none; border-bottom: 1px solid var(--line); }
.home:hover { color: var(--dim); }

.steps { display: flex; gap: 4px; padding: 18px 0 0; }
.steps i { height: 2px; flex: 1; background: var(--line); }
.steps i.on { background: var(--rust); }
.ask { font-size: 22px; font-weight: 600; color: var(--bone); margin: 22px 0 4px; line-height: 1.5; }
.ask-sub { color: var(--dim); font-size: 15px; margin: 0 0 16px; }
.opt { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 12px 14px; line-height: 1.55; }
.opt:hover:not(:disabled) { background: var(--panel-2); }
.opt.on { border-color: var(--rust); background: #1d1512; }
.opt:disabled { opacity: 0.45; cursor: default; }
.opt b { display: block; color: var(--bone); font-weight: 600; }
.opt span { display: block; color: var(--dim); font-size: 15px; }
.opt em { display: block; font-style: normal; font-family: var(--sans); font-size: 12px; color: var(--faint); margin-top: 3px; }
.name-in { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 12px 14px; font-size: 18px; color: var(--bone); }
.name-in::placeholder { color: var(--faint); }
.nav { display: flex; gap: 8px; margin-top: 18px; }
.btn { flex: 1; background: var(--rust); border: 1px solid var(--rust); color: #14100e; font-weight: 600; border-radius: 2px; padding: 12px 14px; }
.btn:hover:not(:disabled) { background: #c96549; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.ghost { background: none; border-color: var(--line); color: var(--ink); font-weight: 400; flex: 0 0 auto; }
.btn.ghost:hover { border-color: var(--faint); background: none; }
.sum { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.sum li { display: flex; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.sum .k { flex: 0 0 4.2em; font-family: var(--sans); font-size: 12.5px; color: var(--dim); padding-top: 4px; }
.sum .v { color: var(--bone); }
.sum .v small { display: block; color: var(--dim); font-size: 14.5px; }

/* ---------------------------------------------------------------- 결말 */
.end { padding: 12vh 0 0; }
.end .kind { font-family: var(--sans); font-size: 12px; letter-spacing: 0.24em; color: var(--rust); }
.end .kind.alive { color: var(--good); }
.end h2 { font-size: 32px; font-weight: 600; color: var(--bone); margin: 8px 0 18px; line-height: 1.35; }
.end .epitaph { font-family: var(--sans); font-size: 13px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 12px; margin-top: 22px; }
.end .new { font-family: var(--sans); font-size: 12.5px; color: var(--warn); margin-top: 6px; }

/* ---------------------------------------------------------------- 가방 · 수첩 */
.veil { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 10; }
.sheet { position: fixed; z-index: 11; left: 0; right: 0; bottom: 0; top: 6vh; margin: 0 auto; max-width: 620px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 6px 6px 0 0; display: flex; flex-direction: column; animation: up 0.2s ease-out; }
@keyframes up { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); font-family: var(--sans); }
.sheet-head h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--bone); }
.sheet-head .cap { font-size: 12.5px; color: var(--dim); margin-left: 8px; font-weight: 400; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 16px 28px; flex: 1; }
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 8px 12px 0; border-bottom: 1px solid var(--line); font-family: var(--sans); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; font-size: 13.5px; color: var(--dim); }
.tab.on { color: var(--bone); border-bottom-color: var(--rust); }
.row { padding: 13px 0; border-bottom: 1px solid var(--line); }
.row h4 { margin: 0; font-size: 16.5px; font-weight: 600; color: var(--bone); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.row h4 small { font-family: var(--sans); font-weight: 400; font-size: 12px; color: var(--dim); }
.row p { margin: 3px 0 0; font-size: 15px; color: var(--ink); line-height: 1.7; }
.row .meta { font-family: var(--sans); font-size: 12px; color: var(--dim); margin-top: 5px; }
.row.unknown h4 { color: var(--faint); }
.row.unknown p { color: var(--faint); }
.row .acts { display: flex; gap: 6px; margin-top: 9px; }
.mini { background: none; border: 1px solid var(--line); border-radius: 2px; padding: 6px 12px; font-family: var(--sans); font-size: 13px; color: var(--ink); line-height: 1.3; }
.mini:hover { border-color: var(--faint); }
.mini.use { border-color: var(--rust-dim); color: var(--bone); }
.notes { list-style: none; margin: 8px 0 0; padding: 0; font-size: 15px; line-height: 1.65; }
.notes li { padding-left: 4.6em; position: relative; margin-top: 2px; }
.notes li::before { position: absolute; left: 0; top: 2px; font-family: var(--sans); font-size: 11.5px; width: 4.2em; }
.notes .like::before { content: '좋아한다'; color: var(--good); }
.notes .dislike::before { content: '싫어한다'; color: var(--bad); }
.notes .note::before { content: '알게 된 것'; color: var(--dim); }
.empty { color: var(--faint); padding: 26px 0; font-size: 15px; }
.toast { margin: 10px 0 0; padding: 9px 12px; background: var(--panel-2); border-left: 2px solid var(--rust); font-family: var(--sans); font-size: 13px; color: var(--ink); }
.sub-head { font-family: var(--sans); font-size: 11px; letter-spacing: 0.2em; color: var(--faint); margin: 18px 0 0; }
.wipe { margin: 26px 0 0; font-family: var(--sans); font-size: 12.5px; color: var(--faint); }
.wipe button { background: none; border: 0; border-bottom: 1px solid var(--line); padding: 0; color: var(--dim); font-size: 12.5px; }
.wipe button.sure { color: var(--bad); border-color: var(--rust-dim); }

@media (max-width: 380px) {
  body { font-size: 16px; }
  .text { font-size: 17px; }
  .title h1 { font-size: 34px; }
  .vitals { gap: 6px 12px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================================================
   나는 여기까지 — 바탕 자료 (사람 만들기 · 물건 · 유물 · 장소 · 사람 · 세력 · 결말)
   이 파일은 "자료"다. 규칙은 engine.js가 읽는다. 문장은 전부 '나는'의 과거형, 남이 나를 부를 때는 '당신'.
   ============================================================================================ */
const DAYS = 20;                       // 스무 날. 그 뒤는 '남은 사람'의 결말.
const PHASES = ['아침', '낮', '저녁', '밤'];
const POCKET = 6;                      // 주머니 칸(바지 넷, 겉옷 둘). 가방을 얻으면 늘어난다. 유물도 이 칸을 쓴다.

/* 숨은 능력치: 화면에 숫자로 나오지 않는다. 판정의 "될 것 같다 / 위험하다"로만 드러난다. */
const STATS = ['str', 'agi', 'con', 'luck', 'wit'];   // 힘 · 민첩 · 체력 · 운 · 지식

const AGES = [
  { id: 'a20', name: '스물 몇', line: '몸은 빨랐고, 아는 것은 적었다.', mod: { agi: 1, con: 1, wit: -1 } },
  { id: 'a30', name: '서른 몇', line: '힘은 아직 남아 있었다.', mod: { str: 1 } },
  { id: 'a40', name: '마흔 몇', line: '무릎은 예전 같지 않았고, 대신 사람을 볼 줄 알았다.', mod: { wit: 1, luck: 1, agi: -1 } },
  { id: 'a50', name: '쉰을 넘겼다', line: '빨리 걷지는 못했다. 이 동네가 어떻게 생겼는지는 알았다.', mod: { wit: 2, luck: 1, str: -1, agi: -1, con: -1 } },
];

const JOBS = [
  { id: 'carer', name: '요양보호사', line: '사람 몸을 들고 닦고 눕히는 일을 했다.', mod: { con: 1, wit: 1 }, items: ['bandage'] },
  { id: 'rider', name: '배달 기사', line: '이 도시의 골목을 번지수로 외우고 있었다.', mod: { agi: 2 }, items: ['water'] },
  { id: 'keeper', name: '고시원 총무', line: '남의 방 열쇠를 허리에 차고 사는 일이었다.', mod: { wit: 1, luck: 1 }, items: ['keys'] },
  { id: 'mechanic', name: '정비사', line: '고장 난 것을 보면 손이 먼저 나갔다.', mod: { str: 1, wit: 1 }, items: ['wrench'] },
  { id: 'nurse', name: '간호조무사', line: '피를 보고 놀라지 않는 법은 배워 두었다.', mod: { wit: 2 }, items: ['antiseptic'] },
  { id: 'loader', name: '택배 상하차', line: '밤새 상자를 던지고 받는 일이었다.', mod: { str: 2 }, items: ['tape'] },
  { id: 'clerk', name: '편의점 야간', line: '새벽 세 시에 오는 손님의 얼굴을 읽을 줄 알았다.', mod: { luck: 1, agi: 1 }, items: ['choco', 'lighter'] },
  { id: 'teacher', name: '중학교 교사', line: '서른 명을 한 번에 조용히 시키는 목소리가 있었다.', mod: { wit: 1, con: 1 }, items: ['flashlight'] },
  { id: 'jobless', name: '취업 준비생', line: '가진 것도 잃을 것도 많지 않았다.', mod: { luck: 2 }, items: ['ramen'] },
  { id: 'veteran', name: '막 전역한 사람', line: '몸은 아직 새벽 여섯 시에 눈을 떴다.', mod: { str: 1, con: 1 }, items: ['knife'] },
];

const ORIGINS = [
  { id: 'old', name: '구시가지 토박이', line: '시장 사람 절반은 내 이름을 알았다.', mod: {}, start: 'alley', rep: { market: 1 } },
  { id: 'new', name: '신도시 아파트', line: '이사 온 지 삼 년, 옆집 사람 이름은 몰랐다.', mod: {}, start: 'apt', rep: { apt: 1 } },
  { id: 'out', name: '타지에서 온 사람', line: '이 도시에 온 지 한 달이었다. 아는 길은 역에서 숙소까지뿐이었다.', mod: { luck: 1 }, start: 'station', rep: {} },
  { id: 'river', name: '강변 주택가', line: '창문을 열면 강이 보였다. 그날은 다른 것이 먼저 보였다.', mod: { wit: 1 }, start: 'river', rep: {}, ero: 1 },
];

const TEMPERS = [
  { id: 'careful', name: '조심스럽다', line: '문을 열기 전에 귀부터 대는 사람이었다.', mod: { agi: 1 }, tag: 'careful' },
  { id: 'hasty', name: '성급하다', line: '생각보다 발이 먼저 나가는 사람이었다.', mod: { str: 1, wit: -1 }, tag: 'hasty' },
  { id: 'steady', name: '무던하다', line: '웬만한 일에는 밥맛이 떨어지지 않았다.', mod: { con: 1 }, tag: 'steady' },
  { id: 'wary', name: '의심이 많다', line: '남이 주는 것은 일단 냄새부터 맡았다.', mod: { wit: 1, luck: -1 }, tag: 'wary' },
];

/* 결함: 하나는 반드시 고른다. 나에게 마이너스가 되는 것. */
const FLAWS = [
  { id: 'arm', name: '팔을 다쳤다', line: '그날 아침, 무너지는 것을 팔로 받았다. 왼팔은 어깨 위로 올라가지 않았다.', mod: { str: -2 } },
  { id: 'leg', name: '다리를 전다', line: '오래된 일이었다. 뛰면 왼쪽 무릎이 한 박자 늦었다.', mod: { agi: -2 } },
  { id: 'lung', name: '숨이 짧다', line: '흡입기는 집에 있었고, 집은 이제 없었다.', mod: { con: -2 } },
  { id: 'loss', name: '누군가를 잃었다', line: '그날 아침에 한 사람을 잃었다. 누구인지는 적지 않겠다.', mod: {}, mindMax: 8, mind: -2 },
  { id: 'eyes', name: '안경이 깨졌다', line: '세상은 두 걸음 밖에서부터 번져 보였다.', mod: { wit: -1, luck: -1 } },
  { id: 'drink', name: '술을 끊는 중이었다', line: '끊은 지 사십일 일째였다. 숫자는 매일 세고 있었다.', mod: { con: -1 }, mind: -1 },
  { id: 'debt', name: '빚이 있다', line: '시장 사람들은 내 얼굴과 내 빚을 같이 기억했다.', mod: { luck: -1 }, rep: { market: -2 } },
];

/* -------------------------------------------------------------------------------------------- 물건
   vol: 주머니·가방에서 차지하는 칸. use: 가방에서 '쓴다'를 눌렀을 때. weapon: 싸우는 판정에 더해지는 값.
   cap: 지니고 있으면 늘어나는 칸(가방). trade: 사람들이 값을 쳐 주는 물건. */
const ITEMS = {
  can:        { name: '통조림', vol: 1, kind: '먹을 것', use: { full: 4 }, text: '꽁치 통조림. 따개는 없었다. 모서리를 바닥에 갈면 열렸다.' },

    { label: '돌아서 다른 골목으로 간다',
      ok: { text: '먹을 것을 길에 세워 놓는 사람은 없었다. 세 블록을 돌아갔다. 그 골목 쪽에서 얼마 뒤 누군가의 비명이 들렸다.', fx: { mind: -1, time: 1 } } },

/* ============================================================================================
   나는 여기까지 — 규칙 (화면과 무관한 부분: 자동 플레이 검사도 이 파일을 그대로 돌린다)
   상태는 S = { run, meta }. run은 이번 판, meta는 판을 넘어 남는 것(유물 · 수첩 · 결말 · 지난 사람들).
   화면은 Game.view(S)로 지금 보여 줄 것을 받고, Game.choose(S, key)로 고른 것을 알린다.
   ============================================================================================ */
const Game = (() => {
  const rnd = () => Game.random();
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const list = v => v == null ? [] : Array.isArray(v) ? v : [v];
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  function weighted(pairs) {              // [[value, weight], ...]
    const total = pairs.reduce((s, p) => s + p[1], 0);
    let r = rnd() * total;
    for (const [v, w] of pairs) { r -= w; if (r < 0) return v; }
    return pairs.length ? pairs[pairs.length - 1][0] : null;
  }
  const HARM_END = { scraper: 'd_scraper', crawler: 'd_crawler', stander: 'd_stander', mob: 'd_mob', robbed: 'd_robbed', fall: 'd_fall',
                     fire: 'd_fire', river: 'd_river', water: 'd_water', gitae: 'd_gitae', apt: 'd_apt', cold: 'd_cold', wound: 'd_wound', hunger: 'd_hunger' };
  const VITAL = { hp: '몸', full: '배', mind: '정신', ero: '침식' };

  /* ------------------------------------------------------------------------------------------ 남는 것 */
  function newMeta() {
    return { v: 1, runs: 0, relics: Object.keys(RELICS).filter(k => RELICS[k].base), endings: {}, people: {}, facs: {}, items: {}, things: {},
             places: {}, graves: [] };
  }
  function fixMeta(meta) {                 // 저장된 것이 옛 모양이어도 돌아가게
    const base = newMeta();
    for (const k of Object.keys(base)) if (meta[k] == null) meta[k] = base[k];
    for (const r of base.relics) if (!meta.relics.includes(r)) meta.relics.push(r);
    meta.relics = meta.relics.filter(r => RELICS[r]);
    return meta;
  }

  /* ------------------------------------------------------------------------------------------ 사람 만들기 */
  function statsFor(sel) {
    const s = { str: 4, agi: 4, con: 4, luck: 4, wit: 4 };
    for (const [table, id] of [[AGES, sel.age], [JOBS, sel.job], [ORIGINS, sel.origin], [TEMPERS, sel.temper], [FLAWS, sel.flaw]]) {
      const row = table.find(r => r.id === id);
      for (const [k, v] of Object.entries((row && row.mod) || {})) s[k] += v;
    }
    for (const k of STATS) s[k] = clamp(s[k], 1, 9);
    return s;
  }
  function startVolume(sel) {              // 직업 물건이 이미 차지한 칸
    const job = JOBS.find(j => j.id === sel.job);
    return (job ? job.items : []).reduce((n, i) => n + ITEMS[i].vol, 0);
  }
  function newRun(sel, meta) {
    const job = JOBS.find(j => j.id === sel.job), origin = ORIGINS.find(o => o.id === sel.origin), flaw = FLAWS.find(f => f.id === sel.flaw);
    const stats = statsFor(sel);
    const mindMax = flaw.mindMax || 10;
    const run = {
      name: (sel.name || '').trim().slice(0, 12) || '이름 없는 사람', age: sel.age, job: sel.job, origin: sel.origin, temper: sel.temper, flaw: sel.flaw,
      stats, hp: clamp(6 + Math.round(stats.con / 2), 1, 10), mind: clamp(8 + (flaw.mind || 0), 1, mindMax), mindMax, full: 6, ero: origin.ero || 0,
      day: 1, phase: 1, place: origin.start, flags: {}, rep: { market: 0, church: 0, apt: 0 }, rel: {}, met: {}, inv: job.items.slice(),
      relics: list(sel.relics).filter(r => meta.relics.includes(r)), seen: {}, searched: {}, visited: {}, lastHarm: '', daily: {}, ending: '',
      steps: 0, learned: 0, scene: { t: 'prologue', i: 0 },
    };
    for (const src of [origin.rep, flaw.rep]) for (const [f, v] of Object.entries(src || {})) run.rep[f] += v;
    if (has(run, 'ledger', true)) run.rep.market += 2;
    if (has(run, 'rosary', true)) run.rep.church += 2;
    if (has(run, 'denture', true)) run.stats.luck = clamp(run.stats.luck + 1, 1, 9);
    for (const i of run.inv) meta.items[i] = true;
    meta.runs += 1;
    run.no = meta.runs;
    return run;
  }

  /* ------------------------------------------------------------------------------------------ 가방 */
  function has(run, id, relic) { return relic ? run.relics.includes(id) : run.inv.includes(id); }
  function capacity(run) { return POCKET + Math.max(0, ...run.inv.map(i => ITEMS[i].cap || 0)); }
  function load(run) { return run.inv.reduce((n, i) => n + ITEMS[i].vol, 0) + run.relics.reduce((n, r) => n + RELICS[r].vol, 0); }
  function weaponOf(run) { return Math.max(0, ...run.inv.map(i => ITEMS[i].weapon || 0)); }
  function drop(run, id) { const k = run.inv.indexOf(id); if (k >= 0) run.inv.splice(k, 1); return k >= 0; }
  function give(S, id) { S.run.inv.push(id); S.meta.items[id] = true; }

  /* ------------------------------------------------------------------------------------------ 조건 */
  function meets(S, req) {
    const run = S.run;
    if (!req) return true;
    for (const f of list(req.flag)) if (!run.flags[f]) return false;
    for (const f of list(req.notFlag)) if (run.flags[f]) return false;
    for (const i of list(req.item)) if (!has(run, i)) return false;
    for (const i of list(req.notItem)) if (has(run, i)) return false;
    for (const k of ['job', 'flaw', 'origin', 'temper']) if (req[k] && !list(req[k]).includes(run[k])) return false;
    for (const [f, v] of Object.entries(req.repMin || {})) if ((run.rep[f] || 0) < v) return false;
    for (const [f, v] of Object.entries(req.repMax || {})) if ((run.rep[f] || 0) > v) return false;
    for (const [p, v] of Object.entries(req.relMin || {})) if ((run.rel[p] || 0) < v) return false;
    for (const [p, v] of Object.entries(req.relMax || {})) if ((run.rel[p] || 0) > v) return false;
    if (req.eroMin != null && run.ero < req.eroMin) return false;
    if (req.eroMax != null && run.ero > req.eroMax) return false;
    for (const p of list(req.met)) if (!run.met[p]) return false;
    for (const p of list(req.notMet)) if (run.met[p]) return false;
    if (req.relic && !has(run, req.relic, true)) return false;
    return true;
  }
  function lockReason(S, req) {            // 흐리게 보이는 선택지 옆에 적히는 말: 물건이 모자랄 때만 무엇인지 알려 준다
    const missing = list((req || {}).item).filter(i => !has(S.run, i));
    if (missing.length) return ITEMS[missing[0]].name + '이(가) 있어야 한다';
    return '지금은 할 수 없다';
  }
  function eventOpen(S, ev, on) {
    const run = S.run;
    if (ev.on !== on) return false;
    if (ev.where !== 'any' && !ev.where.includes(run.place)) return false;
    if (ev.once !== false && run.seen[ev.id]) return false;
    const w = ev.when || {};
    if (w.dayMin != null && run.day < w.dayMin) return false;
    if (w.dayMax != null && run.day > w.dayMax) return false;
    if (w.phase && !list(w.phase).includes(PHASES[run.phase])) return false;
    return meets(S, ev.req);
  }
  const candidates = (S, on) => EVENTS.filter(ev => eventOpen(S, ev, on));
  const eventById = id => EVENTS.find(e => e.id === id);

  /* ------------------------------------------------------------------------------------------ 판정
     능력치는 보이지 않는다. 플레이어가 보는 것은 "될 것 같다 … 거의 안 된다"뿐이다. */
  function chance(S, check) {
    const run = S.run;
    if (!check) return 1;
    let s = run.stats[check.stat] || 4;
    if (check.weapon) s += weaponOf(run) + (run.temper === 'hasty' ? 1 : 0);
    if (check.flee && has(run, 'whistle', true)) s += 1.5;
    if (check.hide && run.temper === 'careful') s += 1;
    if (check.lock) s += (has(run, 'halfkey', true) ? 2 : 0) + (has(run, 'keys') ? 1 : 0);
    if (check.talk) s += (has(run, 'bell', true) ? 1 : 0) - (run.temper === 'hasty' ? 1 : 0);
    if (check.npc) s += (run.rel[check.npc] || 0) * 0.5;
    if (check.fac) s += (run.rep[check.fac] || 0) * 0.5;
    if (run.phase === 3 && check.stat !== 'luck' && !has(run, 'matches', true) && !run.inv.some(i => ITEMS[i].light)) s -= 1;
    if (run.full <= 1) s -= 1;                                   // 굶은 몸은 말을 듣지 않는다
    return clamp(0.5 + 0.09 * (s - check.dc) + 0.02 * (run.stats.luck - 4), 0.07, 0.95);
  }
  function oddsWord(p) { return p >= 0.8 ? '될 것 같다' : p >= 0.62 ? '해볼 만하다' : p >= 0.42 ? '반반이다' : p >= 0.25 ? '위험하다' : '거의 안 된다'; }

  /* ------------------------------------------------------------------------------------------ 결과 적용 */
  function note(S, who, kind, line) {      // 수첩에 한 줄. 이미 적힌 줄은 다시 적지 않는다.
    const book = who.fac ? (S.meta.facs[who.fac] = S.meta.facs[who.fac] || { notes: [] }) : person(S, who.who);
    const key = who.fac ? 'notes' : kind === 'like' ? 'likes' : kind === 'dislike' ? 'dislikes' : 'notes';
    if (!book[key].includes(line)) { book[key].push(line); S.run.learned += 1; return true; }
    return false;
  }
  function person(S, id) {
    return S.meta.people[id] = S.meta.people[id] || { first: null, n: 0, likes: [], dislikes: [], notes: [] };
  }
  function meet(S, id) {
    const p = person(S, id);
    if (!S.run.met[id]) { S.run.met[id] = S.run.day; p.n += 1; if (!p.first) p.first = { run: S.run.no, day: S.run.day }; }
  }
  function change(S, key, by, out) {       // 몸 · 배 · 정신 · 침식. 유물이 덜어 주는 것은 여기서.
    const run = S.run;
    if (!by) return;
    if (key === 'mind' && by < 0 && has(run, 'dogtag', true) && !run.daily.dogtag) { run.daily.dogtag = 1; by += 1; out.push('군번줄을 쥐었다. 한 칸은 버텼다.'); }
    if (key === 'hp' && by < 0 && has(run, 'helmet', true) && !run.daily.helmet) { run.daily.helmet = 1; by += 1; out.push('헬멧에 금이 하나 더 갔다. 머리는 멀쩡했다.'); }
    if (!by) return;
    const max = key === 'mind' ? run.mindMax : 10, before = run[key];
    run[key] = clamp(run[key] + by, 0, max);
    const d = run[key] - before;
    if (d) out.push({ vital: key, d });
  }
  function apply(S, fx, out) {
    const run = S.run;
    fx = fx || {};
    if (fx.harm) run.lastHarm = fx.harm;
    for (const k of ['hp', 'mind', 'full', 'ero']) change(S, k, fx[k], out);
    for (const id of list(fx.lose)) if (drop(run, id)) out.push({ lost: id });
    for (const id of list(fx.items)) { give(S, id); out.push({ got: id }); }
    for (const f of list(fx.flags)) run.flags[f] = 1;
    for (const f of list(fx.unflag)) delete run.flags[f];
    for (const [f, v] of Object.entries(fx.rep || {})) { run.rep[f] = clamp((run.rep[f] || 0) + v, -6, 8); S.meta.facs[f] = S.meta.facs[f] || { notes: [] }; }
    for (const [p, v] of Object.entries(fx.rel || {})) { run.rel[p] = clamp((run.rel[p] || 0) + v, -6, 8); meet(S, p); }
    for (const l of list(fx.learn)) {
      const kind = l.like ? 'like' : l.dislike ? 'dislike' : 'note';
      if (l.who) meet(S, l.who);
      if (note(S, l, kind, l.like || l.dislike || l.note)) out.push({ learned: l.who ? PEOPLE[l.who].name : FACTIONS[l.fac].name });
    }
    if (fx.relic && !S.meta.relics.includes(fx.relic)) { S.meta.relics.push(fx.relic); out.push({ relic: fx.relic }); }
    if (fx.infect) run.flags.infected = 1;
    if (fx.cure) delete run.flags.infected;
    if (fx.goto) { run.place = fx.goto; arriveMark(S); }
    if (fx.time) pass(S, fx.time, out);
    if (fx.end && !run.ending) run.ending = fx.end;
    verdict(S);
  }
  function verdict(S) {                    // 죽었는가, 무너졌는가, 변했는가
    const run = S.run;
    if (run.ending) return;
    if (run.hp <= 0) run.ending = HARM_END[run.lastHarm] || 'd_wound';
    else if (run.mind <= 0) run.ending = run.flaw === 'loss' ? 'm_loss' : (run.flaw === 'drink' && run.flags.drank) ? 'm_count' : run.phase === 3 ? 'm_night' : 'm_door';
    else if (run.ero >= 10) run.ending = run.place === 'cross' ? 'e_rift' : 'e_mirror';
  }
  function lastDay(S) {                    // 스무 날을 넘긴 사람의 결말
    const run = S.run, f = run.flags;
    const order = [['carehome_keeper', 'a_carehome'], ['hospital_staff', 'a_hospital'], ['church_member', 'a_church'], ['market_member', 'a_market'],
                   ['apt_member', 'a_apt'], ['with_radio', 'a_radio']];
    for (const [flag, end] of order) if (f[flag]) return end;
    if (run.ero >= 6) return 'a_changed';
    if (Object.values(run.rep).every(v => v <= -2)) return 'a_nobody';
    return 'a_alone';
  }

  /* ------------------------------------------------------------------------------------------ 시간 */
  function pass(S, steps, out) {
    const run = S.run;
    for (let i = 0; i < steps && !run.ending; i++) {
      run.phase += 1;
      if (run.phase > 3) {               // 자지 않고 밤을 넘겼다
        newDay(S, out, false);
      }
      if (run.phase === 1 || run.phase === 3) hunger(S, out);
      verdict(S);
    }
  }
  function hunger(S, out) {
    const run = S.run;
    if (run.full > 0) change(S, 'full', -1, out);
    else { run.lastHarm = 'hunger'; change(S, 'hp', -1, out); out.push('먹은 것이 없었다. 몸이 대신 줄었다.'); }
  }
  function newDay(S, out, slept) {
    const run = S.run;
    run.day += 1; run.phase = 0; run.daily = {};
    if (!slept) { change(S, 'mind', -1, out); out.push('밤을 새웠다.'); }
    if (run.flags.infected) { run.lastHarm = 'wound'; change(S, 'hp', -1, out); out.push('상처에서 열이 났다.'); }
    if (has(run, 'photo', true) && run.mind < 5) { change(S, 'mind', 1, out); out.push('사진 속의 모르는 얼굴들을 한참 봤다.'); }
    if (run.day > DAYS && !run.ending) { verdict(S); if (!run.ending) run.ending = lastDay(S); }
  }
  function arriveMark(S) { const run = S.run; run.visited[run.place] = (run.visited[run.place] || 0) + 1; S.meta.places[run.place] = true; }

  /* ------------------------------------------------------------------------------------------ 장면 */
  function fire(S, ev) {
    const run = S.run;
    run.seen[ev.id] = (run.seen[ev.id] || 0) + 1;
    if (ev.npc) meet(S, ev.npc);
    if (ev.thing) S.meta.things[ev.thing] = (S.meta.things[ev.thing] || 0) + 1;
    run.scene = { t: 'event', id: ev.id };
  }
  function draw(S, on, base) {             // 그 자리에서 일이 벌어지는가. weight 3 이상은 "꼭 겪어야 할 일"이라 거의 반드시.
    const found = candidates(S, on);
    if (!found.length) return null;
    const gated = e => { const r = e.req || {}; return !!(r.flag || r.relMin || r.repMin || r.repMax); };   // 내가 쌓은 것이 불러온 일은 놓치지 않게
    const must = found.filter(e => (e.weight || 1) >= 3 || gated(e));
    if (must.length && rnd() < 0.85) return weighted(must.map(e => [e, e.weight || 1]));
    if (rnd() >= base) return null;
    return weighted(found.map(e => [e, e.weight || 1]));
  }
  function toHub(S, line) { S.run.scene = { t: 'hub', line: line || '' }; }
  function result(S, text, out, then) {
    if (!text && S.run.ending) { finish(S); return; }          // 결말의 글이 결과를 대신한다
    S.run.scene = { t: 'result', text: text || '', out: out || [], then: then || { t: 'hub' } };
  }
  function settle(S, then) {               // 결과를 본 뒤: 끝났는가 → 주머니가 넘쳤는가 → 다음 장면
    const run = S.run;
    if (run.ending) { finish(S); return; }
    if (load(run) > capacity(run)) { run.scene = { t: 'overflow', then: then || { t: 'hub' } }; return; }
    if (then && then.t === 'event') { fire(S, eventById(then.id)); return; }
    toHub(S, then && then.line);
  }
  function finish(S) {
    const run = S.run, meta = S.meta, end = ENDINGS[run.ending];
    if (run.scene.t === 'ending') return;
    const first = !meta.endings[run.ending];
    meta.endings[run.ending] = meta.endings[run.ending] || { n: 0, first: run.no };
    meta.endings[run.ending].n += 1;
    let relic = '';
    if (end.relic && !meta.relics.includes(end.relic)) { meta.relics.push(end.relic); relic = end.relic; }
    meta.graves.unshift({ name: run.name, job: JOBS.find(j => j.id === run.job).name, day: Math.min(run.day, DAYS), end: run.ending, alive: end.kind === 'alive' });
    meta.graves = meta.graves.slice(0, 60);
    run.scene = { t: 'ending', id: run.ending, first, relic, learned: run.learned };
  }

  const SEARCH_FOUND = ['서랍과 선반을 하나씩 열었다. {items}이(가) 나왔다.', '남들이 지나친 자리를 다시 뒤졌다. {items}을(를) 찾았다.',
                        '바닥에 엎드려 가구 밑을 훑었다. 손끝에 {items}이(가) 닿았다.', '쓰러진 것들을 하나씩 일으켜 세웠다. 그 밑에 {items}이(가) 있었다.'];
  const SEARCH_NONE = ['뒤질 만한 곳은 다 뒤졌다. 남은 것은 먼지와 남의 영수증뿐이었다.', '누군가 먼저 다녀간 자리였다. 서랍은 전부 열려 있었고, 전부 비어 있었다.'];
  const QUIET_NIGHT = ['문을 등지고 앉아 밤을 보냈다. 몇 번 깼고, 깰 때마다 같은 자리였다.', '옷을 전부 껴입고 누웠다. 새벽에 한 번 무슨 소리가 났다. 다시 나지는 않았다.',
                       '눈을 감았다 뜨니 창이 밝아 있었다. 꿈은 꾸지 않았다. 그것으로 충분했다.'];
  const REST = ['벽에 기대앉아 숨을 골랐다. 손이 떨리는 것은 조금 뒤에 멎었다.', '신발을 벗고 발을 주물렀다. 다시 신는 데 한참이 걸렸다.'];

  function move(S, to) {
    const run = S.run, out = [];
    pass(S, 1, out);
    if (run.ending) { result(S, '', out); return; }
    run.place = to; arriveMark(S);
    const danger = PLACES[to].danger + (run.phase === 3 ? 0.12 : 0) - (run.job === 'rider' ? 0.08 : 0);
    const ev = draw(S, 'arrive', danger);
    if (ev) fire(S, ev); else toHub(S, '');
    run.scene.pre = out;
  }
  function search(S) {
    const run = S.run, place = PLACES[run.place], out = [];
    pass(S, 1, out);
    if (run.ending) { result(S, '', out); return; }
    const ev = draw(S, 'search', 0.35);
    run.searched[run.place] = (run.searched[run.place] || 0) + 1;
    if (ev) { fire(S, ev); run.scene.pre = out; return; }
    const luck = run.stats.luck + (run.stats.wit - 4) * 0.5;
    let n = rnd() < 0.08 - (luck - 4) * 0.02 ? 0 : 1;
    if (n && rnd() < 0.4 + (luck - 4) * 0.05) n += 1;
    if (n && has(run, 'loupe', true) && rnd() < 0.5) n += 1;
    const got = [];
    for (let i = 0; i < n; i++) got.push(weighted(Object.entries(place.loot)));
    for (const id of got) { give(S, id); out.push({ got: id }); }
    const names = got.map(id => ITEMS[id].name).join(', ');
    result(S, got.length ? pick(SEARCH_FOUND).replace('{items}', names) : pick(SEARCH_NONE), out);
  }
  function rest(S) {
    const out = [];
    change(S, 'mind', S.run.full >= 3 ? 1 : 0, out);
    pass(S, 1, out);
    result(S, pick(REST), out);
  }
  function sleep(S) {
    const run = S.run, place = PLACES[run.place], out = [];
    const safe = clamp(place.safe + (run.flags.depot_shutter && run.place === 'depot' ? 0.3 : 0), 0, 0.95);
    if (run.phase < 3) { run.phase = 3; hunger(S, out); verdict(S); if (run.ending) { result(S, '', out); return; } }
    const ev = draw(S, 'night', 1 - safe);
    if (ev) { fire(S, ev); run.scene.night = 1; return; }
    morning(S, out, safe);
    result(S, pick(QUIET_NIGHT), out);
  }
  function morning(S, out, safe) {         // 잠을 잔 밤의 끝
    const run = S.run;
    if (run.full >= 3) change(S, 'hp', 1, out);
    if (safe >= 0.4) change(S, 'mind', 1, out);
    else if (safe < 0.25 && run.hp <= 3) { run.lastHarm = 'cold'; change(S, 'hp', -1, out); out.push('한뎃잠이었다. 새벽에 이가 부딪쳤다.'); }
    newDay(S, out, true);
    verdict(S);
  }

  /* ------------------------------------------------------------------------------------------ 고르기 */
  function resolveChoice(S, ev, c) {
    const run = S.run, out = [];
    const wasNight = run.scene.night;
    if (c.use) { drop(run, c.use); out.push({ lost: c.use }); }
    let ok = true;
    if (c.check) {
      const p = chance(S, c.check);
      ok = rnd() < p;
      if (!ok && has(run, 'watch', true) && !run.daily.watch) {
        run.daily.watch = 1;
        if (rnd() < p) { ok = true; out.push('멈춘 손목시계의 초침이 한 칸 움직였다. 한 번 더 해 봤다.'); }
      }
    }
    const res = ok ? c.ok : c.bad;
    if (ev.on === 'hub') pass(S, 1, out);                        // 그곳에서 한 일은 한나절이 든다
    apply(S, res.fx, out);
    if (wasNight && !run.ending && !(res.fx && res.fx.next)) morning(S, out, 0.3);   // 일이 있었던 밤: 쉬지는 못했다
    const next = res.fx && res.fx.next;
    result(S, res.text, out, next ? { t: 'event', id: next, night: wasNight } : { t: 'hub' });
  }

  function useItem(S, id) {
    const run = S.run, item = ITEMS[id], out = [];
    if (!item || !item.use || !has(run, id) || run.ending) return null;
    drop(run, id);
    const u = item.use;
    let hp = u.hp || 0;
    if (id === 'bandage' && (run.job === 'nurse' || run.job === 'carer')) hp += 1;
    change(S, 'hp', hp, out); change(S, 'full', u.full || 0, out); change(S, 'mind', u.mind || 0, out);
    if (u.stone) { change(S, 'ero', has(run, 'nail', true) ? 1 : (u.ero || 0), out); run.flags.ate_stone = 1; }
    if (u.cure && run.flags.infected) { delete run.flags.infected; out.push('상처의 열이 내렸다.'); }
    if (id === 'soju' && run.flaw === 'drink') { run.flags.drank = 1; out.push('세던 숫자가 영으로 돌아갔다.'); }
    if (hp < 0) run.lastHarm = 'wound';
    verdict(S);
    if (run.ending) finish(S);
    return out;
  }
  function leave(S, id) { return drop(S.run, id); }
  function recheck(S) {                    // 가방에서 먹거나 버려서 자리가 났으면, 무엇을 두고 갈지 묻던 장면을 넘긴다
    const sc = S.run.scene;
    if (sc.t === 'overflow' && load(S.run) <= capacity(S.run)) settle(S, sc.then);
  }

  /* ------------------------------------------------------------------------------------------ 화면이 읽는 것 */
  function hubChoices(S) {
    const run = S.run, place = PLACES[run.place], out = [];
    for (const ev of candidates(S, 'hub')) out.push({ key: 'ev:' + ev.id, label: ev.label, kind: 'act' });
    place.exits.forEach((e, i) => out.push({ key: 'go:' + e.to, label: e.dir, sub: (S.meta.places[e.to] ? PLACES[e.to].name + ' · ' : '') + e.hint, kind: 'go' }));
    const left = place.searches - (run.searched[run.place] || 0);
    if (left > 0) out.push({ key: 'search', label: '이곳을 뒤진다', sub: left >= 3 ? '손대지 않은 곳이 많았다.' : left === 2 ? '아직 뒤질 곳이 남아 있었다.' : '남은 곳은 한 군데쯤이었다.', kind: 'do' });
    if (run.phase >= 2) out.push({ key: 'sleep', label: '여기서 밤을 보낸다', sub: place.safe >= 0.6 ? '눈을 붙일 만했다.' : place.safe >= 0.35 ? '깊이 잘 곳은 아니었다.' : '잘 곳이 못 됐다.', kind: 'do' });
    else out.push({ key: 'rest', label: '잠깐 쉰다', sub: '한나절이 간다.', kind: 'do' });
    return out;
  }
  function view(S) {
    const run = S.run, sc = run.scene;
    if (sc.t === 'prologue') {
      const pages = PROLOGUE.common.concat([PROLOGUE.origin[run.origin], FLAWS.find(f => f.id === run.flaw).line + ' ' + PROLOGUE.last]);
      return { t: 'prologue', text: pages[sc.i], choices: [{ key: 'next', label: sc.i < pages.length - 1 ? '…' : '걷기 시작한다' }], last: sc.i >= pages.length - 1 };
    }
    if (sc.t === 'hub') {
      const place = PLACES[run.place];
      const text = run.phase === 3 ? place.night : place.text[((run.visited[run.place] || 1) - 1) % place.text.length];
      return { t: 'hub', title: place.name, text, line: sc.line, pre: sc.pre || [], choices: hubChoices(S) };
    }
    if (sc.t === 'event') {
      const ev = eventById(sc.id);
      const choices = [];
      ev.choices.forEach((c, i) => {
        const open = meets(S, c.req);
        if (!open && c.hideIfLocked) return;
        const p = c.check ? chance(S, c.check) : null;
        choices.push({ key: 'c:' + i, label: c.label, locked: !open, reason: open ? '' : lockReason(S, c.req), odds: open && p != null ? oddsWord(p) : '', p,
                       uses: c.use ? ITEMS[c.use].name : '' });
      });
      if (!choices.some(c => !c.locked)) choices.push({ key: 'away', label: '물러난다' });
      return { t: 'event', title: PLACES[run.place].name, text: ev.text, pre: sc.pre || [], choices, who: ev.npc ? PEOPLE[ev.npc] : null };
    }
    if (sc.t === 'result') return { t: 'result', text: sc.text, out: sc.out, choices: [{ key: 'next', label: run.ending ? '…' : '계속' }] };
    if (sc.t === 'overflow') return { t: 'overflow', text: '주머니가 찼다. 무엇을 두고 갈지 골라야 했다.', over: load(run) - capacity(run),
                                      choices: run.inv.filter(i => ITEMS[i].vol > 0).map((i, k) => ({ key: 'leave:' + k, label: ITEMS[i].name + '을(를) 두고 간다', sub: ITEMS[i].vol + '칸' })) };
    if (sc.t === 'ending') {
      const end = ENDINGS[sc.id];
      return { t: 'ending', end, id: sc.id, first: sc.first, relic: sc.relic, learned: sc.learned, epitaph: `${Math.min(run.day, DAYS)}일째. ${run.name}. ${JOBS.find(j => j.id === run.job).name}.`,
               choices: [{ key: 'again', label: '다른 사람으로 다시' }] };
    }
    return { t: 'none', choices: [] };
  }
  function choose(S, key) {
    const run = S.run, sc = run.scene;
    run.steps += 1;
    if (sc.t === 'prologue') {
      const pages = PROLOGUE.common.length + 2;
      if (sc.i < pages - 1) sc.i += 1; else { arriveMark(S); toHub(S, ''); }
      return;
    }
    if (sc.t === 'hub') {
      if (key.startsWith('go:')) return move(S, key.slice(3));
      if (key === 'search') return search(S);
      if (key === 'sleep') return sleep(S);
      if (key === 'rest') return rest(S);
      if (key.startsWith('ev:')) return fire(S, eventById(key.slice(3)));
      return;
    }
    if (sc.t === 'event') {
      const ev = eventById(sc.id);
      if (key === 'away') { const night = sc.night, out = []; if (night) morning(S, out, 0.3); return result(S, '할 수 있는 일이 없었다. 물러났다.', out); }
      return resolveChoice(S, ev, ev.choices[+key.slice(2)]);
    }
    if (sc.t === 'result') {
      const then = sc.then;
      if (then && then.t === 'event' && !run.ending && load(run) <= capacity(run)) { fire(S, eventById(then.id)); if (then.night) run.scene.night = 1; return; }
      return settle(S, then);
    }
    if (sc.t === 'overflow') {
      const items = run.inv.filter(i => ITEMS[i].vol > 0);
      drop(run, items[+key.slice(6)]);
      if (load(run) <= capacity(run)) settle(S, sc.then);
      return;
    }
  }

  return { random: Math.random, newMeta, fixMeta, newRun, statsFor, startVolume, view, choose, useItem, leave, recheck, capacity, load, chance, oddsWord, has, VITAL, lastDay, candidates };
})();

      const room = relicRoom(), used = relicUsed();
      body = `<h2 class="ask">주머니에 무엇을 넣고 나섰나.</h2>
        <p class="ask-sub">먼저 간 사람들이 남긴 것. 한 번 얻은 것은 다음 사람도 들고 갈 수 있다. 셋까지, 주머니 칸 안에서. 넣은 만큼 주울 자리는 준다. (${used}/${room}칸)</p><div class="choices">` +
        S.meta.relics.map(id => {
          const r = RELICS[id], on = sel.relics.includes(id);
          const blocked = !on && (sel.relics.length >= 3 || used + r.vol > room);
          return `<button class="opt${on ? ' on' : ''}" data-act="relic" data-id="${id}" ${blocked ? 'disabled' : ''}><b>${esc(r.name)}</b><span>${esc(r.text)}</span><em>${esc(r.fx)} · ${r.vol}칸</em></button>`;
        }).join('') + '</div>';
    } else {
      const job = byId(JOBS, sel.job), origin = byId(ORIGINS, sel.origin);
      const row = (k, name, line) => `<li><span class="k">${k}</span><span class="v">${esc(name)}<small>${esc(line)}</small></span></li>`;
      body = `<h2 class="ask">${sel.name.trim() ? esc(sel.name.trim()) + '.' : '이름 없는 사람.'}</h2><p class="ask-sub">이 사람으로 걷는다. 끝나면 돌아오지 않는다.</p><ul class="sum">` +
        row('나이', byId(AGES, sel.age).name, byId(AGES, sel.age).line) + row('하던 일', job.name, job.line) + row('살던 곳', origin.name, origin.line) +
        row('성격', byId(TEMPERS, sel.temper).name, byId(TEMPERS, sel.temper).line) + row('결함', byId(FLAWS, sel.flaw).name, byId(FLAWS, sel.flaw).line) +
        row('주머니', job.items.map(i => ITEMS[i].name).concat(sel.relics.map(r => RELICS[r].name)).join(', '), `여섯 칸 중 ${Game.startVolume(sel) + relicUsed()}칸이 찼다.`) + '</ul>';
    }
    const last = ui.step === STEPS.length - 1;
    return `<div class="steps">${STEPS.map((s, i) => `<i class="${i <= ui.step ? 'on' : ''}"></i>`).join('')}</div>
      <div class="scene">${body}
        <div class="nav">
          <button class="btn ghost" data-act="back">${ui.step === 0 ? '처음으로' : '앞으로'}</button>
          ${ui.step === 0 ? '<button class="btn ghost" data-act="anyone">아무나</button>' : ''}
          <button class="btn" data-act="${last ? 'begin' : 'fwd'}" ${stepDone(st) ? '' : 'disabled'}>${last ? '걷기 시작한다' : '다음'}</button>
        </div>
      </div>`;
  }
  function trimRelics() {                              // 직업을 바꿔 주머니가 줄었으면 넘치는 유물을 뺀다
    while (relicUsed() > relicRoom() && ui.sel.relics.length) ui.sel.relics.pop();
  }

  /* ------------------------------------------------------------------------------------------ 걷는 화면 */
  function gameScreen() {
    const v = Game.view(S), run = S.run;
    if (v.t === 'ending') return endScreen(v);
    let h = header() + '<div class="scene">';
    if (v.t === 'prologue') {
      h += `<p class="place">그날</p><p class="text">${T(v.text)}</p><div class="choices">${v.choices.map((c, i) => choiceBtn(c, i)).join('')}</div>`;
    } else if (v.t === 'hub') {
      const act = v.choices.filter(c => c.kind !== 'go'), go = v.choices.filter(c => c.kind === 'go');
      h += `<p class="place">${esc(v.title)}</p>${fxLines(v.pre)}<p class="text">${T(v.text)}</p>`;
      h += `<p class="group">여기서</p><div class="choices">${act.map((c, i) => choiceBtn(c, i)).join('')}</div>`;
      h += `<p class="group">가는 길</p><div class="choices">${go.map((c, i) => choiceBtn(c, act.length + i, 'go')).join('')}</div>`;
    } else if (v.t === 'event') {
      h += `<p class="place">${esc(v.title)}</p>${v.who && run.met[Object.keys(PEOPLE).find(k => PEOPLE[k] === v.who)] ? `<p class="who">${esc(v.who.name)} · ${esc(v.who.role)}</p>` : ''}
        ${fxLines(v.pre)}<p class="text">${T(v.text)}</p><div class="choices">${v.choices.map((c, i) => choiceBtn(c, i)).join('')}</div>`;
    } else if (v.t === 'result') {
      h += `<p class="text">${T(v.text)}</p>${fxLines(v.out)}<div class="choices">${v.choices.map((c, i) => choiceBtn(c, i)).join('')}</div>`;
    } else if (v.t === 'overflow') {
      h += `<p class="place">주머니</p><p class="text">${T(v.text)}</p><p class="text small">${v.over}칸이 넘쳤다. 가방을 열어 먹거나 써서 자리를 내도 됐다.</p>
        <div class="choices">${v.choices.map((c, i) => choiceBtn(c, i)).join('')}</div>`;
    }
    return h + '</div>';
  }
  function endScreen(v) {
    const alive = v.end.kind === 'alive';
    return `<div class="end scene">
      <div class="kind${alive ? ' alive' : ''}">${alive ? '살아남았다' : '여기까지'}</div>
      <h2>${esc(v.end.title)}</h2>
      <p class="text">${T(v.end.text)}</p>
      <div class="epitaph">${esc(v.epitaph)}
        ${v.first ? '<div class="new">처음 본 결말. 수첩에 적혔다.</div>' : ''}
        ${v.relic ? `<div class="new">유물을 남겼다 · ${esc(RELICS[v.relic].name)}</div>` : ''}
        ${v.learned ? `<div>이 사람이 수첩에 남긴 줄 · ${v.learned}</div>` : ''}
      </div>
      <div class="menu">
        <button class="choice" data-act="again"><span class="l">다른 사람으로 다시</span></button>
        <button class="choice go" data-act="open" data-what="book"><span class="l">수첩을 편다</span></button>
        <button class="choice go" data-act="title"><span class="l">처음 화면으로</span></button>
      </div>
    </div>`;
  }

  /* ------------------------------------------------------------------------------------------ 가방 */
  function useHint(id) {
    const u = ITEMS[id].use;
    if (!u) return '';
    const parts = [];
    if (u.full) parts.push('배 +' + u.full);
    if (u.hp) parts.push('몸 ' + (u.hp > 0 ? '+' : '−') + Math.abs(u.hp));
    if (u.mind) parts.push('정신 +' + u.mind);
    if (u.ero) parts.push('침식 +' + u.ero);
    if (u.cure) parts.push('곪은 상처를 잡는다');
    return parts.join(' · ');
  }
  function bagSheet() {
    const run = S.run, counts = {};
    for (const i of run.inv) counts[i] = (counts[i] || 0) + 1;
    const live = run.scene.t !== 'ending';
    const items = Object.keys(counts).map(id => {
      const it = ITEMS[id], hint = useHint(id);
      return `<div class="row"><h4>${esc(it.name)}${counts[id] > 1 ? ` <small>× ${counts[id]}</small>` : ''}<small>${esc(it.kind)} · ${it.cap ? '칸 +' + it.cap : it.vol + '칸'}${it.weapon ? ' · 손에 쥘 만하다' : ''}${it.light ? ' · 밤길을 밝힌다' : ''}</small></h4>
        <p>${esc(it.text)}</p>${hint ? `<div class="meta">${hint}</div>` : ''}
        ${live ? `<div class="acts">${it.use ? `<button class="mini use" data-act="use" data-id="${id}">쓴다</button>` : ''}<button class="mini" data-act="drop" data-id="${id}">버린다</button></div>` : ''}</div>`;
    }).join('');
    const relics = run.relics.map(id => `<div class="row"><h4>${esc(RELICS[id].name)}<small>유물 · ${RELICS[id].vol}칸</small></h4><p>${esc(RELICS[id].text)}</p><div class="meta">${esc(RELICS[id].fx)}</div></div>`).join('');
    return sheet(`가방<span class="cap">${Game.load(run)} / ${Game.capacity(run)}칸</span>`, '',
      (ui.toast.length ? `<div class="toast">${ui.toast.map(esc).join('<br>')}</div>` : '') +
      (items || '<p class="empty">주머니에는 아무것도 없었다.</p>') + (relics ? '<p class="sub-head">유물</p>' + relics : ''));
  }

  /* ------------------------------------------------------------------------------------------ 수첩 */
  const TABS = [['people', '사람'], ['facs', '세력'], ['things', '그것들'], ['items', '물건'], ['relics', '유물'], ['endings', '결말'], ['graves', '지나간 사람']];
  function bookSheet() {
    const m = S.meta, run = S.run;
    let body = '';
    if (ui.tab === 'people') {
      body = Object.keys(PEOPLE).map(id => {
        const p = PEOPLE[id], rec = m.people[id];
        if (!rec || !rec.first) return '<div class="row unknown"><h4>아직 만나지 못한 사람</h4></div>';
        const lines = rec.likes.map(l => `<li class="like">${esc(l)}</li>`).concat(rec.dislikes.map(l => `<li class="dislike">${esc(l)}</li>`), rec.notes.map(l => `<li class="note">${esc(l)}</li>`)).join('');
        const now = run && run.met[id] && run.scene.t !== 'ending' ? ` · 이번에는 ${run.met[id]}일째에 만났다` : '';
        return `<div class="row"><h4>${esc(p.name)}<small>${esc(p.role)}</small></h4><p>${esc(p.text)}</p>
          <div class="meta">처음 만난 날: ${rec.first.run}번째 사람의 ${rec.first.day}일째 · 만난 사람 ${rec.n}명${now}</div>
          ${lines ? `<ul class="notes">${lines}</ul>` : '<div class="meta">아직 아는 것이 없다. 내가 한 일에 어떻게 구는지 봐야 한다.</div>'}</div>`;
      }).join('');
    } else if (ui.tab === 'facs') {
      body = Object.keys(FACTIONS).map(id => {
        const f = FACTIONS[id], rec = m.facs[id];
        if (!rec) return '<div class="row unknown"><h4>아직 엮이지 않은 사람들</h4></div>';
        return `<div class="row"><h4>${esc(f.name)}</h4><p>${esc(f.text)}</p>${rec.notes.length ? `<ul class="notes">${rec.notes.map(l => `<li class="note">${esc(l)}</li>`).join('')}</ul>` : ''}</div>`;
      }).join('');
    } else if (ui.tab === 'things') {
      body = Object.keys(THINGS).map(id => m.things[id]
        ? `<div class="row"><h4>${esc(THINGS[id].name)}<small>${m.things[id]}번 마주쳤다</small></h4><p>${esc(THINGS[id].text)}</p></div>`
        : '<div class="row unknown"><h4>아직 보지 못한 것</h4></div>').join('');
    } else if (ui.tab === 'items') {
      const ids = Object.keys(ITEMS), got = ids.filter(id => m.items[id]);
      body = `<div class="meta" style="padding-top:12px">${got.length}/${ids.length}</div>` + ids.map(id => m.items[id]
        ? `<div class="row"><h4>${esc(ITEMS[id].name)}<small>${esc(ITEMS[id].kind)}</small></h4><p>${esc(ITEMS[id].text)}</p>${useHint(id) ? `<div class="meta">${useHint(id)}</div>` : ''}</div>`
        : '<div class="row unknown"><h4>아직 줍지 못한 것</h4></div>').join('');
    } else if (ui.tab === 'relics') {
      const ids = Object.keys(RELICS);
      body = `<div class="meta" style="padding-top:12px">${m.relics.length}/${ids.length} · 한 번 얻으면 다음 사람부터 들고 갈 수 있다.</div>` + ids.map(id => m.relics.includes(id)
        ? `<div class="row"><h4>${esc(RELICS[id].name)}<small>${RELICS[id].vol}칸</small></h4><p>${esc(RELICS[id].text)}</p><div class="meta">${esc(RELICS[id].fx)}</div></div>`
        : `<div class="row unknown"><h4>아직 얻지 못한 것</h4><p>${esc(RELICS[id].hint || '')}</p></div>`).join('');
    } else if (ui.tab === 'endings') {
      const ids = Object.keys(ENDINGS), seen = ids.filter(id => m.endings[id]);
      const block = kind => ids.filter(id => ENDINGS[id].kind === kind).map(id => m.endings[id]
        ? `<div class="row"><h4>${esc(ENDINGS[id].title)}<small>${m.endings[id].n}번 · 처음은 ${m.endings[id].first}번째 사람</small></h4><p>${esc(ENDINGS[id].text)}</p></div>`
        : `<div class="row unknown"><h4>아직 보지 못한 결말</h4><p>${esc(ENDINGS[id].hint)}</p></div>`).join('');
      body = `<div class="meta" style="padding-top:12px">${seen.length}/${ids.length}</div><p class="sub-head">살아남은 끝</p>${block('alive')}<p class="sub-head">여기까지였던 끝</p>${block('dead')}`;
    } else {
      body = m.graves.length ? m.graves.map(g => `<div class="row"><h4>${esc(g.name)}<small>${esc(g.job)} · ${g.day}일째</small></h4>
        <p>${g.alive ? '살아남았다' : '여기까지'} — ${esc((ENDINGS[g.end] || {}).title || '')}</p></div>`).join('') : '<p class="empty">아직 아무도 지나가지 않았다.</p>';
      body += `<p class="wipe">${ui.wipe ? '수첩과 유물과 결말이 전부 사라진다. <button class="sure" data-act="wipe2">정말 지운다</button> · <button data-act="wipe0">그만둔다</button>'
        : '<button data-act="wipe1">기록을 전부 지운다</button>'}</p>`;
    }
    const tabs = `<div class="tabs" role="tablist">${TABS.map(([k, n]) => `<button class="tab${ui.tab === k ? ' on' : ''}" role="tab" aria-selected="${ui.tab === k}" data-act="tab" data-k="${k}">${n}</button>`).join('')}</div>`;
    return sheet('수첩', tabs, body);
  }
  function sheet(title, extra, body) {
    return `<div class="veil" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head"><h3>${title}</h3><button class="tool" data-act="close">닫는다</button></div>${extra}<div class="sheet-body">${body}</div></div>`;
  }

  /* ------------------------------------------------------------------------------------------ 그리기 */
  function render(keepScroll) {
    const y = keepScroll ? (document.querySelector('.sheet-body') || {}).scrollTop : 0;
    let h = ui.screen === 'title' ? titleScreen() : ui.screen === 'create' ? createScreen() : gameScreen();
    if (ui.overlay === 'bag' && S.run) h += bagSheet();
    if (ui.overlay === 'book') h += bookSheet();
    app.innerHTML = h;
    document.body.style.overflow = ui.overlay ? 'hidden' : '';
    if (keepScroll && y) { const b = document.querySelector('.sheet-body'); if (b) b.scrollTop = y; }
    else if (!ui.overlay) window.scrollTo(0, 0);
  }

  /* ------------------------------------------------------------------------------------------ 누른 것 */
  const ACT = {
    new() { ui.sel = blankSel(); ui.step = 0; ui.screen = 'create'; },
    continue() { ui.screen = 'game'; },
    title() { ui.screen = 'title'; },
    again() { S.run = null; save(); ACT.new(); },
    open(d) { ui.overlay = d.what; ui.toast = []; ui.wipe = 0; },
    close() { ui.overlay = ''; },
    tab(d) { ui.tab = d.k; ui.wipe = 0; },
    pick(d) { ui.sel[d.k] = d.id; if (d.k === 'job') trimRelics(); if (ui.step < STEPS.length - 1) ui.step += 1; },
    relic(d) { const k = ui.sel.relics.indexOf(d.id); if (k >= 0) ui.sel.relics.splice(k, 1); else ui.sel.relics.push(d.id); },
    back() { if (ui.step === 0) ui.screen = 'title'; else ui.step -= 1; },
    fwd() { ui.step += 1; },
    anyone() {
      const pick = t => t[Math.floor(Math.random() * t.length)].id;
      ui.sel = Object.assign(blankSel(), { name: ui.sel.name, age: pick(AGES), job: pick(JOBS), origin: pick(ORIGINS), temper: pick(TEMPERS), flaw: pick(FLAWS) });
      ui.step = STEPS.length - 2;
    },
    begin() { S.run = Game.newRun(ui.sel, S.meta); ui.screen = 'game'; save(); },
    choose(d) { Game.choose(S, d.key); save(); },
    use(d) {
      const name = ITEMS[d.id].name, out = Game.useItem(S, d.id);
      if (!out) return;
      ui.toast = [josa(name + '을(를) 썼다.')].concat(out.map(o => typeof o === 'string' ? o : o.vital ? `${Game.VITAL[o.vital]} ${o.d > 0 ? '+' : '−'}${Math.abs(o.d)}` : '').filter(Boolean));
      Game.recheck(S); save();
      if (S.run.scene.t === 'ending') ui.overlay = '';
    },
    drop(d) { if (Game.leave(S, d.id)) { ui.toast = [josa(ITEMS[d.id].name + '을(를) 두고 왔다.')]; Game.recheck(S); save(); } },
    wipe1() { ui.wipe = 1; }, wipe0() { ui.wipe = 0; },
    wipe2() { S = { meta: Game.newMeta(), run: null }; save(); ui.wipe = 0; ui.overlay = ''; ui.screen = 'title'; },
  };
  app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const act = el.dataset.act;
    if (!ACT[act]) return;
    if (ui.screen === 'create') { const n = document.getElementById('name'); if (n) ui.sel.name = n.value; }
    ACT[act](el.dataset);
    render(!!ui.overlay && ['use', 'drop', 'wipe1', 'wipe0'].includes(act));
  });
  document.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') { if (e.key === 'Enter') { ui.sel.name = e.target.value; ACT.fwd(); render(); } return; }
    if (e.key === 'Escape' && ui.overlay) { ui.overlay = ''; render(); return; }
    if (ui.overlay || e.metaKey || e.ctrlKey || e.altKey) return;
    if (ui.screen === 'game' && /^[1-9]$/.test(e.key)) {
      const b = app.querySelectorAll('.scene .choice')[+e.key - 1];
      if (b && !b.disabled) b.click();
    }
  });

  loadSave();
  render();
})();

</script>
</body>
</html>
