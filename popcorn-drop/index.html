<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0C1C">
<title>Popcorn Drop — 팝콘 팡팡</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app" class="app">
<div id="frame" class="frame">

  <!-- 시작 -->
  <section id="scr-title" class="screen">
    <div class="title-glow" aria-hidden="true"></div>
    <div class="title-box">
      <div class="logo" aria-hidden="true">🍿</div>
      <h1 class="game-title">Popcorn Drop</h1>
      <p class="game-sub">팝콘 팡팡</p>
    </div>
    <!-- 예고편: ui.js buildTrailer() 가 같은 규칙으로 연습 판을 돌려 그 순간을 그린다 -->
    <div id="trailer" class="trailer" role="img" aria-label="예고편 — 옥수수를 한꺼번에 쏟고, 프라이팬에서 팡! 줄 선 손님에게 나눠 주고, 스킬을 사면 다음 판에 옥수수가 늘어요">
      <figure class="tr"><canvas id="tr-pour" width="160" height="200"></canvas><figcaption id="tc-pour"></figcaption></figure>
      <figure class="tr"><canvas id="tr-pan" width="160" height="200"></canvas><figcaption id="tc-pan"></figcaption></figure>
      <figure class="tr"><canvas id="tr-serve" width="160" height="200"></canvas><figcaption id="tc-serve"></figcaption></figure>
      <figure class="tr"><canvas id="tr-buy" width="160" height="200"></canvas><figcaption id="tc-buy"></figcaption></figure>
    </div>
    <p id="tr-grow" class="grow"></p>
    <div class="menu">
      <button id="btn-start" class="btn primary big">매점 열기</button>
      <div class="row2">
        <button id="btn-title-tree" class="btn">스킬 트리</button>
        <button id="btn-title-halls" class="btn">상영관</button>
        <button id="btn-daily" class="btn" aria-label="오늘의 도전 — 날짜로 정한 같은 판, 하루 한 번">오늘 도전</button>
      </div>
      <div class="row2">
        <button id="btn-help" class="btn">방법</button>
        <button id="btn-records" class="btn">기록</button>
        <button id="btn-settings" class="btn">설정</button>
      </div>
    </div>
    <p id="title-meta" class="meta"></p>
    <p class="meta small">세로 화면 전용 게임이에요 · 휴대폰을 가로로 돌리지 않아도 돼요</p>
  </section>

  <!-- 판 (본 화면) -->
  <section id="scr-play" class="screen play">
    <canvas id="cv" class="cv" width="360" height="640" aria-label="옥수수 자루, 못 판, 프라이팬, 팝콘 통과 손님 줄"></canvas>
    <div id="hud" class="hud">
      <div class="hud-l">
        <span id="hud-round" class="chip">1판</span>
        <span id="hud-hall" class="chip">1관</span>
      </div>
      <div class="hud-c">
        <div id="hud-pop" class="popnum">팝콘 0개</div>
        <div id="hud-goal" class="goal-chip">목표 팝콘 0개</div>
      </div>
      <div class="hud-r">
        <span id="hud-coins" class="chip coin">🎟 0</span>
        <button id="btn-pause" class="btn small" aria-label="멈춤">Ⅱ</button>
      </div>
    </div>
    <div id="controls" class="controls">
      <button id="btn-pour" class="btn primary big pour">쏟아붓기!</button>
      <button id="btn-play-tree" class="btn small sub">스킬<br>트리</button>
      <button id="btn-play-halls" class="btn small sub">상영관</button>
      <button id="btn-adcorn" class="btn small sub ad" aria-label="광고 보고 옥수수 두 배로 쏟기 (하루 한 번)">📺<br>두 배</button>
    </div>
    <div id="tut" class="tut hidden" role="status">
      <p id="tut-text"></p>
      <button id="btn-tut-skip" class="btn small">건너뛰기</button>
    </div>
  </section>

  <!-- 스킬 트리 -->
  <section id="scr-tree" class="screen play">
    <canvas id="treecv" class="treecv" width="360" height="640" aria-label="스킬 트리 — 끌어서 움직이고 두 손가락으로 확대·축소"></canvas>
    <header class="bar tree-bar">
      <button id="btn-tree-back" class="btn small" aria-label="닫기">◀</button>
      <h2>스킬 트리</h2>
      <span id="tree-coins" class="coins">🎟 0</span>
    </header>
    <p id="tree-hint" class="tree-hint">밝은 칸을 눌러 사요 · 끌어서 움직이고 두 손가락으로 확대</p>
    <div class="zoom">
      <button id="btn-zoom-in" class="btn small" aria-label="확대">＋</button>
      <button id="btn-zoom-out" class="btn small" aria-label="축소">－</button>
      <button id="btn-zoom-fit" class="btn small" aria-label="가운데로">◎</button>
    </div>
  </section>

  <!-- 상영관 -->
  <section id="scr-halls" class="screen">
    <header class="bar">
      <button id="btn-halls-back" class="btn small" aria-label="뒤로">◀</button>
      <h2>상영관</h2><span></span>
    </header>
    <p class="meta">스킬 트리 네 귀퉁이의 🔑 열쇠를 열면 새 상영관이 열려요.</p>
    <div id="hall-list" class="scroll list"></div>
  </section>

  <!-- 방법 -->
  <section id="scr-help" class="screen">
    <header class="bar">
      <button id="btn-help-back" class="btn small" aria-label="뒤로">◀</button>
      <h2>방법</h2><span></span>
    </header>
    <div id="help-list" class="scroll"></div>
  </section>

  <!-- 설정 -->
  <section id="scr-settings" class="screen">
    <header class="bar">
      <button id="btn-settings-back" class="btn small" aria-label="뒤로">◀</button>
      <h2>설정</h2><span></span>
    </header>
    <div class="scroll">
      <div id="set-list" class="list"></div>
      <div class="list" style="margin-top: 10px">
        <button id="btn-tut-again" class="btn">처음 안내 다시 보기</button>
        <button id="btn-noads" class="btn">광고 제거</button>
        <button id="btn-wipe" class="btn danger">기록 지우기</button>
      </div>
      <div id="wipe-confirm" class="card hidden">
        <p>동전·스킬·상영관·기록이 모두 지워져요. 정말 지울까요?</p>
        <div class="row2">
          <button id="btn-wipe-yes" class="btn danger">지우기</button>
          <button id="btn-wipe-no" class="btn">그만두기</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 기록 -->
  <section id="scr-records" class="screen">
    <header class="bar">
      <button id="btn-records-back" class="btn small" aria-label="뒤로">◀</button>
      <h2>기록</h2><span></span>
    </header>
    <div class="scroll">
      <div id="rec-lines" class="lines"></div>
      <h3>최근 판</h3>
      <div id="rec-recent" class="lines"></div>
      <h3 id="ach-title">업적</h3>
      <div id="ach-list" class="list"></div>
    </div>
  </section>

  <!-- 스킬 칸 (겹침) -->
  <div id="ov-node" class="overlay">
    <div class="panel">
      <div id="node-icon" class="node-icon" aria-hidden="true">🌽</div>
      <h2 id="node-name">옥수수 +5</h2>
      <p id="node-desc" class="meta"></p>
      <p id="node-cost" class="node-cost"></p>
      <div class="row2">
        <button id="btn-node-buy" class="btn primary">사기</button>
        <button id="btn-node-close" class="btn">닫기</button>
      </div>
    </div>
  </div>

  <!-- 결과 (겹침) -->
  <div id="ov-result" class="overlay">
    <div class="panel">
      <h2 id="res-title">팝콘 품절!</h2>
      <p id="res-sub" class="meta"></p>
      <div id="res-lines" class="lines"></div>
      <button id="btn-ad-double" class="btn ad">📺 광고 보고 돈 2배</button>
      <div class="row2">
        <button id="btn-res-tree" class="btn">스킬 트리</button>
        <button id="btn-res-next" class="btn primary">다음 판</button>
      </div>
      <div class="row2">
        <button id="btn-res-home" class="btn">처음으로</button>
        <button id="btn-res-copy" class="btn" aria-label="결과 문구 복사">📋 결과 복사</button>
      </div>
      <textarea id="res-share" class="share-box hidden" rows="3" readonly aria-label="결과 문구 — 길게 눌러 복사"></textarea>
    </div>
  </div>

  <!-- 멈춤 (겹침) -->
  <div id="ov-pause" class="overlay">
    <div class="panel">
      <h2>멈춤</h2>
      <button id="btn-resume" class="btn primary">계속</button>
      <button id="btn-pause-help" class="btn">방법</button>
      <button id="btn-pause-settings" class="btn">설정</button>
      <button id="btn-pause-home" class="btn danger">처음으로</button>
    </div>
  </div>

  <!-- 광고 자리 (겹침) — 광고 SDK 없음 -->
  <div id="ov-ad" class="overlay">
    <div class="panel">
      <h2 id="ad-title">광고</h2>
      <div class="ad-box" aria-hidden="true">📺</div>
      <p id="ad-text" class="meta">광고 자리예요(준비 중).</p>
      <button id="btn-ad-close" class="btn primary" disabled>닫기</button>
    </div>
  </div>

  <div id="hand" class="hand hidden" aria-hidden="true">👆</div>
  <div id="flash" class="flash"></div>
  <div id="toast" class="toast" role="status"></div>
</div>
</div>
<script src="./data.js"></script>
<script src="./audio.js"></script>
<script src="./physics.js"></script>
<script src="./game.js"></script>
<script src="./tree.js"></script>
<script src="./ui.js"></script>
</body>
</html>
