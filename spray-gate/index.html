<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2E7A4E">
<title>Spray Gate</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" width="36" height="36" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="10" fill="var(--accent)"/><path d="M10 30V16a10 10 0 0 1 20 0v14" fill="none" stroke="var(--accent-ink)" stroke-width="3.5" stroke-linecap="round"/><path d="M20 30V20" stroke="var(--accent-ink)" stroke-width="3.5" stroke-linecap="round"/><circle cx="20" cy="15" r="2.5" fill="var(--warn)"/></svg>
    <h1>Spray Gate</h1>
  </div>
  <div class="top-btns">
    <button type="button" class="btn small ghost" data-act="go" data-to="help">방법</button>
    <button type="button" class="btn small ghost" data-act="go" data-to="more">더보기</button>
  </div>
</header>
<p id="store-warn" class="warn" role="alert" hidden></p>

<main id="app">
  <section id="screen-today" class="screen" aria-label="오늘"><div id="today-root"></div></section>
  <section id="screen-spray" class="screen" aria-label="살포" hidden><div id="spray-root"></div></section>
  <section id="screen-fields" class="screen" aria-label="밭" hidden><div id="fields-root"></div></section>
  <section id="screen-products" class="screen" aria-label="약 카드" hidden><div id="products-root"></div></section>
  <section id="screen-log" class="screen" aria-label="일지" hidden><div id="log-root"></div></section>
  <section id="screen-more" class="screen" aria-label="더보기" hidden><div id="more-root"></div></section>
  <section id="screen-help" class="screen" aria-label="방법" hidden><div id="help-root"></div></section>
</main>

<section id="print-sheet" class="print-sheet" aria-hidden="true"></section>

<nav class="tabs" aria-label="화면">
  <button type="button" class="tab" data-act="go" data-to="today"><svg class="tab-ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle class="f" fill="currentColor" stroke="none" cx="12" cy="15" r="2"/></svg>오늘</button>
  <button type="button" class="tab" data-act="go" data-to="spray"><svg class="tab-ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><path d="M12 3.5c-3.2 4.2-5.5 7.2-5.5 10.2a5.5 5.5 0 0 0 11 0c0-3-2.3-6-5.5-10.2z"/><path d="M9.6 14.2a2.6 2.6 0 0 0 2.2 2.6"/></svg>살포</button>
  <button type="button" class="tab" data-act="go" data-to="fields"><svg class="tab-ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><path d="M3 20c3-2.2 6-3.2 9-3.2s6 1 9 3.2M12 16.8V9"/><path class="f" fill="currentColor" stroke="none" d="M12 11.5c-2.4 0-4-1.6-4-4 2.4 0 4 1.6 4 4zM12 10c0-2.4 1.6-4 4-4 0 2.4-1.6 4-4 4z"/></svg>밭</button>
  <button type="button" class="tab" data-act="go" data-to="products"><svg class="tab-ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><path d="M9 3h6M10 3v3.5L7.5 9.5V19a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2V9.5L14 6.5V3"/><path d="M7.5 12.5h9v4h-9z"/></svg>약 카드</button>
  <button type="button" class="tab" data-act="go" data-to="log"><svg class="tab-ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 8.5h6M9 12h6M9 15.5h3.5"/></svg>일지</button>
</nav>

<div class="sheet-wrap" id="sheet-field" hidden><div class="sheet-back" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="밭"><div id="field-root"></div></div></div>
<div class="sheet-wrap" id="sheet-product" hidden><div class="sheet-back" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="약 카드"><div id="product-root"></div></div></div>
<div class="sheet-wrap" id="sheet-gate" hidden><div class="sheet-back" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="출하 판정"><div id="gate-root"></div></div></div>
<div class="sheet-wrap" id="sheet-record" hidden><div class="sheet-back" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="살포 기록"><div id="record-root"></div></div></div>
<div class="sheet-wrap" id="sheet-safety" hidden><div class="sheet-back" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="안전 점검"><div id="safety-root"></div></div></div>
<div class="sheet-wrap" id="sheet-backup" hidden><div class="sheet-back" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="내보내기·가져오기"><div id="backup-root"></div></div></div>

<div class="overlay" id="ov-welcome" hidden>
  <div class="ov-card" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
    <svg viewBox="0 0 120 72" width="120" height="72" aria-hidden="true"><rect x="6" y="46" width="108" height="22" rx="8" fill="var(--soil)"/><path d="M30 46V24a30 30 0 0 1 60 0v22" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/><path d="M60 46V30" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/><circle cx="60" cy="20" r="5" fill="var(--warn)"/></svg>
    <h2 id="welcome-title">Spray Gate</h2>
    <p>약을 칠 때 통에 넣을 양을 계산하고, 밭마다 <b>수확해도 되는 날</b>을 지켜 드려요.</p>
    <p class="sub">약 병 라벨의 "수확 며칠 전까지 · 몇 회 이내" 를 카드로 한 번 적어 두면, 약을 고를 때마다 수확 예정일과 겹치는지 바로 보여요. 기록은 이 기기 브라우저에만 저장돼요.</p>
    <div class="row2"><button type="button" class="btn" data-act="welcome-sample">예시로 둘러보기</button><button type="button" class="btn primary" data-act="welcome-start">내 밭 넣기</button></div>
  </div>
</div>

<div class="overlay" id="ov-confirm" hidden>
  <div class="ov-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-msg">
    <p id="confirm-msg">정말 할까요?</p>
    <div class="row2"><button type="button" class="btn" id="confirm-no" data-act="confirm-no">그만두기</button><button type="button" class="btn danger" id="confirm-yes" data-act="confirm-yes">지우기</button></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="./data.js"></script>
<script src="./logic.js"></script>
<script src="./store.js"></script>
<script src="./ui.js"></script>
<script src="./app.js"></script>
</body>
</html>
