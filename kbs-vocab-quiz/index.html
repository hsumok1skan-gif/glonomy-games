<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>한국어 어휘 랜덤 퀴즈</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="container">

    <header>
      <a href="../index.html" class="home-link">
        ← GLONOMY Games
      </a>

      <span id="totalCount" class="total-count"></span>
    </header>

    <!-- 시작 화면 -->
    <section id="startScreen">

      <p class="category-label">
        KBS 한국어능력시험 · 어휘
      </p>

      <h1>
        이 단어의 뜻을<br>
        정말 알고 있나요?
      </h1>

      <p class="description">
        문제와 보기 순서가 매번 무작위로 바뀝니다.
      </p>

      <div class="setting-box">

        <div class="setting-group">
          <strong>출제 범위</strong>

          <div class="button-group" id="categoryButtons">
            <button type="button" class="selected" data-value="전체">
              전체
            </button>

            <button type="button" data-value="고유어">
              고유어
            </button>

            <button type="button" data-value="한자어">
              한자어
            </button>
          </div>
        </div>

        <div class="setting-group">
          <strong>문항 수</strong>

          <div class="button-group" id="countButtons">
            <button type="button" data-value="10">
              10문제
            </button>

            <button type="button" class="selected" data-value="20">
              20문제
            </button>

            <button type="button" data-value="50">
              50문제
            </button>
          </div>
        </div>

        <button id="startButton" class="primary-button" type="button">
          랜덤 문제 시작 →
        </button>

      </div>
    </section>

    <!-- 문제 화면 -->
    <section id="quizScreen" class="hidden">

      <div class="progress">
        <div id="progressBar"></div>
      </div>

      <div class="quiz-info">
        <span id="questionCategory"></span>

        <strong>
          <span id="currentNumber"></span>
          /
          <span id="questionCount"></span>
        </strong>
      </div>

      <article class="question-box">

        <p id="questionLabel" class="question-label"></p>

        <h2 id="questionText"></h2>

        <div id="choiceList" class="choice-list"></div>

        <div id="explanation" class="explanation hidden"></div>

      </article>

      <button
        id="nextButton"
        class="primary-button next-button hidden"
        type="button"
      >
        다음 문제 →
      </button>

    </section>

    <!-- 결과 화면 -->
    <section id="resultScreen" class="hidden">

      <article class="result-box">

        <p class="category-label">학습 결과</p>

        <div class="score">
          <span id="scoreNumber">0</span>점
        </div>

        <h2 id="resultTitle"></h2>

        <p id="resultDescription"></p>

        <div class="result-buttons">
          <button id="wrongRetryButton" type="button">
            오답만 다시 풀기
          </button>

          <button
            id="restartButton"
            class="primary-button"
            type="button"
          >
            새 문제 풀기
          </button>
        </div>

        <button id="homeButton" class="text-button" type="button">
          처음 화면으로
        </button>

      </article>
    </section>

  </main>

  <script src="./questions.js"></script>
  <script src="./game.js"></script>
</body>
</html>
