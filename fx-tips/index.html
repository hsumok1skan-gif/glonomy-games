<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>게임 이펙트 TIP · GLONOMY</title>
  <meta name="description" content="모든 게임을 맛도리로 만드는 이펙트 모음. 효과를 하나씩 켜 보며 차이를 보고, 코드도 가져가세요." />
  <meta name="theme-color" content="#070a12" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070a12;
      --panel: #111827;
      --text: #f8fafc;
      --muted: #a7b0c0;
      --line: rgba(255, 255, 255, 0.11);
      --soft: rgba(255, 255, 255, 0.05);
      --yellow: #facc15;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      background: radial-gradient(circle at 50% 0%, rgba(250, 204, 21, 0.08), transparent 40%), var(--bg);
      color: var(--text);
      word-break: keep-all;
      -webkit-tap-highlight-color: transparent;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .page { width: min(760px, 100%); margin: 0 auto; padding: 14px 16px calc(40px + env(safe-area-inset-bottom, 0px)); }

    header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .back { color: var(--muted); font-size: 13px; font-weight: 700; padding: 6px 0; }
    h1 { margin: 6px 0 2px; font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: 28px; letter-spacing: -0.01em; }
    h1 em { font-style: normal; color: var(--yellow); }
    .lead { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; line-height: 1.5; }

    .recipes { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin: 0 -16px 12px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
    .recipes::-webkit-scrollbar { display: none; }
    .rc {
      flex: 0 0 auto; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--soft); color: var(--muted); font-size: 13.5px; font-weight: 800; white-space: nowrap;
    }
    .rc b { color: var(--yellow); margin-right: 4px; }
    .rc.active { background: var(--yellow); color: #0b1020; border-color: var(--yellow); }
    .rc.active b { color: #0b1020; }

    .stage-wrap { display: flex; justify-content: center; }
    .stage {
      --u: 0.7px;
      position: relative;
      width: min(100%, 430px, calc((100vh - 150px) * 9 / 16));
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      background: #0a0e1a;
      border: 1px solid var(--line);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    @supports (height: 100svh) { .stage { width: min(100%, 430px, calc((100svh - 150px) * 9 / 16)); } }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .ov { position: absolute; inset: 0; pointer-events: none; text-align: center; }
    .ov-top { position: absolute; left: 0; right: 0; top: calc(var(--u) * 56); }
    .tag { font-size: calc(var(--u) * 17); font-weight: 900; letter-spacing: 0.22em; color: var(--yellow); opacity: 0.9; }
    #ovTitle {
      margin: calc(var(--u) * 12) calc(var(--u) * 28) 0;
      font-family: "Black Han Sans", sans-serif; font-weight: 400;
      font-size: calc(var(--u) * 52); line-height: 1.12; color: #fff;
      text-shadow: 0 calc(var(--u) * 4) 0 rgba(0, 0, 0, 0.45);
    }
    #ovTitle em, #ovCap em, .cta em { font-style: normal; color: var(--yellow); }
    .pill {
      display: inline-flex; align-items: center; gap: calc(var(--u) * 10);
      margin-top: calc(var(--u) * 22); padding: calc(var(--u) * 8) calc(var(--u) * 22) calc(var(--u) * 8) calc(var(--u) * 8);
      border-radius: 999px; background: var(--yellow); color: #0b1020;
      font-weight: 900; font-size: calc(var(--u) * 25); letter-spacing: -0.01em;
    }
    .pill b {
      display: grid; place-items: center; width: calc(var(--u) * 38); height: calc(var(--u) * 38);
      border-radius: 50%; background: #0b1020; color: var(--yellow); font-size: calc(var(--u) * 21);
    }
    .pill.plain { padding: calc(var(--u) * 8) calc(var(--u) * 22); }
    .ov-bot { position: absolute; left: calc(var(--u) * 26); right: calc(var(--u) * 26); top: calc(var(--u) * 696); }
    #ovCap {
      margin: 0; font-weight: 900; font-size: calc(var(--u) * 35); line-height: 1.32; color: #fff;
      text-shadow: 0 calc(var(--u) * 3) 0 rgba(0, 0, 0, 0.5);
    }
    .dots { position: absolute; left: 0; right: 0; top: calc(var(--u) * 866); display: flex; justify-content: center; gap: calc(var(--u) * 9); }
    .dots i {
      display: grid; place-items: center; width: calc(var(--u) * 26); height: calc(var(--u) * 26); border-radius: 50%;
      border: calc(var(--u) * 2.5) solid rgba(250, 204, 21, 0.45); font-style: normal;
      font-size: calc(var(--u) * 13); font-weight: 900; color: rgba(250, 204, 21, 0.6);
    }
    .dots i.on { background: rgba(250, 204, 21, 0.25); border-color: var(--yellow); color: var(--yellow); }
    .dots i.cur { background: var(--yellow); color: #0b1020; transform: scale(1.18); }
    .ov-lab {
      position: absolute; display: none; left: calc(var(--u) * 70);
      font-family: "Black Han Sans", sans-serif; font-size: calc(var(--u) * 26); letter-spacing: 0.06em;
    }
    .ov-lab.a { top: calc(var(--u) * 242); color: #94a3b8; }
    .ov-lab.b { top: calc(var(--u) * 558); color: var(--yellow); }
    .stage.split .ov-lab { display: block; }
    .stage.split .ov-bot, .stage.split .dots, .stage.split .pill, .stage.cta-on .dots { display: none; }
    .cta {
      position: absolute; inset: 0; display: grid; place-content: center; gap: calc(var(--u) * 18);
      padding: 0 calc(var(--u) * 30); background: rgba(5, 7, 13, 0.74);
      opacity: 0; transition: opacity 0.35s;
    }
    .cta.show { opacity: 1; }
    .cta .q { font-family: "Black Han Sans", sans-serif; font-size: calc(var(--u) * 60); line-height: 1.1; }
    .cta .c { font-weight: 900; font-size: calc(var(--u) * 36); line-height: 1.35; }
    .cta .c em { display: inline-block; padding: 0 calc(var(--u) * 14); border-radius: calc(var(--u) * 10); background: var(--yellow); color: #0b1020; }
    .cta .s { font-weight: 700; font-size: calc(var(--u) * 24); color: #cbd5e1; }
    .hint { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 14); font-size: calc(var(--u) * 18); font-weight: 700; color: rgba(255, 255, 255, 0.35); }
    .pop { animation: pop 0.32s cubic-bezier(.2, 1.4, .4, 1) both; }
    @keyframes pop { from { opacity: 0; transform: translateY(calc(var(--u) * 14)) scale(0.94); } to { opacity: 1; transform: none; } }

    .ready {
      position: absolute; inset: 0; z-index: 3; display: none; place-content: center; gap: 12px; padding: 24px;
      background: rgba(5, 7, 13, 0.94); text-align: center; font-weight: 800; line-height: 1.6;
    }
    .ready strong { font-size: 20px; color: var(--yellow); }
    .ready span { color: var(--muted); font-size: 14px; }

    .ctrl { margin-top: 14px; display: grid; gap: 12px; }
    .label { font-size: 12px; font-weight: 900; color: var(--muted); letter-spacing: 0.06em; margin: 0 2px -4px; }
    .steps { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 8px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--soft);
      color: var(--muted); font-size: 13px; font-weight: 800;
    }
    .chip.on { background: rgba(250, 204, 21, 0.14); border-color: rgba(250, 204, 21, 0.5); color: #fde68a; }
    .chip.cur { background: var(--yellow); border-color: var(--yellow); color: #0b1020; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
      font-size: 13.5px; font-weight: 800;
    }
    .btn.primary { background: var(--yellow); color: #0b1020; border-color: var(--yellow); flex: 1 1 100%; font-size: 15px; padding: 13px; }
    .btn[aria-pressed="false"] { color: var(--muted); }
    .btn[aria-pressed="true"] { border-color: rgba(250, 204, 21, 0.5); }

    .code { margin-top: 22px; }
    .code h2 { font-size: 17px; margin: 0 0 4px; }
    .code p { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .cs { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); margin-bottom: 10px; overflow: hidden; }
    .cs-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-weight: 800; font-size: 14px; }
    .cs-h b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--yellow); color: #0b1020; font-size: 12px; flex: none; }
    .cs-h span { flex: 1; min-width: 0; }
    .cs-h small { color: var(--muted); font-weight: 700; }
    .copy { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); font-size: 12px; font-weight: 800; flex: none; }
    pre {
      margin: 0; padding: 12px; overflow-x: auto; background: #0a0f1d; border-top: 1px solid var(--line);
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #d6deeb;
    }
    details.cs summary { list-style: none; cursor: pointer; }
    details.cs summary::-webkit-details-marker { display: none; }
    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      padding: 10px 16px; border-radius: 999px; background: var(--yellow); color: #0b1020; font-weight: 900; font-size: 13px;
      opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60;
    }
    .toast.show { opacity: 1; }

    body.rec { overflow: hidden; }
    body.rec .stage-wrap { position: fixed; inset: 0; z-index: 50; background: #05070d; align-items: center; }
    body.rec .stage { width: min(100vw, calc(100vh * 9 / 16)); border-radius: 0; border: 0; }
    @supports (height: 100svh) { body.rec .stage { width: min(100vw, calc(100svh * 9 / 16)); } }
    body.rec .hint { display: none; }
    body.rec.rec-ready .ready { display: grid; }
    @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="back" href="../index.html">← GLONOMY Games</a>
    </header>
    <h1>게임 이펙트 <em>TIP</em></h1>
    <p class="lead">모든 게임을 맛도리로 만드는 이펙트 모음. 효과를 하나씩 켜 보며 차이를 보고, 코드도 그대로 가져가세요.</p>

    <nav class="recipes" id="recipes" aria-label="이펙트 종류"></nav>

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="ov">
          <div class="ov-top">
            <div class="tag" id="ovTag"></div>
            <h2 id="ovTitle"></h2>
            <div class="pill" id="ovPill"></div>
          </div>
          <div class="ov-lab a">BEFORE</div>
          <div class="ov-lab b">AFTER</div>
          <div class="ov-bot"><p id="ovCap"></p></div>
          <div class="dots" id="ovDots"></div>
          <div class="cta" id="ovCta"></div>
          <div class="hint" id="ovHint">화면을 탭하면 발사</div>
        </div>
        <div class="ready" id="ready">
          <strong>화면 녹화를 먼저 켜 주세요</strong>
          <span>준비되면 화면을 탭하세요. 처음부터 끝까지 자동으로 재생됩니다.<br />끝나면 한 번 더 탭해서 나갑니다.</span>
        </div>
      </div>
    </div>

    <section class="ctrl">
      <div class="row">
        <button class="btn primary" id="recBtn" type="button">▶ 영상용 자동 재생 (녹화 모드)</button>
      </div>
      <p class="label">효과 단계 — 누르면 그 단계까지 켜집니다</p>
      <div class="steps" id="steps"></div>
      <div class="row">
        <button class="btn" id="autoBtn" type="button" aria-pressed="true">자동 발사</button>
        <button class="btn" id="soundBtn" type="button" aria-pressed="true">소리</button>
        <button class="btn" id="splitBtn" type="button" aria-pressed="false">전/후 비교</button>
        <button class="btn" id="langBtn" type="button">자막: EN</button>
      </div>
    </section>

    <section class="code" id="code"></section>
  </div>
  <div class="toast" id="toast">복사했어요</div>

  <script>
  (() => {
    "use strict";

    /* ───────── 기본 도구 ───────── */
    const G = 280;                 // 바닥 높이 (월드 좌표)
    const TAU = Math.PI * 2;
    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = arr => arr[(Math.random() * arr.length) | 0];
    const E = {
      out: t => 1 - Math.pow(1 - t, 3),
      in: t => t * t * t,
      inout: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
      lin: t => t,
    };

    /* ───────── 그림 ───────── */
    const IMG_SRC = {
      cat: "hold_huchu", gun: "it_pistol", rat: "rat_rat", crate: "ob_crate",
      pine: "it_pinecone", churu: "food_churu", kibble: "food_kibble", fish: "food_mackerel",
    };
    const SPR = {};
    function tinted(src, color) {
      const c = document.createElement("canvas");
      c.width = src.width; c.height = src.height;
      const x = c.getContext("2d");
      x.drawImage(src, 0, 0);
      x.globalCompositeOperation = "source-atop";
      x.fillStyle = color;
      x.fillRect(0, 0, c.width, c.height);
      return c;
    }
    function loadImages() {
      return Promise.all(Object.entries(IMG_SRC).map(([k, name]) => new Promise(res => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas");
          if (k === "cat") { c.width = im.width / 4; c.height = im.height; } // 4칸 시트의 첫 칸
          else { c.width = im.width; c.height = im.height; }
          c.getContext("2d").drawImage(im, 0, 0);
          SPR[k] = { c, white: tinted(c, "#ffffff"), red: tinted(c, "#ef4444"), orange: tinted(c, "#fb923c") };
          res();
        };
        im.onerror = () => {
          const c = document.createElement("canvas"); c.width = c.height = 64;
          const x = c.getContext("2d"); x.fillStyle = "#94a3b8"; x.beginPath(); x.arc(32, 32, 30, 0, TAU); x.fill();
          SPR[k] = { c, white: tinted(c, "#fff"), red: tinted(c, "#ef4444"), orange: tinted(c, "#fb923c") };
          res();
        };
        im.src = "../sambundae/img/" + name + ".webp";
      })));
    }

    /* ───────── 소리 (파일 없이 합성) ───────── */
    const AU = { ctx: null };
    function audioInit() {
      try {
        if (!AU.ctx) {
          const C = window.AudioContext || window.webkitAudioContext;
          if (!C) return;
          const c = new C();
          AU.ctx = c;
          AU.out = c.createGain(); AU.out.gain.value = 0.55;
          const comp = c.createDynamicsCompressor();
          AU.out.connect(comp); comp.connect(c.destination);
          const n = c.sampleRate, b = c.createBuffer(1, n, n), d = b.getChannelData(0);
          for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
          AU.noise = b;
        }
        if (AU.ctx.state !== "running") AU.ctx.resume();
      } catch (e) {}
    }
    function env(g, t, vol, dur) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    }
    function nz({ dur = 0.1, type = "lowpass", f = 1000, f2, q = 0.7, vol = 0.4, delay = 0 }) {
      const c = AU.ctx; if (!c) return;
      const t = c.currentTime + delay;
      const s = c.createBufferSource(); s.buffer = AU.noise;
      const fl = c.createBiquadFilter(); fl.type = type; fl.Q.value = q;
      fl.frequency.setValueAtTime(f, t);
      if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
      const g = c.createGain(); env(g, t, vol, dur);
      s.connect(fl); fl.connect(g); g.connect(AU.out);
      s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
    }
    function tn({ type = "sine", f = 440, f2, dur = 0.1, vol = 0.3, delay = 0 }) {
      const c = AU.ctx; if (!c) return;
      const t = c.currentTime + delay;
      const o = c.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      const g = c.createGain(); env(g, t, vol, dur);
      o.connect(g); g.connect(AU.out);
      o.start(t); o.stop(t + dur + 0.05);
    }
    const SFX = {
      gun(p = 1) { nz({ dur: 0.07, type: "highpass", f: 2000 * p, vol: 0.7 }); tn({ type: "square", f: 170 * p, f2: 40, dur: 0.13, vol: 0.28 }); nz({ dur: 0.28, f: 700, f2: 120, vol: 0.35 }); },
      hit(p = 1) { tn({ f: 200 * p, f2: 55, dur: 0.11, vol: 0.55 }); nz({ dur: 0.05, type: "bandpass", f: 2600, q: 2, vol: 0.35 }); },
      ping() { tn({ type: "triangle", f: 1500, f2: 1350, dur: 0.4, vol: 0.22 }); tn({ f: 2250, dur: 0.25, vol: 0.08 }); tn({ f: 70, f2: 35, dur: 0.3, vol: 0.6 }); },
      charge() { tn({ f: 220, f2: 880, dur: 0.36, vol: 0.14 }); nz({ dur: 0.36, type: "bandpass", f: 400, f2: 2400, q: 4, vol: 0.12 }); },
      magic() { tn({ type: "triangle", f: 880, f2: 440, dur: 0.18, vol: 0.16 }); nz({ dur: 0.22, type: "bandpass", f: 1800, f2: 700, q: 3, vol: 0.2 }); },
      burst() { nz({ dur: 0.35, f: 2400, f2: 200, vol: 0.5 }); tn({ f: 320, f2: 70, dur: 0.25, vol: 0.4 }); tn({ type: "triangle", f: 1320, f2: 660, dur: 0.25, vol: 0.12 }); },
      slash() { nz({ dur: 0.13, type: "bandpass", f: 4200, f2: 900, q: 1.6, vol: 0.5 }); },
      thud() { tn({ f: 140, f2: 38, dur: 0.2, vol: 0.8 }); nz({ dur: 0.12, f: 900, vol: 0.45 }); },
      blip(n = 1) { const f = 620 * Math.pow(2, Math.min(n - 1, 14) / 12); tn({ type: "triangle", f, dur: 0.1, vol: 0.22 }); tn({ f: f * 2, dur: 0.07, vol: 0.08, delay: 0.015 }); },
      hurt() { tn({ type: "square", f: 320, f2: 110, dur: 0.16, vol: 0.18 }); nz({ dur: 0.1, type: "bandpass", f: 1400, q: 1.5, vol: 0.35 }); tn({ f: 90, f2: 50, dur: 0.15, vol: 0.5 }); },
      toss() { nz({ dur: 0.2, type: "bandpass", f: 700, f2: 1600, q: 2, vol: 0.15 }); },
      boom() { nz({ dur: 1.1, f: 900, f2: 80, vol: 0.9 }); tn({ f: 85, f2: 28, dur: 0.7, vol: 0.9 }); nz({ dur: 0.12, type: "highpass", f: 2500, vol: 0.35 }); },
    };
    const NOSFX = new Proxy({}, { get: () => () => {} });

    /* ───────── 등장인물 ───────── */
    const ACTOR = {
      cat: { spr: "cat", h: 150, flip: true, home: 120 },
      rat: { spr: "rat", w: 200, home: 420, hp: 100 },
      crate: { spr: "crate", h: 96, home: 420 },
    };

    /* ───────── 엔진: 이펙트를 돌리는 작은 세계 ───────── */
    class World {
      constructor(R, n, view, muted) {
        this.R = R; this.view = view; this.muted = !!muted;
        this.parts = []; this.shots = []; this.timers = []; this.tweens = []; this.actors = [];
        this.trauma = 0; this.kx = 0; this.stopT = 0; this.ts = 1; this.slowT = 0; this.slowDur = 1; this.slowTo = 1;
        this.flashA = 0; this.flashC = "255,255,255"; this.vig = 0; this.time = 0; this.busy = false;
        this.setN(n);
        R.setup(this);
      }
      setN(n) { this.n = n; this.steps = new Set(this.R.steps.slice(0, n).map(s => s.id)); }
      on(id) { return this.steps.has(id); }
      emit(ev, ...a) { for (const s of this.R.steps) if (this.steps.has(s.id) && typeof s[ev] === "function") s[ev](this, ...a); }
      get sfx() { return this.muted || app.mute || !this.on("sound") ? NOSFX : SFX; }

      actor(key) {
        const d = ACTOR[key], s = SPR[d.spr], ar = s.c.width / s.c.height;
        const h = d.h || d.w / ar, w = d.w || d.h * ar;
        const a = {
          key, s, w, h, x: d.home, home: d.home, ox: 0, oy: 0, sx: 1, sy: 1, rot: 0, k: 10,
          flash: 0, tint: 0, burn: 0, blink: 0, barShake: 0, alpha: 1, flip: !!d.flip, alive: true,
          flying: false, vx: 0, vy: 0, spin: 0, maxHp: d.hp || 0, hp: d.hp || 0, hpLag: d.hp || 0, lagWait: 0,
        };
        this.actors.push(a);
        return a;
      }
      spawn(p) {
        const q = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 0, life: 0.5, age: 0, size: 4, color: "255,255,255", type: "circle", rot: 0, vr: 0 }, p);
        if (q.add == null) q.add = ["glow", "spark", "star", "ring", "arc"].includes(q.type);
        if (q.seek) { q.x0 = q.x; q.y0 = q.y; }
        this.parts.push(q);
        if (this.parts.length > 700) this.parts.shift();
        return q;
      }
      shoot(p) { p.age = 0; this.shots.push(p); return p; }
      after(t, fn) { this.timers.push({ t, fn }); }
      tween(o, to, dur, ease = "out", done) {
        const from = {}; for (const k in to) from[k] = o[k];
        this.tweens.push({ o, from, to, dur, t: 0, ease: E[ease], done });
      }
      shake(amount, dir = 0) { this.trauma = Math.min(1, this.trauma + amount); this.kx += dir * amount * 30; }
      hitstop(sec) { this.stopT = Math.max(this.stopT, sec); }
      slowmo(scale, sec) { this.ts = scale; this.slowTo = scale; this.slowT = sec; this.slowDur = sec; }
      flash(color, a) { this.flashC = color; this.flashA = Math.max(this.flashA, a); }
      vignette(a) { this.vig = Math.max(this.vig, a); }
      fly(a, vx, vy, spin) { a.flying = true; a.vx = vx; a.vy = vy; a.spin = spin; }
      kill(a) {
        if (!a.alive) return;
        a.alive = false;
        this.emit("kill", a);
        if (!a.flying) a.alpha = 0;
        this.after(a.flying ? 1.2 : 0.55, () => this.respawn(a));
      }
      respawn(a) {
        Object.assign(a, { alive: true, flying: false, x: a.home, ox: 0, oy: 0, rot: 0, vx: 0, vy: 0, spin: 0, alpha: 1,
          flash: 0, tint: 0, burn: 0, hp: a.maxHp, hpLag: a.maxHp, sx: 0.2, sy: 0.2 });
      }

      update(rdt) {
        this.trauma = Math.max(0, this.trauma - rdt * 1.7);
        this.kx -= this.kx * Math.min(1, rdt * 12);
        this.flashA = Math.max(0, this.flashA - rdt * 6);
        this.vig = Math.max(0, this.vig - rdt * 1.4);
        let dt;
        if (this.stopT > 0) { this.stopT -= rdt; dt = 0; }
        else {
          if (this.slowT > 0) {
            this.slowT -= rdt;
            const k = Math.max(0, 1 - this.slowT / this.slowDur);
            this.ts = this.slowT > 0 ? this.slowTo + (1 - this.slowTo) * E.in(k) : 1;
          }
          dt = rdt * this.ts;
        }
        if (dt > 0) this.step(dt);
      }
      step(dt) {
        this.time += dt;
        for (let i = this.timers.length - 1; i >= 0; i--) {
          const t = this.timers[i]; t.t -= dt;
          if (t.t <= 0) { this.timers.splice(i, 1); t.fn(); }
        }
        for (let i = this.tweens.length - 1; i >= 0; i--) {
          const t = this.tweens[i]; t.t += dt;
          const k = Math.min(1, t.t / t.dur), e = t.ease(k);
          for (const p in t.to) t.o[p] = t.from[p] + (t.to[p] - t.from[p]) * e;
          if (k >= 1) { this.tweens.splice(i, 1); if (t.done) t.done(); }
        }
        for (const a of this.actors) {
          a.ox -= a.ox * Math.min(1, dt * a.k);
          if (a.k < 10 && Math.abs(a.ox) < 2) a.k = 10;
          a.sx += (1 - a.sx) * Math.min(1, dt * 12);
          a.sy += (1 - a.sy) * Math.min(1, dt * 12);
          a.flash = Math.max(0, a.flash - dt * 7);
          a.tint = Math.max(0, a.tint - dt * 2.5);
          a.blink = Math.max(0, a.blink - dt);
          a.barShake = Math.max(0, a.barShake - dt);
          if (a.flying) {
            a.x += a.vx * dt; a.oy += a.vy * dt; a.vy += 1500 * dt; a.rot += a.spin * dt;
            a.alpha = Math.max(0, a.alpha - dt * 0.9);
          }
        }
        if (this.R.update) this.R.update(this, dt);
        this.emit("update", dt);

        for (let i = this.shots.length - 1; i >= 0; i--) {
          const p = this.shots[i];
          p.age += dt;
          p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; p.rot = (p.rot || 0) + (p.vr || 0) * dt;
          if (p.trail) {
            this.spawn({ type: "glow", x: p.x + rand(-3, 3), y: p.y + rand(-3, 3), vx: rand(-80, 0), vy: rand(-40, 40), size: rand(6, 10), size1: 0, life: rand(0.25, 0.45), color: p.trail });
            if (Math.random() < 0.3) this.spawn({ type: "spark", x: p.x, y: p.y, vx: rand(-200, -60), vy: rand(-90, 90), drag: 3, size: 1.6, life: 0.25, color: "255,255,255" });
          }
          if ((p.hitX != null && p.x >= p.hitX) || (p.hitY != null && p.y >= p.hitY)) {
            this.shots.splice(i, 1);
            if (p.onHit) p.onHit(p);
          } else if (p.x > 760 || p.y > 600) this.shots.splice(i, 1);
        }
        for (let i = this.parts.length - 1; i >= 0; i--) {
          const p = this.parts[i];
          p.age += dt;
          if (p.age >= p.life) { this.parts.splice(i, 1); continue; }
          if (p.seek) {
            const k = E.in(p.age / p.life);
            p.x = p.x0 + (p.tx - p.x0) * k; p.y = p.y0 + (p.ty - p.y0) * k;
            continue;
          }
          const d = 1 / (1 + p.drag * dt);
          p.vx *= d; p.vy *= d; p.vy += p.g * dt;
          p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
          if (p.ground && p.y > G - 2) {
            p.y = G - 2;
            if (Math.abs(p.vy) < 70) { p.vy = 0; const f = Math.max(0, 1 - dt * 8); p.vx *= f; p.vr *= f; }
            else { p.vy *= -p.bounce; p.vx *= 0.6; p.vr *= 0.5; }
          }
        }
      }

      draw(ctx) {
        const v = this.view;
        ctx.save();
        ctx.translate(v.x, v.y); ctx.scale(v.s, v.s);
        if (v.clip) {
          ctx.beginPath(); ctx.roundRect(0, 0, 540, 360, 26);
          ctx.fillStyle = "rgba(255,255,255,0.035)"; ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.lineWidth = 2; ctx.stroke();
          ctx.clip();
        }
        const tr = this.trauma * this.trauma;
        ctx.translate(270 + (Math.random() * 2 - 1) * tr * 24 + this.kx, 180 + (Math.random() * 2 - 1) * tr * 18);
        ctx.rotate((Math.random() * 2 - 1) * tr * 0.035);
        ctx.translate(-270, -180);

        // 바닥
        const fg = ctx.createLinearGradient(0, G, 0, G + 90);
        fg.addColorStop(0, "rgba(148,163,184,0.12)"); fg.addColorStop(1, "rgba(148,163,184,0)");
        ctx.fillStyle = fg; ctx.fillRect(-80, G, 700, 90);
        ctx.fillStyle = "rgba(255,255,255,0.13)"; ctx.fillRect(10, G - 1, 520, 2);

        for (const p of this.parts) if (p.under) drawPart(ctx, p);
        for (const a of this.actors) drawShadow(ctx, a);
        if (this.R.drawBack) this.R.drawBack(this, ctx);
        for (const a of this.actors) drawActor(ctx, a);
        if (this.R.drawFront) this.R.drawFront(this, ctx);
        for (const p of this.shots) drawShot(ctx, p);
        for (const p of this.parts) if (!p.under) drawPart(ctx, p);
        ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
        if (this.R.drawHud) this.R.drawHud(this, ctx);
        ctx.restore();

        // 화면 전체 효과 (번쩍임, 붉은 테두리)
        if (this.flashA > 0 || this.vig > 0) {
          ctx.save();
          const r = v.clip ? { x: v.x, y: v.y, w: 540 * v.s, h: 360 * v.s } : { x: 0, y: 0, w: 540, h: 960 };
          ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, v.clip ? 26 * v.s : 0); ctx.clip();
          if (this.flashA > 0) { ctx.fillStyle = `rgba(${this.flashC},${Math.min(1, this.flashA)})`; ctx.fillRect(r.x, r.y, r.w, r.h); }
          if (this.vig > 0) {
            const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
            const vg = ctx.createRadialGradient(cx, cy, Math.min(r.w, r.h) * 0.32, cx, cy, Math.max(r.w, r.h) * 0.62);
            vg.addColorStop(0, "rgba(220,38,38,0)"); vg.addColorStop(1, `rgba(220,38,38,${Math.min(0.9, this.vig)})`);
            ctx.fillStyle = vg; ctx.fillRect(r.x, r.y, r.w, r.h);
          }
          ctx.restore();
        }
      }
    }

    /* ───────── 그리기 도우미 ───────── */
    function glow(ctx, x, y, r, c, a) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(0.35, `rgba(${c},${a * 0.45})`); g.addColorStop(1, `rgba(${c},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
    function starPath(ctx, x, y, s) {
      const t = s * 0.16;
      ctx.beginPath();
      ctx.moveTo(x, y - s); ctx.lineTo(x + t, y - t); ctx.lineTo(x + s, y); ctx.lineTo(x + t, y + t);
      ctx.lineTo(x, y + s); ctx.lineTo(x - t, y + t); ctx.lineTo(x - s, y); ctx.lineTo(x - t, y - t); ctx.closePath();
    }
    function drawPart(ctx, p) {
      const k = p.age / p.life, rem = 1 - k;
      const s = p.size1 == null ? p.size : p.size + (p.size1 - p.size) * E.out(k);
      let a = p.hold ? Math.min(1, rem * 4) : rem;
      if (p.alpha != null) a *= p.alpha;
      if (a <= 0 || s <= 0) return;
      ctx.globalCompositeOperation = p.add ? "lighter" : "source-over";
      ctx.globalAlpha = 1;
      switch (p.type) {
        case "glow": glow(ctx, p.x, p.y, s, p.color, a); break;
        case "spark": {
          const dir = Math.atan2(p.vy, p.vx), len = Math.max(s * 2, Math.hypot(p.vx, p.vy) * 0.035);
          ctx.strokeStyle = `rgba(${p.color},${a})`; ctx.lineWidth = s; ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(p.x - Math.cos(dir) * len, p.y - Math.sin(dir) * len); ctx.lineTo(p.x, p.y); ctx.stroke();
          if (p.seek) { ctx.fillStyle = `rgba(${p.color},${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill(); }
          break;
        }
        case "star":
          ctx.fillStyle = `rgba(${p.color},${a})`; starPath(ctx, p.x, p.y, s * (0.6 + 0.4 * rem)); ctx.fill();
          glow(ctx, p.x, p.y, s * 0.7, p.color, a * 0.6); break;
        case "ring":
          ctx.strokeStyle = `rgba(${p.color},${a})`; ctx.lineWidth = Math.max(0.5, (p.w || 6) * rem);
          ctx.beginPath();
          if (p.flat) ctx.ellipse(p.x, p.y, s, s * 0.22, 0, 0, TAU); else ctx.arc(p.x, p.y, s, 0, TAU);
          ctx.stroke(); break;
        case "arc":
          ctx.lineCap = "round";
          ctx.strokeStyle = `rgba(${p.color},${a})`; ctx.lineWidth = s * 0.34 * rem;
          ctx.beginPath(); ctx.arc(p.x, p.y, s, p.a0, p.a1); ctx.stroke();
          ctx.strokeStyle = `rgba(${p.color},${a * 0.35})`; ctx.lineWidth = s * 0.7 * rem;
          ctx.beginPath(); ctx.arc(p.x, p.y, s * 0.92, p.a0 + 0.2, p.a1 - 0.1); ctx.stroke();
          break;
        case "smoke":
          ctx.fillStyle = `rgba(${p.color},${a * 0.5})`; ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill(); break;
        case "shell":
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.globalAlpha = a; ctx.fillStyle = `rgb(${p.color})`; ctx.fillRect(-s / 2, -s / 4, s, s / 2);
          ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.fillRect(-s / 2, -s / 4, s, s / 8);
          ctx.restore(); break;
        case "chunk":
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = a;
          ctx.fillStyle = `rgb(${p.color})`;
          ctx.beginPath(); ctx.moveTo(-s, -s * 0.6); ctx.lineTo(s * 0.7, -s); ctx.lineTo(s, s * 0.5); ctx.lineTo(-s * 0.4, s); ctx.closePath(); ctx.fill();
          ctx.restore(); break;
        case "text": {
          const pop = p.age < 0.12 ? 1.5 - (p.age / 0.12) * 0.5 : 1;
          ctx.save(); ctx.translate(p.x, p.y); ctx.scale(pop, pop);
          ctx.globalAlpha = Math.min(1, rem * 3);
          ctx.font = `${p.size}px "Black Han Sans", sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.lineWidth = p.size * 0.18; ctx.strokeStyle = "rgba(10,12,20,0.9)"; ctx.lineJoin = "round";
          ctx.strokeText(p.text, 0, 0); ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 0);
          ctx.restore(); break;
        }
        case "ellipse": {
          ctx.save(); ctx.translate(p.x, p.y); ctx.scale(1, 0.2);
          const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s);
          g.addColorStop(0, `rgba(${p.color},${a})`); g.addColorStop(1, `rgba(${p.color},0)`);
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, s, 0, TAU); ctx.fill(); ctx.restore(); break;
        }
        default:
          ctx.fillStyle = `rgba(${p.color},${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    }
    function drawShadow(ctx, a) {
      if (a.alpha <= 0) return;
      const lift = a.oy < 0 ? Math.max(0, 1 + a.oy / 220) : 1;
      ctx.fillStyle = `rgba(0,0,0,${0.32 * a.alpha * lift})`;
      ctx.beginPath(); ctx.ellipse(a.x + a.ox, G + 2, a.w * 0.34 * a.sx, 8, 0, 0, TAU); ctx.fill();
    }
    function drawActor(ctx, a) {
      if (a.alpha <= 0) return;
      const hide = a.blink > 0 && Math.floor(a.blink * 14) % 2 === 0;
      ctx.save();
      ctx.globalAlpha = a.alpha * (hide ? 0.2 : 1);
      ctx.translate(a.x + a.ox, G + a.oy);
      if (a.rot) { ctx.translate(0, -a.h / 2); ctx.rotate(a.rot); ctx.translate(0, a.h / 2); }
      ctx.scale(a.sx * (a.flip ? -1 : 1), a.sy);
      ctx.drawImage(a.s.c, -a.w / 2, -a.h, a.w, a.h);
      if (a.flash > 0) { ctx.globalAlpha = Math.min(1, a.flash) * a.alpha; ctx.drawImage(a.s.white, -a.w / 2, -a.h, a.w, a.h); }
      if (a.tint > 0) { ctx.globalAlpha = Math.min(1, a.tint) * 0.85 * a.alpha; ctx.drawImage(a.s.red, -a.w / 2, -a.h, a.w, a.h); }
      if (a.burn > 0) { ctx.globalAlpha = (0.3 + 0.15 * Math.sin(performance.now() / 60)) * a.alpha; ctx.drawImage(a.s.orange, -a.w / 2, -a.h, a.w, a.h); }
      ctx.restore();
    }
    function drawShot(ctx, p) {
      if (p.img) {
        const c = SPR[p.img].c, w = p.w, h = w * c.height / c.width;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0); ctx.drawImage(c, -w / 2, -h / 2, w, h); ctx.restore();
        return;
      }
      if (p.orb) {
        if (p.core) {
          ctx.globalCompositeOperation = "lighter";
          glow(ctx, p.x, p.y, 30 * (1 + 0.15 * Math.sin(p.age * 40)), "167,139,250", 1);
          glow(ctx, p.x, p.y, 13, "255,255,255", 0.9);
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, TAU); ctx.fill();
        } else { ctx.fillStyle = "#8b7fd6"; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, TAU); ctx.fill(); }
        return;
      }
      if (p.len) {
        ctx.globalCompositeOperation = "lighter";
        const g = ctx.createLinearGradient(p.x - p.len, p.y, p.x, p.y);
        g.addColorStop(0, "rgba(255,180,70,0)"); g.addColorStop(1, "rgba(255,244,210,1)");
        ctx.strokeStyle = g; ctx.lineWidth = 4; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(p.x - p.len, p.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        glow(ctx, p.x, p.y, 14, "255,200,110", 0.8);
        ctx.globalCompositeOperation = "source-over";
        return;
      }
      ctx.fillStyle = p.color || "#cbd5e1"; ctx.beginPath(); ctx.arc(p.x, p.y, p.r || 3, 0, TAU); ctx.fill();
    }
    function drawBar(ctx, a, lag) {
      if (!a.maxHp || !a.alive) return;
      const bw = 74, bh = 9;
      let x = a.x - bw / 2, y = G - a.h - 22;
      if (a.barShake > 0) { x += rand(-3, 3); y += rand(-2, 2); }
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.beginPath(); ctx.roundRect(x - 3, y - 3, bw + 6, bh + 6, 6); ctx.fill();
      if (lag) { ctx.fillStyle = "#facc15"; ctx.fillRect(x, y, bw * Math.max(0, a.hpLag) / a.maxHp, bh); }
      ctx.fillStyle = "#ef4444"; ctx.fillRect(x, y, bw * Math.max(0, a.hp) / a.maxHp, bh);
      ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(x, y, bw * Math.max(0, a.hp) / a.maxHp, 3);
    }
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        r = Math.min(r || 0, w / 2, h / 2);
        this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
      };
    }

    /* ───────── 총·손 위치 ───────── */
    const GUNW = 58;
    function gripPt(w) { const c = w.cat; return { x: c.x + c.ox + 28, y: G - 56 + (1 - c.sy) * 40 }; }
    function muzzle(w) {
      const g = w.gun, p = gripPt(w), gh = GUNW * SPR.gun.c.height / SPR.gun.c.width;
      const lx = 0.7 * GUNW - g.kick, ly = -0.44 * gh, c = Math.cos(g.rot), s = Math.sin(g.rot);
      return { x: p.x + lx * c - ly * s, y: p.y + lx * s + ly * c };
    }
    function drawGun(w, ctx) {
      const g = w.gun, p = gripPt(w), img = SPR.gun.c, gh = GUNW * img.height / img.width;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(g.rot);
      ctx.drawImage(img, -0.28 * GUNW - g.kick, -0.72 * gh, GUNW, gh);
      ctx.restore();
    }
    function paw(w) { const c = w.cat; return { x: c.x + c.ox + 42, y: G - 64 }; }

    /* ───────── 레시피 (영상 한 편 = 레시피 하나) ─────────
       steps의 함수 이름 = 그 순간에 불리는 이벤트
       fire(발사) · hit(명중) · kill(처치) · update(매 프레임) 등 */
    const RECIPES = [
      {
        id: "gun",
        title: { en: "Make gunshots *punchy*", ko: "총 쏘는 *손맛* 살리기" },
        intro: { en: "Feels like a *toy*.", ko: "장난감 총 같죠?" },
        interval: 0.5, stepDur: 3.2,
        setup(w) { w.cat = w.actor("cat"); w.rat = w.actor("rat"); w.gun = { kick: 0, rot: 0 }; },
        fire(w) {
          const m = muzzle(w);
          const b = { x: m.x, y: m.y, vx: 1700, vy: 0, r: 3, color: "#cbd5e1", hitX: w.rat.x - 55 };
          b.onHit = () => {
            const r = w.rat; if (!r.alive) return;
            r.hp -= 20; w.emit("hit", { x: b.x, y: b.y });
            if (r.hp <= 0) w.kill(r);
          };
          w.emit("fire", m, b);
          w.shoot(b);
        },
        update(w, dt) { const g = w.gun; g.kick -= g.kick * Math.min(1, dt * 16); g.rot -= g.rot * Math.min(1, dt * 12); },
        drawFront(w, ctx) { drawGun(w, ctx); },
        drawHud(w, ctx) { drawBar(ctx, w.rat); },
        steps: [

        fire(w) {
          if (w.busy) return;

            const at = { x: c.x + 70, y: G - 60 }, r = w.rat;

      {
        id: "pickup",
        title: { en: "Make pickups *satisfying*", ko: "줍는 *맛* 살리기" },
        intro: { en: "It just… *disappears*.", ko: "그냥… *사라져요*." },
        interval: 2.1, stepDur: 3.6,
        setup(w) {
          w.cat = w.actor("cat"); w.crate = w.actor("crate");
          w.items = []; w.hud = { score: 0, shown: 0, bump: 0, x: 46, y: 40 }; w.combo = 0; w.comboT = 0;
        },
        fire(w) {
          const cr = w.crate; cr.sx = 1.15; cr.sy = 0.85;
          for (let i = 0; i < 6; i++) {
            const it = { img: ["churu", "kibble", "fish"][i % 3], x: rand(220, 320), y: G - 14, vx: 0, vy: 0, rot: rand(-0.4, 0.4), vr: 0, air: false, sq: 1, sc: 1, seek: false, dead: false };
            w.emit("drop", it);
            w.items.push(it);
            w.after(0.6 + i * 0.09, () => {
              if (it.dead) return;
              w.emit("collect", it);
              if (!it.seek) arrive(w, it);
            });
          }
        },
        update(w, dt) {
          for (const it of w.items) {
            if (it.air) {
              it.vy += 1500 * dt; it.x += it.vx * dt; it.y += it.vy * dt; it.rot += it.vr * dt;
              if (it.y >= G - 14) { it.y = G - 14; if (Math.abs(it.vy) > 140) { it.vy *= -0.4; it.vx *= 0.6; it.sq = 0.6; } else { it.air = false; it.vy = 0; } }
            }
            it.sq += (1 - it.sq) * Math.min(1, dt * 12);
          }
          w.items = w.items.filter(it => !it.dead);
          w.comboT -= dt; if (w.comboT <= 0) w.combo = 0;
          w.hud.bump = Math.max(0, w.hud.bump - dt * 6);
          if (!w.on("roll")) w.hud.shown = w.hud.score;
        },
        drawFront(w, ctx) {
          for (const it of w.items) {
            const c = SPR[it.img].c, s = 40 * it.sc, h = s * c.height / c.width;
            ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot); ctx.scale(1 / it.sq * 0.9 + 0.1, it.sq);
            ctx.drawImage(c, -s / 2, -h / 2, s, h); ctx.restore();
          }
        },
        drawHud(w, ctx) {
          const h = w.hud, c = SPR.churu.c, sc = 1 + h.bump * 0.45;
          ctx.save(); ctx.translate(h.x, h.y); ctx.scale(sc, sc);
          ctx.drawImage(c, -20, -20 * c.height / c.width, 40, 40 * c.height / c.width);
          ctx.font = '34px "Black Han Sans", sans-serif'; ctx.textBaseline = "middle"; ctx.textAlign = "left";
          ctx.lineWidth = 6; ctx.strokeStyle = "rgba(10,12,20,0.9)"; ctx.lineJoin = "round";
          const t = String(Math.round(h.shown));
          ctx.strokeText(t, 28, 2); ctx.fillStyle = h.bump > 0.2 ? "#fde047" : "#fff"; ctx.fillText(t, 28, 2);
          ctx.restore();
        },
        steps: [
          {
            id: "pop", name: { en: "Pop Out", ko: "튀어나오기" },
            cap: { en: "Don't just place it. *Pop it out* with a bounce.", ko: "그냥 놓지 말고 *통통* 튀어나오게." },
            drop(w, it) {
              const cr = w.crate;
              it.x = cr.x + rand(-20, 20); it.y = G - cr.h;
              it.vx = rand(-330, -90); it.vy = rand(-620, -420); it.vr = rand(-10, 10); it.air = true;
            },
          },
          {
            id: "magnet", name: { en: "Magnet", ko: "빨려 들어오기" },
            cap: { en: "Pull it in, *slow then fast*.", ko: "*천천히 → 확*, 가속하며 빨려 와요." },
            collect(w, it) { it.seek = true; it.t = 0; it.x0 = it.x; it.y0 = it.y; },
            update(w, dt) {
              const h = w.hud;
              for (const it of w.items) {
                if (!it.seek || it.dead) continue;
                it.t += dt * 1.6;
                const k = E.in(Math.min(1, it.t)), q = 1 - k;
                const cx = it.x0, cy = it.y0 - 170;
                it.x = q * q * it.x0 + 2 * q * k * cx + k * k * h.x;
                it.y = q * q * it.y0 + 2 * q * k * cy + k * k * h.y;
                it.sc = 1 - 0.4 * k; it.rot += dt * 8;
                if (it.t >= 1) arrive(w, it);
              }
            },
          },
          {
            id: "bump", name: { en: "Counter Bump", ko: "숫자 칸 튀기" },
            cap: { en: "*Bump the counter* every time something lands.", ko: "들어올 때마다 *숫자 칸이 톡*." },
            arrive(w) { w.hud.bump = 1; },
          },
          {
            id: "sparkle", name: { en: "Sparkle", ko: "반짝임" },
            cap: { en: "A tiny *sparkle* where it leaves and where it lands.", ko: "떠날 때, 도착할 때 *반짝*." },
            collect(w, it) { w.spawn({ type: "star", x: it.x, y: it.y, size: 18, life: 0.18, color: "255,255,255" }); },
            arrive(w) {
              const h = w.hud;
              w.spawn({ type: "star", x: h.x, y: h.y, size: 34, life: 0.2, color: "253,224,71" });
              for (let i = 0; i < 6; i++) { const a = rand(0, TAU), s = rand(80, 220); w.spawn({ type: "spark", x: h.x, y: h.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, drag: 5, life: 0.25, size: 2, color: "253,224,71" }); }
            },
          },
          {
            id: "sound", name: { en: "Rising Pitch", ko: "올라가는 음" },
            cap: { en: "Each pickup plays *a little higher*.", ko: "주울수록 음이 *한 칸씩* 올라가요." },
            arrive(w) { w.sfx.blip(w.combo); },
          },
          {
            id: "roll", name: { en: "Rolling Numbers", ko: "굴러가는 숫자" },
            cap: { en: "Numbers should *count up*, not jump.", ko: "숫자는 점프 말고 *굴러가게*." },
            update(w, dt) { const h = w.hud; h.shown += (h.score - h.shown) * Math.min(1, dt * 6); },
          },
        ],
      },

          w.rat = w.actor("rat"); w.rat.maxHp = 0; w.gun = { kick: 0, rot: 0 };
        },
        fire(w) {
          if (w.busy) return;
          w.busy = true;
          const r = w.rat, c = w.cat;
          w.tween(r, { x: c.x + 150 }, 0.13, "in", () => {
            c.hp -= 17;
            w.emit("hurt", c);
            if (c.hp <= 0) w.after(0.5, () => w.tween(c, { hp: 100 }, 0.5, "out"));
            w.tween(r, { x: r.home }, 0.35, "inout", () => { w.busy = false; });
          });
        },
        update(w) { if (!w.on("bar")) w.cat.hpLag = w.cat.hp; },
        drawFront(w, ctx) { drawGun(w, ctx); },
        drawHud(w, ctx) { drawBar(ctx, w.cat, w.on("bar")); },
        steps: [
          {
            id: "flash", name: { en: "Red Flash", ko: "붉은 번쩍임" },
            cap: { en: "Flash the hero *red* for a split second.", ko: "주인공을 *빨갛게* 아주 잠깐." },
            hurt(w, c) { c.tint = 1; },
          },
          {
            id: "knock", name: { en: "Flinch", ko: "움찔" },
            cap: { en: "Push the hero *back*. Squash a little.", ko: "*뒤로* 밀리고, 살짝 찌그러져요." },
            hurt(w, c) { c.ox -= 34; c.sx = 0.84; c.sy = 1.1; },
          },
          {
            id: "bar", name: { en: "Two-layer HP Bar", ko: "두 겹 체력바" },
            cap: { en: "*Red* drops now, *yellow* follows. You *see* the loss.", ko: "*빨강*은 바로, *노랑*은 천천히. 깎인 만큼 *보여요*." },
            hurt(w, c) { c.lagWait = 0.35; c.barShake = 0.3; },
            update(w, dt) {
              const c = w.cat;
              if (c.hpLag < c.hp) c.hpLag = c.hp;
              if (c.lagWait > 0) c.lagWait -= dt; else c.hpLag += (c.hp - c.hpLag) * Math.min(1, dt * 3.5);
            },
          },
          {
            id: "vignette", name: { en: "Red Vignette", ko: "붉은 테두리" },
            cap: { en: "Tint the *screen edges*. Players feel it even mid-chaos.", ko: "*화면 가장자리*를 붉게. 정신없어도 느껴져요." },
            hurt(w) { w.vignette(0.7); },
          },
          {
            id: "iframes", name: { en: "I-frames Blink", ko: "무적 깜빡임" },
            cap: { en: "*Blink* = invincible. Players get it *instantly*.", ko: "*깜빡이는 동안 무적*. 설명 없이도 알아요." },
            hurt(w, c) { c.blink = 0.9; },
          },
          {
            id: "shake", name: { en: "Shake + Stop", ko: "흔들림 + 멈칫" },
            cap: { en: "A short *shake* and a tiny *freeze*.", ko: "짧게 *흔들고*, 아주 잠깐 *멈칫*." },
            hurt(w) { w.shake(0.35, -1); w.hitstop(0.06); },
          },
          {
            id: "sound", name: { en: "Sound", ko: "소리" },
            cap: { en: "A short, *ugly* sound. Getting hit shouldn't sound nice.", ko: "짧고 *거친* 소리. 맞는 소리가 예쁘면 안 돼요." },
            hurt(w) { w.sfx.hurt(); },
          },
        ],
      },

      {
        id: "boom",
        title: { en: "Make explosions *BIG*", ko: "폭발을 *크게*" },
        intro: { en: "That was… an *explosion?*", ko: "이게… *폭발*이라고?" },
        interval: 1.9, stepDur: 3.8,
        setup(w) { w.cat = w.actor("cat"); w.cat.home = w.cat.x = 100; w.rat = w.actor("rat"); },
        fire(w) {
          const c = w.cat; c.sx = 0.9; c.sy = 1.08;
          const x0 = c.x + 40, y0 = G - 90, tx = w.rat.x - 20, T = 0.62, g = 1300;
          const pr = { img: "pine", w: 34, x: x0, y: y0, vx: (tx - x0) / T, vy: (G - 14 - y0 - 0.5 * g * T * T) / T, g, vr: 12, hitY: G - 14 };
          pr.onHit = () => {
            const e = { x: pr.x, y: G - 10 };
            if (!w.on("fire")) w.spawn({ type: "circle", x: e.x, y: e.y - 20, size: 24, size1: 46, life: 0.2, color: "251,146,60", add: false });
            w.emit("boom", e);
            const r = w.rat;
            if (r.alive) { r.hp -= 55; if (r.hp <= 0) w.kill(r); }
          };
          w.emit("fire");
          w.shoot(pr);
        },
        drawHud(w, ctx) { drawBar(ctx, w.rat); },
        steps: [
          {
            id: "flash", name: { en: "White Frame", ko: "하얀 한 프레임" },
            cap: { en: "Start with *one white frame*.", ko: "첫 프레임은 *하얗게*." },
            boom(w) { w.flash("255,250,235", 0.9); },
          },
          {
            id: "ring", name: { en: "Shockwave", ko: "충격파" },
            cap: { en: "A *ring* that pushes everything *away*.", ko: "주변을 *밀어내는* 고리." },
            boom(w, e) {
              w.spawn({ type: "ring", x: e.x, y: e.y - 30, size: 10, size1: 200, life: 0.42, w: 14, color: "255,236,200" });
              w.spawn({ type: "ring", x: e.x, y: e.y, size: 10, size1: 150, life: 0.35, w: 6, color: "255,200,120", flat: true });
              const r = w.rat; if (r.alive) { r.flash = 1; r.ox += 40; r.sx = 0.8; r.sy = 1.2; }
            },
            kill(w, r) { w.fly(r, 380, -760, 9); },
          },
          {
            id: "fire", name: { en: "Fire → Smoke", ko: "불 → 연기" },
            cap: { en: "Fire *fades into smoke*. Smoke *lingers*.", ko: "불은 *연기로* 바뀌고, 연기는 *오래* 남아요." },
            boom(w, e) {
              w.spawn({ type: "glow", x: e.x, y: e.y - 40, size: 110, size1: 40, life: 0.32, color: "255,170,60" });
              for (let i = 0; i < 16; i++) w.spawn({ type: "glow", x: e.x + rand(-20, 20), y: e.y - rand(10, 40), vx: rand(-240, 240), vy: rand(-340, -60), drag: 3.5, size: rand(22, 34), size1: 4, life: rand(0.35, 0.6), color: i % 3 ? "255,140,40" : "255,220,120" });
              w.after(0.12, () => {
                for (let i = 0; i < 12; i++) w.spawn({ type: "smoke", x: e.x + rand(-50, 50), y: e.y - rand(20, 80), vx: rand(-60, 60), vy: rand(-70, -25), drag: 1, size: rand(14, 22), size1: rand(40, 60), life: rand(1.1, 1.8), color: "70,70,82" });
              });
            },
          },
          {
            id: "debris", name: { en: "Debris", ko: "파편" },
            cap: { en: "Throw *chunks*. Let them *bounce* and settle.", ko: "*파편*을 날리고, *통통* 튀다 멈추게." },
            boom(w, e) {
              for (let i = 0; i < 16; i++) w.spawn({ type: "chunk", x: e.x, y: e.y - 14, vx: rand(-420, 420), vy: rand(-720, -260), g: 1600, ground: true, bounce: 0.35, vr: rand(-20, 20), life: rand(1.8, 2.6), size: rand(5, 10), color: pick(["120,82,50", "92,64,40", "160,120,70"]), hold: true });
              for (let i = 0; i < 12; i++) { const a = rand(-Math.PI, 0), s = rand(300, 800); w.spawn({ type: "spark", x: e.x, y: e.y - 20, vx: Math.cos(a) * s, vy: Math.sin(a) * s, drag: 4, life: rand(0.2, 0.4), size: 2.5, color: "255,210,140" }); }
            },
          },
          {
            id: "shake", name: { en: "Big Shake", ko: "큰 흔들림" },
            cap: { en: "Go big. *Explosions are allowed to shake.*", ko: "크게. *폭발은 흔들어도 돼요*." },
            boom(w) { w.shake(0.9); },
          },
          {
            id: "slowmo", name: { en: "Slow-mo", ko: "슬로모션" },
            cap: { en: "*Slow time* for half a second, then snap back.", ko: "*0.5초* 느리게, 그리고 확 원래대로." },
            boom(w) { w.slowmo(0.2, 0.5); },
          },
          {
            id: "scorch", name: { en: "Scorch Mark", ko: "그을음" },
            cap: { en: "Leave a *scorch mark*. The world remembers.", ko: "*그을린 자국*을 남겨요. 흔적이 남아야 해요." },
            boom(w, e) { w.spawn({ type: "ellipse", under: true, x: e.x, y: G + 2, size: 85, life: 6, color: "15,10,8", alpha: 0.65, hold: true, add: false }); },
          },
          {
            id: "sound", name: { en: "Sound", ko: "소리" },
            cap: { en: "Low *boom* + a sharp *crack* on top.", ko: "낮은 *쿵* 위에 날카로운 *팍*." },
            fire(w) { w.sfx.toss(); },
            boom(w) { w.sfx.boom(); },
          },
        ],
      },
    ];
    RECIPES.forEach((R, i) => { R.no = i + 1; });

    function arrive(w, it) {
      it.dead = true;
      w.hud.score += 15; w.combo++; w.comboT = 1;
      w.emit("arrive", it);
    }

    /* ───────── 화면 / 앱 ───────── */
    const $ = id => document.getElementById(id);
    const stage = $("stage"), cv = $("cv"), ctx = cv.getContext("2d");
    const VIEW_MAIN = { x: 0, y: 300, s: 1 };
    const VIEW_A = { x: 48.6, y: 226, s: 0.82, clip: true };
    const VIEW_B = { x: 48.6, y: 542, s: 0.82, clip: true };
    const UI = {
      ko: { cta: ["코드 받고 싶다면?", "댓글에 <em>FX</em> 남기면", "DM으로 코드 보내드려요 📩", "다음 게임 만들 때 쓰게 저장 🔖"], step: "단계" },
      en: { cta: ["Want the code?", "Comment <em>FX</em> below", "and I'll DM it to you 📩", "Save this for your next game 🔖"], step: "STEP" },
    };

    const app = {
      ri: 0, n: 0, lang: "en", auto: true, mute: false, split: false,
      mode: "browse", playing: false, ended: false, segs: [], si: 0, segT: 0, autoT: 0, worlds: [],
    };
    try {
      app.lang = localStorage.getItem("fxtip-lang") || "en";
      app.mute = localStorage.getItem("fxtip-mute") === "1";
    } catch (e) {}

    const R = () => RECIPES[app.ri];
    function makeWorlds(split, n) {
      app.worlds = split
        ? [new World(R(), 0, VIEW_A, true), new World(R(), R().steps.length, VIEW_B)]
        : [new World(R(), n, VIEW_MAIN)];
    }
    function fireAll() { for (const w of app.worlds) w.R.fire(w); }
    function fmt(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])).replace(/\*(.+?)\*/g, "<em>$1</em>"); }
    function plain(s) { return String(s).replace(/\*/g, ""); }
    function repop(el) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }

    let lastKey = "";
    function renderOverlay(seg) {
      const r = R(), L = app.lang, N = r.steps.length;
      $("ovTag").textContent = "GLONOMY · FX TIP #" + String(r.no).padStart(2, "0");
      $("ovTitle").innerHTML = fmt(r.title[L]);
      const pill = $("ovPill"), cap = $("ovCap");
      stage.classList.toggle("split", seg.k === "split");
      $("ovCta").classList.toggle("show", seg.k === "cta");
      stage.classList.toggle("cta-on", seg.k === "cta");
      if (seg.k === "step") {
        const s = r.steps[seg.n - 1];
        pill.className = "pill"; pill.style.visibility = "visible";
        pill.innerHTML = `<b>${seg.n}</b>${fmt(s.name[L])}`;
        cap.innerHTML = fmt(s.cap[L]);
      } else if (seg.k === "split") {
        pill.className = "pill plain"; pill.style.visibility = "visible";
        pill.textContent = "BEFORE  →  AFTER";
        cap.innerHTML = "";
      } else if (seg.k === "cta") {
        pill.style.visibility = "hidden"; cap.innerHTML = "";
      } else {
        pill.style.visibility = "hidden";
        cap.innerHTML = fmt(r.intro[L]);
      }
      const n = seg.k === "intro" ? 0 : seg.k === "step" ? seg.n : N;
      $("ovDots").innerHTML = r.steps.map((_, i) => `<i class="${i < n ? "on" : ""}${i + 1 === n && seg.k === "step" ? " cur" : ""}">${i + 1}</i>`).join("");
      const c = UI[L].cta;
      $("ovCta").innerHTML = `<div class="q">${c[0]}</div><div class="c">${c[1]}<br>${c[2]}</div><div class="s">${c[3]}</div>`;
      const key = r.id + seg.k + seg.n + L;
      if (key !== lastKey) { lastKey = key; repop(cap); repop(pill); }
    }
    function browseSeg() { return app.split ? { k: "split" } : app.n ? { k: "step", n: app.n } : { k: "intro", n: 0 }; }

    /* 녹화 모드 타임라인 */
    function buildSegs() {
      const r = R(), segs = [{ k: "intro", n: 0, dur: 3.6 }];
      r.steps.forEach((s, i) => segs.push({ k: "step", n: i + 1, dur: r.stepDur }));
      segs.push({ k: "split", dur: 5.4 });
      segs.push({ k: "cta", n: r.steps.length, dur: 3.8 });
      return segs;
    }
    function enterSeg(seg) {
      if (seg.k === "split") makeWorlds(true);
      else if (app.worlds.length !== 1 || seg.k === "intro" || seg.k === "cta") makeWorlds(false, seg.n);
      else app.worlds[0].setN(seg.n);
      if (seg.k === "step") { const s = R().steps[seg.n - 1]; if (s.enter) s.enter(app.worlds[0]); }
      app.autoT = R().interval * 0.55;
      renderOverlay(seg);
    }
    function startRec() {
      app.mode = "rec"; app.playing = false; app.ended = false;
      document.body.classList.add("rec", "rec-ready");
      makeWorlds(false, 0); renderOverlay({ k: "intro", n: 0 });
      layout();
    }
    function beginPlayback() {
      document.body.classList.remove("rec-ready");
      audioInit();
      app.segs = buildSegs(); app.si = 0; app.segT = 0; app.playing = true;
      enterSeg(app.segs[0]);
    }
    function exitRec() {
      app.mode = "browse"; app.playing = false; app.ended = false;
      document.body.classList.remove("rec", "rec-ready");
      makeWorlds(app.split, app.n); renderOverlay(browseSeg());
      layout();
    }

    /* 레이아웃 */
    const DPR = () => Math.min(window.devicePixelRatio || 1, 2.5);
    let scale = 1;
    function layout() {
      const rect = stage.getBoundingClientRect();
      if (!rect.width) return;
      scale = rect.width / 540;
      stage.style.setProperty("--u", scale + "px");
      cv.width = Math.round(rect.width * DPR());
      cv.height = Math.round(rect.height * DPR());
    }
    window.addEventListener("resize", layout);

    /* 배경 */
    function drawBg() {
      const g = ctx.createLinearGradient(0, 0, 0, 960);
      g.addColorStop(0, "#0b1020"); g.addColorStop(0.5, "#101a30"); g.addColorStop(1, "#090d18");
      ctx.fillStyle = g; ctx.fillRect(0, 0, 540, 960);
      const s = ctx.createRadialGradient(270, 500, 20, 270, 500, 330);
      s.addColorStop(0, "rgba(120,150,220,0.12)"); s.addColorStop(1, "rgba(120,150,220,0)");
      ctx.fillStyle = s; ctx.fillRect(0, 0, 540, 960);
      ctx.fillStyle = "rgba(255,255,255,0.035)";
      for (let y = 30; y < 960; y += 36) for (let x = 18 + ((y / 36) % 2) * 18; x < 540; x += 36) ctx.fillRect(x, y, 2, 2);
    }

    /* 루프 */
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (app.mode === "rec" && app.playing && !app.ended) {
        app.segT += dt;
        if (app.segT >= app.segs[app.si].dur) {
          app.segT = 0; app.si++;
          if (app.si >= app.segs.length) { app.ended = true; app.si = app.segs.length - 1; }
          else enterSeg(app.segs[app.si]);
        }
      }
      const autoOn = app.mode === "rec" ? app.playing : app.auto;
      if (autoOn) { app.autoT += dt; if (app.autoT >= R().interval) { app.autoT = 0; fireAll(); } }
      for (const w of app.worlds) w.update(dt);

      const k = (cv.width / 540);
      ctx.setTransform(k, 0, 0, k, 0, 0);
      drawBg();
      for (const w of app.worlds) w.draw(ctx);
      requestAnimationFrame(frame);
    }

    /* 조작부 */
    function renderRecipes() {
      $("recipes").innerHTML = RECIPES.map((r, i) =>
        `<button type="button" class="rc${i === app.ri ? " active" : ""}" data-i="${i}"><b>${r.no}</b>${plain(r.title.ko)}</button>`).join("");
    }
    function renderSteps() {
      const r = R();
      const chips = [`<button type="button" class="chip${app.n === 0 ? " cur" : " on"}" data-n="0">0 · 효과 없음</button>`]
        .concat(r.steps.map((s, i) => {
          const n = i + 1, cls = n === app.n ? " cur" : n < app.n ? " on" : "";
          return `<button type="button" class="chip${cls}" data-n="${n}">${n} · ${s.name.ko}</button>`;
        }));
      $("steps").innerHTML = chips.join("");
      $("autoBtn").setAttribute("aria-pressed", app.auto);
      $("soundBtn").setAttribute("aria-pressed", !app.mute);
      $("soundBtn").textContent = app.mute ? "소리 꺼짐" : "소리";
      $("splitBtn").setAttribute("aria-pressed", app.split);
      $("langBtn").textContent = "자막: " + (app.lang === "en" ? "EN" : "한글");
    }

    function dedent(src) {
      const lines = src.split("\n");
      const ind = lines.slice(1).filter(l => l.trim()).reduce((m, l) => Math.min(m, l.match(/^\s*/)[0].length), 99);
      return [lines[0]].concat(lines.slice(1).map(l => l.slice(Math.min(ind, l.match(/^\s*/)[0].length)))).join("\n");
    }
    function stepCode(s, i) {
      const fns = Object.keys(s).filter(k => typeof s[k] === "function").map(k => dedent(s[k].toString()));
      return `// STEP ${i + 1} · ${s.name.en} (${s.name.ko})\n// ${plain(s.cap.ko)}\n` + fns.join("\n\n");
    }
    function recipeCode(r) {
      const base = ["setup", "fire", "update"].filter(k => typeof r[k] === "function").map(k => dedent(r[k].toString()));
      return `// ${plain(r.title.en)} — ${plain(r.title.ko)}\n// 기본 동작 (효과 없음)\n${base.join("\n\n")}\n\n` + r.steps.map(stepCode).join("\n\n");
    }
    const engineCode = () => "// 엔진: w.spawn / w.shake / w.hitstop / w.slowmo / w.flash / w.after / w.tween …\n" + dedent(World.toString());
    function renderCode() {
      const r = R();
      const blocks = r.steps.map((s, i) => `
        <div class="cs">
          <div class="cs-h"><b>${i + 1}</b><span>${s.name.ko} <small>· ${s.name.en}</small></span><button type="button" class="copy" data-copy="s${i}">복사</button></div>
          <pre>${fmt(stepCode(s, i)).replace(/<em>|<\/em>/g, "*")}</pre>
        </div>`).join("");
      $("code").innerHTML = `
        <h2>코드</h2>
        <p>단계마다 들어간 코드 그대로입니다. 함수 이름이 그 순간이에요 — <b>fire</b>는 쏠 때, <b>hit</b>는 맞을 때, <b>kill</b>은 쓰러질 때, <b>update</b>는 매 프레임.</p>
        <div class="row" style="margin-bottom:10px">
          <button type="button" class="btn" data-copy="all">이 레시피 전체 복사</button>
          <button type="button" class="btn" data-copy="engine">엔진 코드 복사</button>
        </div>
        ${blocks}
        <details class="cs"><summary class="cs-h"><b>⚙</b><span>엔진 (World) <small>· spawn·shake·hitstop 등</small></span></summary><pre>${fmt(engineCode()).replace(/<em>|<\/em>/g, "*")}</pre></details>`;
    }
    function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1300); }
    function copyText(text) {
      const done = () => toast("복사했어요");
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallback());
      else fallback();
      function fallback() {
        const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} ta.remove();
      }
    }

    function selectRecipe(i) {
      app.ri = i; app.n = 0;
      try { history.replaceState(null, "", "#" + R().id); } catch (e) {}
      makeWorlds(app.split, app.n);
      renderRecipes(); renderSteps(); renderCode(); renderOverlay(browseSeg());
      const b = $("recipes").querySelector(".rc.active"); if (b && b.scrollIntoView) b.scrollIntoView({ inline: "center", block: "nearest" });
    }
    function setN(n) {
      app.n = n;
      if (app.split) { app.split = false; makeWorlds(false, n); }
      else app.worlds[0].setN(n);
      const s = R().steps[n - 1]; if (s && s.enter) s.enter(app.worlds[0]);
      app.autoT = R().interval * 0.6;
      renderSteps(); renderOverlay(browseSeg());
    }

    document.addEventListener("pointerdown", audioInit, { capture: true });
    $("recipes").addEventListener("click", e => { const b = e.target.closest(".rc"); if (b) selectRecipe(+b.dataset.i); });
    $("steps").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) setN(+b.dataset.n); });
    $("autoBtn").addEventListener("click", () => { app.auto = !app.auto; renderSteps(); });
    $("soundBtn").addEventListener("click", () => { app.mute = !app.mute; try { localStorage.setItem("fxtip-mute", app.mute ? "1" : "0"); } catch (e) {} renderSteps(); });
    $("splitBtn").addEventListener("click", () => { app.split = !app.split; makeWorlds(app.split, app.n); renderSteps(); renderOverlay(browseSeg()); });
    $("langBtn").addEventListener("click", () => {
      app.lang = app.lang === "en" ? "ko" : "en";
      try { localStorage.setItem("fxtip-lang", app.lang); } catch (e) {}
      renderSteps(); renderOverlay(browseSeg());
    });
    $("recBtn").addEventListener("click", startRec);
    $("code").addEventListener("click", e => {
      const b = e.target.closest("[data-copy]"); if (!b) return;
      const k = b.dataset.copy, r = R();
      copyText(k === "all" ? recipeCode(r) : k === "engine" ? engineCode() : stepCode(r.steps[+k.slice(1)], +k.slice(1)));
    });
    stage.addEventListener("pointerdown", e => {
      e.preventDefault();
      audioInit();
      if (app.mode === "rec") {
        if (document.body.classList.contains("rec-ready")) beginPlayback();
        else if (app.ended) exitRec();
        return;
      }
      fireAll();
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && app.mode === "rec") exitRec(); });

    /* 시작 */
    loadImages().then(() => {
      const hash = location.hash.slice(1);
      const idx = RECIPES.findIndex(r => r.id === hash);
      layout();
      selectRecipe(idx >= 0 ? idx : 0);
      requestAnimationFrame(t => { last = t; frame(t); });
    });

    // 테스트용
    window.__fx = { app, RECIPES, setN, selectRecipe, fireAll, startRec, beginPlayback };
  })();
  </script>
</body>
</html>
